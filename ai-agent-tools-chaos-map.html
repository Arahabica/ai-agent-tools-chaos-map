<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIエージェント周辺ツール カオスマップ 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFBF7;
  --grid:#E4E9E0;
  --ink:#17212B;
  --sub:#5B6672;
  --line:#C9D2CC;
  --panel:#FFFFFF;
  --t-pioneer:#B08A2E;
  --t-main:#31517A;
  --t-rising:#3D8B57;
  --t-expert:#6B4F7A;
  --t-security:#A33D3D;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"IBM Plex Sans JP",-apple-system,"Hiragino Sans",sans-serif;
  color:var(--ink);
  background:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:28px 28px;
  line-height:1.5;
}
.wrap{max-width:1360px;margin:0 auto;padding:18px 16px 48px}

/* ---------- compact header ---------- */
header{
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 24px;
  border-bottom:3px solid var(--ink);padding-bottom:12px;margin-bottom:6px;
}
.h-left .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.18em;color:var(--sub)}
h1{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(20px,3.4vw,32px);line-height:1.2}
h1 .accent{color:#B4552D}
.h-right{display:flex;flex-direction:column;gap:4px;margin-left:auto;padding-bottom:2px}
.tier-legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;align-items:center}
.tier-key{display:inline-flex;align-items:center;gap:4px;color:var(--sub);font-weight:500}
.tier-key .ring{width:11px;height:11px;border:2.5px solid #888;background:#fff}
.legend-note{font-family:"IBM Plex Mono",monospace;color:var(--sub);font-size:10px}

/* ---------- zones (dense) ---------- */
.zone{display:flex;gap:8px;margin-top:12px}
.zone-rail{
  flex:0 0 30px;
  writing-mode:vertical-rl;
  font-family:"Shippori Mincho B1",serif;
  font-weight:700;font-size:15px;letter-spacing:.3em;
  color:#fff;text-align:center;padding:12px 0;
  display:flex;align-items:center;justify-content:center;
}
.zone-body{flex:1;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}

/* ---------- category panels: icon clouds ---------- */
.panel{
  background:var(--panel);
  border:2px solid var(--hue,#888);
  padding:8px 10px 6px;
  box-shadow:0 1px 0 rgba(23,33,43,.06);
  cursor:zoom-in;
  transition:box-shadow .15s,transform .15s;
  flex:1 1 auto;
}
.panel:hover{box-shadow:0 4px 14px rgba(23,33,43,.16);transform:translateY(-1px)}
.panel h2{
  font-size:12.5px;font-weight:700;line-height:1.3;
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  margin-bottom:2px;
}
.panel h2 .count{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:400;color:var(--sub)}
.cloud{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:flex-start}
.tile{
  width:74px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px 4px;
  cursor:zoom-in;
  transition:transform .12s;
}
.tile:hover{transform:scale(1.14);z-index:3;position:relative}
.tile .ic{
  width:48px;height:48px;
  background:#fff;border:2.5px solid var(--tier,#98a0a8);
  box-shadow:0 2px 6px rgba(23,33,43,.16);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.tile .ic img{width:36px;height:36px;object-fit:contain}
.tile .ic.mono{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:700;color:#fff;background:var(--mono-bg,#8a8f98)}
.tile .nm{
  font-size:10px;font-weight:700;line-height:1.15;text-align:center;
  max-width:74px;overflow-wrap:break-word;
}

footer{margin-top:28px;border-top:1px solid var(--line);padding-top:10px;font-size:11px;color:var(--sub)}
footer p+p{margin-top:3px}

/* ---------- zoom overlay ---------- */
#ov{
  position:fixed;inset:0;z-index:50;display:none;
  background:rgba(23,33,43,.45);
  backdrop-filter:blur(3px);
  overflow-y:auto;
  padding:4vh 16px 6vh;
}
#ov.open{display:block}
#ovPanel{
  max-width:1080px;margin:0 auto;
  background:var(--paper);
  border:3px solid var(--hue,#888);
  box-shadow:0 18px 60px rgba(0,0,0,.35);
  padding:22px 26px 28px;
  transform-origin:center top;
}
#ovPanel.zooming{transition:transform .28s cubic-bezier(.2,.8,.25,1),opacity .28s}
.crumbs{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font-size:12.5px;font-family:"IBM Plex Mono",monospace;color:var(--sub);
  margin-bottom:14px;
}
.crumbs a{color:var(--ink);text-decoration:none;border-bottom:1px dashed var(--sub);cursor:pointer}
.crumbs a:hover{color:#B4552D;border-color:#B4552D}
.crumbs .sep{color:var(--line)}
.crumbs .cur{font-weight:700;color:var(--ink)}
.ov-close{
  float:right;
  font-family:"IBM Plex Mono",monospace;font-size:12px;
  border:1.5px solid var(--ink);background:#fff;
  padding:4px 10px;cursor:pointer;
}
.ov-close:hover{background:var(--ink);color:#fff}
.ov-title{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(20px,3.6vw,30px);line-height:1.3}
.ov-desc{font-size:13.5px;color:var(--sub);margin-top:4px}
.tier-badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10.5px;font-weight:700;letter-spacing:.04em;
  padding:1px 7px;color:#fff;
}
.tier-badge.pioneer{background:var(--t-pioneer)}
.tier-badge.main{background:var(--t-main)}
.tier-badge.rising{background:var(--t-rising)}
.tier-badge.expert{background:var(--t-expert)}
.tier-badge.security{background:var(--t-security)}
.mini{
  font-size:10px;font-family:"IBM Plex Mono",monospace;color:var(--sub);
  border:1px solid var(--line);padding:0 5px;
}

/* category view */
.relwrap{position:relative;margin-top:20px}
.relsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:58px 54px;position:relative;z-index:1}
.tcard{
  background:#fff;border:1px solid var(--line);
  padding:11px 12px;cursor:zoom-in;
  box-shadow:0 1px 0 rgba(23,33,43,.06);
  transition:box-shadow .15s,transform .15s;
  display:flex;flex-direction:column;gap:6px;
}
.tcard:hover{box-shadow:0 5px 16px rgba(23,33,43,.2);transform:translateY(-2px)}
.tcard .row1{display:flex;align-items:center;gap:9px}
.tcard .ic{
  width:40px;height:40px;flex:none;
  background:#fff;border:2px solid var(--tier,#98a0a8);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.tcard .ic img{width:30px;height:30px;object-fit:contain}
.tcard .ic.mono{font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:700;color:#fff;background:var(--mono-bg,#8a8f98)}
.tcard .nm{font-weight:700;font-size:14px;line-height:1.25;flex:1}
.tcard .d{font-size:11.5px;color:var(--sub)}
.tcard .row2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.xrel{margin-top:22px;border-top:1px dashed var(--line);padding-top:14px}
.xrel h3,.rel-legend h3,.svc-rels h3,.svc-sibs h3{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--sub);margin-bottom:8px}
.xrel-items{display:flex;flex-direction:column;gap:6px}
.xrel-item{font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xrel-item a{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:1px dashed var(--sub);cursor:pointer}
.xrel-item a:hover{color:#B4552D;border-color:#B4552D}
.xrel-item .cat-of{font-size:11px;color:var(--sub)}
.reltag{font-size:10.5px;font-weight:700;color:#fff;padding:1px 8px;flex:none}
.rel-legend{margin-top:18px;border-top:1px dashed var(--line);padding-top:12px}
.rel-legend .items{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--sub);align-items:center}
.rel-legend .sw{display:inline-block;width:22px;height:0;border-top-width:2.5px;margin-right:5px;vertical-align:middle}

/* service view */
.svc-head{display:flex;gap:16px;align-items:flex-start;margin-top:6px}
.svc-head .ic{
  width:76px;height:76px;flex:none;
  background:#fff;border:3px solid var(--tier,#98a0a8);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 3px 10px rgba(23,33,43,.15);
}
.svc-head .ic img{width:56px;height:56px;object-fit:contain}
.svc-head .ic.mono{font-family:"IBM Plex Mono",monospace;font-size:32px;font-weight:700;color:#fff;background:var(--mono-bg,#8a8f98)}
.svc-meta{flex:1}
.svc-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.svc-link{font-family:"IBM Plex Mono",monospace;font-size:12px;color:#31517A;text-decoration:none;border-bottom:1px solid #31517A}
.svc-link:hover{color:#B4552D;border-color:#B4552D}
.svc-body{margin-top:18px;font-size:14.5px;line-height:1.9;max-width:820px}
.svc-cat-line{font-size:12px;color:var(--sub);margin-top:4px}
.svc-rels,.svc-sibs{margin-top:22px;border-top:1px dashed var(--line);padding-top:14px}
.sib-cloud{display:flex;flex-wrap:wrap}
.sib-cloud .tile{width:70px}
.sib-cloud .tile .ic{width:42px;height:42px}
.sib-cloud .tile .ic img{width:31px;height:31px}

@media(max-width:640px){
  .zone{gap:6px}
  .zone-rail{flex-basis:26px;font-size:13px;letter-spacing:.22em}
  .tile{width:64px}
  .tile .ic{width:42px;height:42px}
  .tile .ic img{width:31px;height:31px}
  #ovPanel{padding:16px 14px 22px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:26px 14px}
}
@media print{body{background:none}}
</style>
</head>

ル連携にも広がっている。", "pi-agent": "Mario Zechner氏が開発する超ミニマルなオープンソースのコーディングエージェント(pi.dev)。ツールはread・write・edit・bashの4つのみ、システムプロンプトは1,000トークン未満という徹底した最小設計で、MCPやプランモードのような機能をあえて持たず、必要なものはユーザーが拡張やスキルで足していく思想を貫く。パーソナルエージェントOpenClawが内部の実行エンジンとして採用したことで広く知られるようになり、GitHubスターは6万を超える。モデル性能だけでなく「エージェントをどう動かすか」というハーネス層の設計が競争軸になったことを象徴する存在。", "opencode": "オープンソースのターミナル型コーディングエージェント。特定ベンダーに依存せず、Anthropic・OpenAI・Google・ローカルモデルなど任意のLLMを接続して使えるプロバイダー非依存設計と、完成度の高いターミナルUI、クライアント/サーバー構成による拡張性が特徴。「Claude CodeのOSS代替」の代表格としてコミュニティで急速に支持を集め、GitHubスターも多い。モデルの選択肢を自分で握りながらエージェントコーディングを行いたい開発者の定番になりつつある。", "openai-codex": "OpenAIが提供するコーディングエージェント。クラウド上のサンドボックス環境で動くエージェントに、機能実装・バグ修正・PR作成などのタスクを並列に依頼できる。ローカルで動くCLI版も提供されており、ChatGPTのサブスクリプションと連携して使える。GitHub連携によりリポジトリを直接扱え、複数タスクの同時進行を前提とした設計が特徴。", "openhands": "旧称OpenDevin。Devinの登場を受けてコミュニティ主導で始まった、オープンソースの自律型開発エージェントプラットフォーム。サンドボックス環境内でコード編集・コマンド実行・Webブラウジングを行い、Issueの解決からPR作成までを自律的にこなす。SWE-benchなどのベンチマークで高いスコアを示し、研究・実務の両面で参照されることが多い。クラウド版も提供されている。", "jules": "Googleが提供する非同期型のコーディングエージェント。GitHubリポジトリと連携し、Issueやタスクを依頼するとクラウド上のVMでコードを解析・修正し、変更計画とdiffを提示してPRを作成する。「依頼して待つ」タイプのエージェントで、Gemini CLIのような対話型とは補完関係にある。バグ修正や依存関係の更新など、バックログ消化に向く。", "v0": "Vercelが提供する生成UIサービス。自然言語で指示するとReact+Tailwind CSS(shadcn/ui)ベースのUIコードを生成し、プレビューを見ながら対話的に修正できる。生成物はコードとしてエクスポートでき、Vercelへのデプロイもシームレス。デザインモックアップから実装済みコンポーネントまでの距離を一気に縮めるツールとして、フロントエンド開発者やデザイナーに広く使われている。", "bolt-new": "StackBlitzが提供するブラウザ完結型のAIアプリ生成サービス。WebContainer技術によりブラウザ内でNode.js環境を動かし、プロンプトからフルスタックアプリの生成・実行・デプロイまでを完結させる。オープンソース版のbolt.diyも公開されており、任意のLLMを接続して自前で動かせる。プロトタイピング速度の速さで人気を得た。", "lovable": "スウェーデン発のAIアプリ生成サービス。自然言語での対話を通じてWebアプリを構築し、Supabase連携によるバックエンド(DB・認証)まで含めて動くプロダクトを作れる。非エンジニアでもアイデアを形にできる手軽さで急成長し、欧州で最速級のARR成長を記録したスタートアップとして知られる。GitHub連携でコードの所有権もユーザー側にある。", "replit-agent": "クラウドIDEのReplitが提供するアプリ構築エージェント。自然言語で要望を伝えると、環境構築からコード生成、データベース設定、デプロイまでをReplitのクラウド上で一気通貫で行う。開発環境の準備が一切不要な点が最大の強みで、モバイルアプリからも操作できる。非エンジニアの社内ツール開発用途でも広く使われるようになった。", "base44": "プロンプトからフルスタックアプリを生成するノーコード系サービス。認証・データベース・ホスティングなどを内蔵し、コードを意識せずに動くアプリを作れる手軽さが特徴。個人開発者が立ち上げたサービスながら急成長し、Wixに買収されたことで話題になった。業務ツールや社内アプリを素早く作る用途に向く。", "google-ai-studio": "GoogleのGeminiを使うための公式開発ハブ。プロンプトの試作やAPIキー発行の場として始まり、現在は「Build」機能により、自然言語で指示するだけでGeminiを組み込んだWebアプリを生成し、そのまま公開・共有できるようになっている。ブラウザだけで無料から始められる手軽さが特徴で、終了予定のFirebase Studioからの移行先としても案内されている。Geminiエコシステムでアプリを作る際の実質的な入口。", "google-opal": "Google Labsが提供する、ノーコードでAIミニアプリを構築・共有できるツール。「入力→生成→出力」というシンプルなノード構成を自然言語の指示や直感的なUI操作で組み立て、作ったアプリはURLですぐにチームへ共有できる。2025年7月に米国で提供が始まり、同年10月に日本を含む15か国へ拡大。完全無料で使え、テンプレートのRemixから始められる手軽さもあって、非エンジニアの業務改善ツール作成の入口として注目されている。", "create": "テキストから、サイト・アプリ・内部ツールなどを生成するAIビルダー。プロンプトを書くとフロントエンドとバックエンド機能を含むプロダクトを組み立て、そのまま公開できる。複数のAIモデルを裏側で使い分け、非エンジニアがアイデアを最速で形にすることに焦点を当てている。米国発のスタートアップで、バイブコーディング系サービスの一角。\n\n---", "langchain": "LLMアプリケーション開発フレームワークの草分けであり、最大のエコシステムを持つオープンソース。プロンプト管理、モデル抽象化、ツール呼び出し、RAGなどの部品を組み合わせてアプリを構築できる。Python版とJavaScript/TypeScript版があり、対応するインテグレーション(モデル・ベクトルDB・外部サービス)の数は群を抜く。エージェント時代には後述のLangGraphへと発展し、周辺にLangSmithなどの商用サービス群を持つ。", "langgraph": "LangChainチームが開発した、エージェントの制御フローを「状態を持つグラフ」として設計するフレームワーク。各ステップをノード、遷移をエッジで表現し、分岐・ループ・人間の承認(Human-in-the-loop)・チェックポイントによる中断再開を厳密に制御できる。自由度の高い自律エージェントではなく、信頼性が求められる本番システム向けの設計思想が特徴。マネージド実行環境のLangGraph Platformも提供される。", "llamaindex": "データ接続とRAG(検索拡張生成)に強みを持つLLMアプリフレームワーク。多様なデータソースからの取り込み、インデックス構築、クエリエンジンといったRAGの部品を豊富に備え、エージェントワークフロー機能も拡充している。商用側では、複雑なドキュメント解析のLlamaParseやマネージド基盤のLlamaCloudを展開し、「企業データをLLMにつなぐ」領域で確固たる地位を築いている。", "crewai": "「役割(Role)を持つエージェントのチーム=クルー」という比喩でマルチエージェントを構築するPythonフレームワーク。各エージェントに役割・目標・背景設定を与え、タスクを順次または階層的に協働させる設計が直感的で、マルチエージェント入門として絶大な人気を得た。より厳密な制御を行うFlows機能や、デプロイ・監視を担う商用プラットフォーム(AMP)も提供している。", "autogen-ag2": "Microsoft Researchから生まれたマルチエージェント会話フレームワーク。複数のエージェントが会話を通じて協調しタスクを解決する「対話ベース」の設計が特徴で、コード実行エージェントとレビューエージェントの組み合わせなどの研究的ユースケースを切り開いた。現在はコミュニティ主導のAG2が開発を継続する一方、Microsoft本体はSemantic Kernelと統合した後継「Microsoft Agent Framework」への移行を進めており、新規採用時は後継側も含めて検討したい。", "semantic-kernel": "Microsoftが開発するエンタープライズ向けのAIオーケストレーションSDK。C#・Python・Javaに対応し、既存の業務システムにLLM機能やエージェントを組み込むことを重視した設計。プラグインによる関数呼び出し、プランナー、メモリなどの機能を備え、Azure OpenAIとの親和性が高い。.NET系エンタープライズ環境の定番だが、MicrosoftはAutoGenと統合した後継「Microsoft Agent Framework」への移行を進めており、新規プロジェクトでは後継側が推奨されつつある。", "openai-agents-sdk": "OpenAIが公開した軽量なエージェント構築SDK。実験的だったSwarmを本番向けに発展させたもので、「エージェント」「ハンドオフ(エージェント間のタスク引き継ぎ)」「ガードレール」という少数の抽象だけでマルチエージェントを組める簡潔さが特徴。トレーシング機能を内蔵し、OpenAIのResponses APIやツール群と自然に統合される。OpenAIエコシステムでの標準的な選択肢。", "google-adk": "GoogleのAgent Development Kit。Geminiを中心としつつモデル非依存で使えるエージェント構築フレームワークで、階層的なマルチエージェント構成、豊富なツール連携、評価機能などを備える。エージェント同士が相互運用するためのA2A(Agent2Agent)プロトコルと対をなす存在で、Google CloudのVertex AI Agent Engineにデプロイして本番運用する流れまで整備されている。", "mastra": "TypeScript向けのオープンソースAIエージェントフレームワーク。静的サイトジェネレータGatsbyの開発チームが立ち上げたことで注目された。エージェント、ワークフロー(耐久性のあるグラフベース実行)、RAG、評価、ローカル開発用のプレイグラウンドまでを一体で提供し、「TS開発者がエージェントを作るときの標準スタック」を狙う。クラウド版によるデプロイ・監視も提供。", "pydantic-ai": "Pythonのデータ検証ライブラリとして絶大なシェアを持つPydanticのチームが開発したエージェントフレームワーク。型安全性と構造化出力を中核に据え、「FastAPIのような開発体験をLLMアプリに」という思想で設計されている。依存性注入によるテスト容易性、主要モデルへの対応、Logfireとの連携による観測性など、堅実なエンジニアリングを好む層に支持されている。", "smolagents": "Hugging Faceが開発した軽量エージェントライブラリ。エージェントがJSONでツールを呼ぶのではなく、Pythonコードを書いて実行する「コードエージェント」方式を中核に据えるのが特徴で、少ないステップ数で複雑な処理を表現できる。コアのコードが約1,000行と小さく、学習用途にも本番の小規模エージェントにも使いやすい。Hugging Face Hubのモデル・ツールと自然に連携する。", "vercel-ai-sdk": "Vercelが開発する、JavaScript/TypeScript向けAI開発ツールキットの事実上の標準。プロバイダー抽象化により、OpenAI・Anthropic・Googleなどのモデルを統一APIで切り替えられ、ストリーミングUI、構造化出力、ツール呼び出し、エージェントループまでをカバーする。React等のフロントエンドフレームワークとの統合が丁寧で、Webアプリに AI機能を組み込む際の定番となっている。", "haystack": "ドイツのdeepset社が開発する、検索・RAGパイプライン構築のための老舗オープンソースフレームワーク。コンポーネントをパイプラインとして接続するアーキテクチャが明快で、本番運用を意識した堅牢性に定評がある。エージェント機能やMCP対応も進み、商用のdeepsetプラットフォームでは企業向けのRAG/エージェント開発・運用環境を提供している。", "strands-agents": "AWSがオープンソースとして公開したエージェントSDK。「モデル駆動」アプローチを掲げ、複雑なオーケストレーションコードを書かずに、モデル自身の推論にツール選択やプランニングを委ねるシンプルな設計が特徴。Amazon Q DeveloperやAWS GlueなどAWS内部での実運用を経て公開された。Bedrockをはじめ各種モデルに対応し、AWS環境でのエージェント構築に自然に馴染む。", "n8n": "ソースコードが公開されたワークフロー自動化ツール(fair-code)。ノードをつないで数百のサービスを連携させる点はZapier的だが、セルフホストできるためデータを社外に出せない企業でも使える。AIエージェントノードを備え、LLM・ツール・メモリを組み合わせたエージェントをワークフローに埋め込める点が近年の急成長の要因。「AI自動化の実装先」として最有力の選択肢になっている。", "dify": "LLMアプリケーションをGUIで構築できるオープンソースプラットフォーム。チャットボット、ワークフロー、エージェント、RAGパイプラインをノーコード/ローコードで組み立てられ、プロンプト管理・ログ・アノテーションなど運用機能まで一体化している。セルフホスト可能な点と完成度の高さから、日本企業でも社内LLM基盤として採用例が非常に多い。クラウド版も提供される。", "zapier": "ノーコード自動化の老舗にして最大手。8,000を超えるアプリ連携を持ち、「トリガーとアクション」を組み合わせて業務を自動化する。近年はAIを全面に取り入れ、自然言語からの自動化作成、AIエージェント(Zapier Agents)、チャットボット、MCP経由でのエージェント連携などを展開。既存のSaaS連携資産をAIエージェントの「手足」として提供する方向に進化している。", "openai-agentkit": "OpenAIが2025年のDevDayで発表したエージェント構築キット。ノードをつないでエージェントのロジックを組み立てるビジュアルツール「Agent Builder」、自社サービスにチャットUIを埋め込む「ChatKit」、評価(Evals)やコネクタ管理などを統合し、OpenAIのモデル・ツール群の上でエージェントを本番導入するまでの距離を縮める。コードで組むAgents SDKに対する「GUI側の入口」であり、OpenAIエコシステム内でワークフロー系スタートアップの領域に踏み込む動きとして注目された。", "make": "旧Integromat。ビジュアルなシナリオエディタで複雑な自動化を組めるノーコードツール。分岐・繰り返し・データ変換の表現力が高く、Zapierより込み入った処理を安価に組めるとして人気がある。AI方面ではAIエージェント機能やMCP対応を追加し、既存の2,000以上のアプリ連携をエージェントから利用できるようにしている。欧州発のサービス。", "flowise": "ノードベースのGUIでLLMアプリやエージェントを構築できるオープンソースツール。LangChain系のコンポーネントをドラッグ&ドロップで接続し、チャットフロー、エージェントフロー、RAGを素早く形にできる。構築したフローはAPIや埋め込みウィジェットとして公開可能。セルフホストの手軽さと学習コストの低さから、プロトタイピング用途で広く使われる。クラウド版もある。", "langflow": "LLMワークフローをビジュアルに構築するオープンソースのビルダー。LangChainベースのコンポーネントをキャンバス上で接続し、RAGやマルチエージェントのフローを作成、APIとして公開できる。Pythonでのカスタムコンポーネント拡張が容易で、開発者寄りの柔軟性を持つ。DataStax(のちIBMが買収)の支援を受けており、マネージド版も提供されている。", "gumloop": "AI処理を前提に設計されたワークフロー自動化SaaS。Webスクレイピング、文書解析、LLMによる処理などをノードとして接続し、営業リスト作成やSEO業務のような「AIならではの自動化」を組みやすい。非エンジニアの現場担当者が自力で業務フローを自動化できることを重視しており、Y Combinator出身のスタートアップとして急成長している。", "lindy": "ノーコードでAIアシスタント/エージェントを作成できるサービス。メール対応、会議調整、リード対応、電話応対などのテンプレートから始めて、トリガーと指示を自然言語で設定するだけで「AI社員」を配置できる。数千のアプリ連携を持ち、複数のLindy(エージェント)同士を連携させることも可能。営業・サポート・バックオフィス業務の自動化に焦点を当てている。", "activepieces": "オープンソースのZapier代替として開発されたワークフロー自動化ツール。TypeScript製で、連携コネクタ(ピース)をコミュニティが拡張できる設計。セルフホストによりデータ主権を保ちながら自動化を構築でき、AIエージェント機能やMCPサーバーとしての利用にも対応した。すべてのピースがMCPツールとして使える点を打ち出し、AI連携ハブとしての性格を強めている。", "relevance-ai": "「AIワークフォース(AIの労働力)」を掲げるノーコードのエージェント構築プラットフォーム。営業のリード対応、リサーチ、サポートなどの業務ごとにAIエージェントを作成し、ツール・ナレッジ・他のエージェントと組み合わせてチームとして働かせることができる。テンプレートが豊富で、ビジネス部門主導でエージェント導入を進めたい企業に向く。オーストラリア発。", "mem0": "AIエージェントに長期記憶を持たせるためのメモリレイヤー。会話やユーザーの好みから重要な情報を抽出・保存し、次回以降の対話で自動的に想起させることで、「ユーザーを覚えているAI」を実現する。ベクトル検索とグラフを組み合わせた記憶管理をOSSとして公開し、マネージドAPIも提供。パーソナライズが重要なアシスタントやコンパニオン系アプリで広く採用されている。", "zep": "エージェント向けのメモリ基盤。会話履歴やビジネスデータから「時間的ナレッジグラフ」を構築し、事実がいつ有効だったかまで追跡しながら関連情報を取り出せるのが特徴。単なる会話要約ではなく、変化する事実関係を保持できるため、長期運用するアシスタントやCRM連携エージェントに向く。コアエンジンのGraphitiはOSSとして公開されている。", "letta": "研究プロジェクトMemGPTから発展した、ステートフルなエージェントの実行基盤。LLMのコンテキスト長の制約を、OSの仮想メモリのような階層的メモリ管理で乗り越える設計思想が特徴で、エージェントが自分の記憶を自分で編集する。エージェントを「デプロイして動かし続けるサービス」として扱うAPI・開発環境(ADE)を提供し、長期稼働するエージェントの構築に向く。", "composio": "AIエージェントと外部SaaSをつなぐツール連携プラットフォーム。GitHub、Slack、Gmail、Salesforceなど数百のサービスへの認証済みツールを提供し、OAuth管理という面倒な部分を肩代わりする。LangChain、CrewAI、OpenAI SDKなど主要フレームワークに数行で組み込め、MCP経由での利用にも対応。「エージェントの手足を最速で増やす」ためのサービス。", "arcade": "エージェントにツールを「安全に」実行させることに焦点を当てたツール呼び出し基盤。ユーザーごとのOAuth認証を管理し、エージェントが本人の権限でGmailやSlackなどを操作できるようにする。ツールの実行を仲介するランタイムとして動作し、認可・監査の仕組みを提供する点が特徴。ツールキットはOSSとして公開されており、エンタープライズでの本番運用を意識した設計。", "smithery": "MCP(Model Context Protocol)サーバーのレジストリ兼ホスティングサービス。数千のMCPサーバーが登録されており、開発者は自分のエージェントに接続したいツールをここで探し、ワンクリックやCLIで導入できる。MCPエコシステムの「アプリストア」的な役割を果たしており、MCPサーバーの公開・配布の事実上のハブの一つになっている。", "pipedream": "開発者向けのAPI連携・自動化プラットフォーム。数千のアプリ連携とサーバーレスのコード実行(Node.js/Python)を組み合わせ、コードを書ける人向けのZapierとして人気を得た。近年は全連携先をMCPサーバーとして提供する取り組みで注目され、エージェントに数千のツールを一括で持たせる基盤として使われている。認証管理を肩代わりする点も強み。", "fastmcp": "MCPサーバーを最小限のコードで構築できるPythonフレームワーク。デコレータを付けるだけで関数をMCPツールとして公開でき、MCP公式SDKにも取り込まれた事実上の標準的存在。認証やプロキシ、サーバー合成などの応用機能も備え、v2系では本番運用向けの機能拡充が進む。「自社システムをエージェントから使えるようにする」最初の一歩として最も使われるツール。\n\n---", "multica": "コーディングエージェントを「ツール」ではなく「チームメイト」として扱うことを掲げるオープンソースのマネージドエージェント基盤。Issueトラッカー上でエージェントを人間と同じように担当者としてアサインし、進捗報告やブロッカー報告をさせながらタスクを消化させる。実行はローカルのデーモン(手元のCLI・APIキー・コード)で行い、管理と可視化を中央に寄せる設計。完了したタスクからスキルを蓄積・共有する仕組みも持つ。", "orcha": "複数のコーディングエージェント(Claude、Gemini、Codexなど)を並列に統括するマルチエージェント・オーケストレーションツール。ビジュアルなワークフロー、エージェント間の自動ハンドオフ、テンプレート保存に対応し、作りたいものを平易な言葉で伝えるとPMエージェントがチーム構成を設定してくれる。ターミナルを何枚も開いて手動で複数エージェントを回す運用を、一画面での監督型運用に置き換えることを狙う。", "temporal": "「耐久性のある実行(Durable Execution)」を提供するワークフローエンジン。処理の途中状態を永続化し、障害やプロセス再起動があっても正確に再開できるため、決済処理などミッションクリティカルな分野で実績がある。長時間動き、失敗し得るステップを多く含むAIエージェントの実行基盤としても採用が拡大しており、リトライ・タイムアウト・人間の承認待ちを堅牢に扱える。クラウド版も提供。", "inngest": "イベント駆動の耐久実行プラットフォーム。関数にステップとリトライを宣言的に定義するだけで、キューやステート管理のインフラなしに信頼性の高いバックグラウンド処理を実装できる。AIエージェントやRAGパイプラインのような「複数ステップ・失敗あり・長時間」のワークフローに適し、エージェント構築キットAgentKitも提供。TypeScript/Python開発者に使いやすい設計。", "e2b": "AIエージェントがコードを安全に実行するためのクラウドサンドボックス。Firecracker microVMベースの隔離環境を数百ミリ秒で起動し、エージェントが生成したPython/JSコードの実行、ファイル操作、パッケージインストールを安全に行える。生成コードの実行環境という、エージェント運用の急所を担うインフラとして、データ分析エージェントやコーディングエージェントの裏側で広く使われている。", "modal": "Pythonコードをそのままクラウドで実行できるサーバーレス基盤。デコレータを付けるだけで関数をGPU付きコンテナで動かせ、大規模な並列実行や自動スケーリングも数行で実現する。モデルの推論・ファインチューニング・バッチ処理からエージェントのサンドボックス実行まで、AIワークロード全般の実行基盤として開発者人気が高い。インフラ管理を completelyに抽象化する開発体験が売り。", "daytona": "AIエージェントのための実行環境・サンドボックス基盤。ミリ秒単位で起動する隔離環境でエージェントにコード実行・ファイル操作・ブラウザ利用をさせることができ、環境のスナップショットや永続化にも対応する。もともと開発環境管理ツールとして始まり、エージェント時代に「AIが安全に働くコンピュータ」を提供する方向へ舵を切った。E2Bと並び比較される存在。", "amazon-bedrock": "AWSのマネージド生成AI基盤。Claude、Llama、Amazon Nova など多様な基盤モデルを統一APIで利用でき、RAGを構築するKnowledge Bases、エージェントを組み立てるBedrock Agents、入出力を制御するGuardrailsなどを統合している。さらにAgentCoreでは、任意のフレームワークで作ったエージェントを本番運用するためのランタイム・メモリ・ゲートウェイ・監視機能を提供。AWS上でエージェントを構築・運用する際の中核サービスであり、エンタープライズでの採用が急速に進んでいる。", "azure-ai-foundry": "Microsoftの統合AI開発プラットフォーム(旧Azure AI Studio)。OpenAIの最新モデルを含む豊富なモデルカタログ、エージェントを構築・運用するFoundry Agent Service、評価・監視・コンテンツセーフティ機能までを一体で提供する。Microsoft 365やCopilot エコシステム、Entra IDによる権限管理などエンタープライズ要件との統合が強みで、「Azureに寄せている企業がエージェントを作る場所」としての地位を固めつつある。", "vertex-ai-agent-builder": "Google CloudのAI基盤Vertex AI上でエージェントを構築・運用するためのサービス群。オープンソースのADK(Agent Development Kit)で開発したエージェントを、マネージド実行環境のAgent Engineにデプロイし、セッション管理・メモリ・監視まで任せられる。エージェント間連携プロトコルA2Aや、社内検索・エージェント活用基盤のGoogle Agentspaceとも接続し、Geminiを軸にした企業向けエージェント展開の中核を担う。", "copilot-studio": "ノーコード/ローコードでカスタムCopilotや業務エージェントを構築するMicrosoftのツール。グラフィカルな画面で会話フローやトリガー、ナレッジ、アクションを設定し、TeamsやWebサイトなどに配置できる。人の指示なしにイベント起点で動く自律エージェント機能や、Power Platformの豊富なコネクタとの連携が特徴。情報システム部門や業務部門が自らエージェントを内製する入口として、Microsoft 365導入企業で広く使われ始めている。", "salesforce-agentforce": "SalesforceがCRMに組み込んだエージェントプラットフォーム。顧客対応・営業支援・サービス業務などのエージェントをローコードで構築し、CRMデータやFlowと連携して実際の業務アクションまで実行させられる。「デジタルレイバー(AIの労働力)」というコンセプトを掲げ、既存のSalesforce導入基盤に乗せて大規模展開を進めており、業務SaaSベンダーによるエージェント参入の代表例となっている。", "openclaw": "Peter Steinberger氏が開発し、コミュニティとともに育つオープンソースのパーソナルAIエージェント(旧Clawdbot/Moltbot)。自分のマシンで動くエージェントに、WhatsApp・Telegram・Slack・Discord・LINE・iMessageなど30以上のチャネルから話しかけられるゲートウェイ設計が核で、「チャットUIから依頼すると成果物が返る」体験を個人レベルで実現した。スキル共有マーケットのClawHubには1万件を超えるコミュニティスキルが登録され、Discordコミュニティは約17万人規模。一方で強力な権限を持つため、隔離環境での運用などセキュリティ面の設計が課題として語られることも多い。", "hermes-agent": "Nous Researchが開発するオープンソースの自己学習型エージェント。「使うほど成長するエージェント」を掲げ、経験からスキルを自動生成して改善し、working/episodic/semanticの3層メモリでセッションを跨いでユーザー像を深めていく学習ループを内蔵する。DiscordやTelegramなど主要チャネルに対応し、公開後急速に注目を集めてGitHubスターは2026年4月時点で約8.7万に到達。OpenClawが「広く繋がる」志向なのに対し、こちらは「深く育つ」志向で、パーソナルエージェントの次の方向性を示す存在。", "nanoclaw": "OpenClawブームの中で「何でもできる=何でもしでかす」リスクへの反省から登場した、セキュリティ重視の軽量パーソナルエージェント。機能を最小限に絞り、コンテナによる隔離実行を前提とした設計で、エージェントに与える権限を明確に制御しながら運用できることを重視する。多機能なOpenClaw、自己学習のHermes Agentに対する「安全側に振った選択肢」として、ホスティングサービスの選択肢にも並ぶようになっている。", "nemoclaw": "NVIDIAが2026年3月のGTCで発表した、OpenClawを企業環境で安全に動かすためのオープンソースのセキュリティスタック(公開時点では早期アルファ)。OpenShellサンドボックスによる隔離実行、外部通信をデフォルトで全拒否するネットワークポリシー、機密データをローカル推論へ振り分けるPrivacy Router、詳細な監査ログなどを、OpenClawを置き換えるのではなくプラグインとして被せる設計が特徴。個人発のブームであるOpenClawをエンタープライズのガバナンス要件に接続する試みであり、NVIDIAがモデル実行基盤からエージェント統治のレイヤーへ踏み出した象徴的なプロダクトでもある。", "genspark": "検索から資料作成までを自動化するオールインワンのAIワークスペース。中核の「スーパーエージェント」は、1つのプロンプトから自律的に計画を立て、Web調査、スライド・シート・ドキュメント作成、画像生成、さらには電話予約代行までを実行する。複数のLLMを組み合わせるMoA(Mixture of Agents)構成や、多数のツール・MCP連携を裏側で使い分けるのが特徴で、出典付き構造化ページ「Sparkpage」などの独自機能も持つ。日本でも個人・ビジネス双方で知名度が高く、汎用エージェント競争の最前線を走るサービスの一つ。", "manus": "中国発チームが開発し世界的な話題となった汎用自律エージェント。指示を与えると、クラウド上の自身のコンピュータでWebブラウジング・情報収集・ファイル作成・コード実行を組み合わせ、調査レポート作成やサイト構築のような複合タスクを最後まで遂行する。「タスクを丸ごと任せる」体験を一般ユーザーに広めた存在で、汎用エージェント競争の火付け役となった。", "browser-use": "LLMにブラウザを操作させるためのオープンソースライブラリの代表格。ページのDOM情報をLLMが扱いやすい形に変換し、クリック・入力・ナビゲーションといった操作をエージェントに行わせる。Pythonで数行から始められる手軽さでGitHubスター数が爆発的に伸び、Webエージェント開発の定番となった。クラウドAPI版も提供され、商用サービスの裏側でも採用が進む。", "stagehand": "ヘッドレスブラウザ基盤のBrowserbase社が開発したAIブラウザ自動化フレームワーク。Playwrightを拡張し、act(自然言語での操作)、extract(データ抽出)、observe(ページ理解)といったAPIを提供する。「全部AI任せ」でも「全部コード」でもなく、決まった部分はコードで、壊れやすい部分は自然言語で書くというハイブリッド設計が特徴で、保守性の高いWeb自動化を実現する。", "browserbase": "AIエージェント向けのヘッドレスブラウザをクラウドで提供する基盤サービス。数千のブラウザセッションを瞬時に立ち上げ、CAPTCHA対応、プロキシ、セッション録画・デバッグ機能などを備える。エージェントが「Webを見て操作する」ためのインフラ層を担い、Stagehandや各種エージェントフレームワークと組み合わせて使われる。Web操作系スタートアップの標準的な裏側になりつつある。", "skyvern": "LLMとコンピュータビジョンを組み合わせてブラウザ操作を自動化するツール。従来のRPAのようにXPathで要素を指定するのではなく、画面を視覚的に理解して操作対象を判断するため、レイアウト変更に強いのが特徴。フォーム入力、請求書ダウンロード、政府系サイトでの申請といった定型業務の自動化に向く。OSS版とマネージドクラウド版が提供されている。", "playwright-mcp": "Microsoftのブラウザ自動化ツールPlaywrightの公式MCPサーバー。スクリーンショットの画像認識ではなく、アクセシビリティツリーという構造化データを使ってページを理解・操作するため、高速かつ安定して動くのが特徴。Claude CodeやCursorなどのエージェントに接続すれば、Webのテスト・操作・情報取得を任せられる。ブラウザ操作系MCPの標準的な選択肢。", "steel": "AIエージェント向けのオープンソース・ブラウザAPI基盤。クラウドまたはセルフホストでブラウザセッションを提供し、スクレイピングやWeb操作エージェントの実行環境となる。セッション管理、プロキシ、アンチボット対策などの実務的な機能を備え、Browserbaseのオープンソース代替として位置づけられる。インフラを自社管理したい開発者に選ばれている。", "openrouter": "数百のLLMを単一のAPIで呼び出せるモデルゲートウェイ。OpenAI互換のインターフェースで、OpenAI・Anthropic・Google・Meta系・中国系など主要モデルをすべて扱え、料金は従量課金で一元化される。モデルごとの契約・キー管理が不要になるため、複数モデルを試したい開発者や、モデルをアプリ側で切り替えたいサービスの標準的な選択肢になっている。利用統計の公開でも知られる。", "litellm": "100以上のLLM APIをOpenAI形式に統一して呼び出せるオープンソースのプロキシ/SDK。社内にゲートウェイとして立てれば、コスト管理、レート制限、フォールバック、キー管理を一元化でき、「社内LLMゲートウェイ」のデファクトとして企業導入が非常に多い。アプリ側のコードを変えずにモデルを差し替えられるため、マルチモデル戦略の土台になる。商用のエンタープライズ版もある。", "ollama": "ローカルマシンでLLMを動かすための定番オープンソースツール。コマンド一つでLlamaやGemma、Qwenなどのモデルをダウンロードして起動でき、OpenAI互換APIも提供するため、ローカル開発やオフライン環境、機密データを扱う用途で広く使われる。GUIアプリも提供され、「手元でLLMを動かす」体験の入口として圧倒的な普及度を誇る。", "vllm": "UCバークレー発の高スループットLLM推論エンジン。PagedAttentionという手法でGPUメモリを効率的に使い、同時リクエストを大量に捌けることから、オープンモデルを本番サービングする際の業界標準となっている。主要なモデルアーキテクチャや量子化、分散推論に対応し、多くの推論系スタートアップやクラウドの裏側でも採用されている。自前でLLM APIを立てるならまず候補に上がる。", "lm-studio": "ローカルLLMをGUIで扱えるデスクトップアプリ。モデルの検索・ダウンロード・チャット・ローカルAPIサーバー化までを画面操作だけで完結でき、コマンドラインに馴染みのない層にもローカルLLMを開放した。MLX(Apple Silicon最適化)対応など動作環境の幅も広い。アプリ自体は無料だがオープンソースではなく、企業利用向けのライセンスも用意されている。", "groq": "独自開発のLPU(Language Processing Unit)というチップで超高速なLLM推論を提供するサービス。GPUと比べて桁違いのトークン生成速度を実現し、「即答するAI」の体験で注目を集めた。オープンモデルを中心にOpenAI互換APIで提供され、応答速度が体験を左右する音声エージェントやリアルタイム用途で特に選ばれている。", "together-ai": "オープンソースモデルに特化したクラウドAI基盤。Llama、Qwen、DeepSeekなど数百のモデルの推論APIに加え、ファインチューニングやGPUクラスタの提供まで行う。オープンモデルを「すぐ使えるAPI」として提供する層の代表格で、独自モデルを運用したい企業の学習・推論基盤としても使われる。研究コミュニティとの関係が深いことでも知られる。", "fireworks-ai": "高速・低コストの推論に特化したAIクラウド。独自の推論エンジンでオープンモデルを最適化して提供し、低レイテンシと高スループットを売りにする。関数呼び出しや構造化出力など、エージェント用途で必要となる機能のサポートも手厚い。Metaの PyTorchチーム出身者らが創業しており、モデルの本番運用における性能チューニングに強みを持つ。", "replicate": "機械学習モデルをAPIとして即実行できるプラットフォーム。画像生成、動画生成、音声、LLMなど数千の公開モデルが登録されており、数行のコードで試せる手軽さが特徴。研究者が公開した最新モデルをいち早く動かせる「モデルのショーケース」的な存在で、自分のモデルをコンテナ(Cog)としてデプロイすることもできる。プロトタイピングや個人開発で特に人気が高い。", "baseten": "機械学習モデルの本番デプロイに特化した推論基盤。オープンソースのパッケージングツールTrussでモデルをコンテナ化し、自動スケーリング付きのAPIとして運用できる。専用推論エンジンによる高速化、SLAを意識した信頼性、専有GPUの提供など、スタートアップの本番ワークロードを支えることに焦点を当てており、音声AIや検索系サービスでの採用事例が多い。", "elevenlabs": "音声合成(TTS)の代表的サービス。人間と区別がつかないレベルの自然な音声と、数秒のサンプルから声を再現するボイスクローニングで市場を切り開いた。多言語対応、感情表現、音声変換に加え、会話型AIエージェントを構築するプラットフォーム(Agents)も展開し、電話応対やキャラクターの音声対話まで一気通貫で作れるようになっている。音声AI領域の中心的存在。", "vapi": "開発者向けの音声AIエージェント構築プラットフォーム。音声認識(STT)、LLM、音声合成(TTS)を組み合わせたリアルタイム会話のパイプラインをAPIとして提供し、電話の発着信、割り込み対応、ツール呼び出しなどを備えたボイスエージェントを短期間で構築できる。各コンポーネントを好きなベンダーに差し替えられる柔軟性が特徴で、音声エージェント開発のインフラ層を担う。", "retell-ai": "電話対応に特化したAIエージェント構築基盤。コールセンターの受電・架電を自動化するボイスエージェントを、会話フロー設計・電話番号取得・既存電話システム(SIP)連携込みで構築できる。通話のモニタリングや分析、予約システムやCRMとの連携機能も揃い、「電話業務の自動化」という明確なユースケースに絞った完成度で医療・不動産・金融などの業界で採用が進む。", "livekit": "リアルタイム音声・映像通信のオープンソース基盤(WebRTC)。数百万人規模の同時接続を支えるメディアサーバーとして実績があり、音声AI時代にはAIエージェント用のフレームワーク(LiveKit Agents)を展開。音声の入出力とLLMをつなぐパイプラインや電話連携を提供し、ChatGPTの音声モードの基盤として使われたことでも知られる。クラウド版も提供される。", "pipecat": "音声・マルチモーダルAIエージェントを構築するためのオープンソースPythonフレームワーク。Daily社が開発し、STT・LLM・TTSなどをパイプラインとして自由に組み合わせ、リアルタイムの音声会話ボットを構築できる。特定ベンダーに縛られないオープンな設計が特徴で、対応サービスのプラグインが豊富。音声エージェントを自前で組みたい開発者の定番になりつつある。", "bland-ai": "電話の発着信を自動化するボイスAIプラットフォーム。自然な音声での通話を大量に並列実行でき、営業のフォローコール、予約確認、カスタマーサポートなどを自動化する。会話フローをパスウェイとして設計する仕組みや、自社インフラでのエンドツーエンド運用による低レイテンシを打ち出す。米国で企業向け電話自動化の代表的プレイヤーの一つ。\n\n---", "glean": "社内に散らばるデータ(Google Drive、Slack、Jira、Salesforceなど数百のSaaS)を横断検索し、権限を考慮した上で回答するエンタープライズAI検索・アシスタント。社員ごとのアクセス権を尊重したナレッジグラフを構築する点が技術的な核で、「社内版のAI検索」の代表格として大企業への導入が進む。近年は検索にとどまらず、社内業務を自動化するエージェント基盤へと拡大している。", "perplexity": "Web検索と LLMを組み合わせた「回答エンジン」の代表格。質問に対して出典付きの回答を直接返すスタイルで検索体験を変え、一般ユーザーから急速に普及した。開発者向けには検索グラウンディング付きのAPI(Sonar)を提供しており、エージェントに「最新のWeb情報を根拠付きで引く」能力を持たせる部品としても使われる。ブラウザCometなどプロダクト展開も広い。", "notebooklm": "Googleが提供するソース接地型のリサーチ・ノートツール。アップロードしたPDFや資料、URLだけを根拠として回答・要約するため、一般的なチャットAIより幻覚が起きにくく、出典も明示される。資料の内容を対話形式のポッドキャスト風音声にする「音声概要」が世界的にヒットし、一般層にまで普及した。個人の学習・調査からチームのナレッジ活用(企業向け版)まで用途が広く、「手持ちの資料をAIで使いこなす」という周辺ツールの代表格になっている。", "notion-ai": "ドキュメント・Wiki・タスク管理を統合したNotionに組み込まれたAI機能。ワークスペース内のページやデータベースを横断して質問に答えたり、文書作成・要約・翻訳を行ったりできる。SlackやGoogle Driveなど外部ソースへの接続にも対応し、「会社のナレッジが集まる場所にAIが同居している」ことの強みを活かす。ナレッジ活用の入口として導入ハードルが低い。", "exa": "AI・エージェント向けに設計されたセマンティック検索API。キーワード一致ではなく埋め込みベースの意味検索でWebを探索でき、「この文章に似たページ」のような検索や、結果の全文取得、構造化した調査(リサーチAPI)までを提供する。人間向け検索エンジンの流用ではなく「機械が使う検索」を掲げており、リサーチエージェントやリード発掘などの用途で採用が広がる。", "tavily": "AIエージェント専用に設計されたWeb検索API。LLMがそのまま扱いやすい形式で検索結果・抽出コンテンツを返すことに特化しており、RAGやエージェントのツールとして数行で組み込める。LangChainなど主要フレームワークとの統合が充実し、「エージェントに検索能力を持たせる最短ルート」として個人開発から企業まで広く使われている。検索に加えて抽出・クロール機能も提供。", "firecrawl": "WebサイトをLLMが扱いやすいデータ(Markdown等)に変換するクローラー/スクレイピングAPI。URLを渡すだけでJavaScriptレンダリング込みでページを取得し、サイト全体のクロールや構造化データの抽出もできる。RAGの前処理やエージェントの情報収集ツールとして定番化しており、オープンソース版とマネージドAPIの両方が提供されている。開発者人気が非常に高い。", "jina-ai": "検索基盤技術を提供するベルリン発の企業。URLを付けるだけでWebページをLLM向けテキストに変換するReader API、高性能な埋め込みモデルやリランカーなどを提供し、検索・RAGの品質を支える部品として広く使われる。多くの成果をオープンソース・オープンウェイトで公開しており、研究と実務の橋渡し的な存在。エージェントの「読む・探す」能力を強化する。", "guru": "社内ナレッジ管理とAI検索を組み合わせたプラットフォーム。検証済みのナレッジカードという形で情報の鮮度・正確性を担当者が保証する仕組みが特徴で、その信頼できるナレッジを土台にAIが社内の質問に回答する。SlackやChromeから使え、サポートチームや営業チームのイネーブルメント用途に強い。「AIに食わせる社内情報の品質管理」まで含めて設計されている。", "pinecone": "マネージドベクトルデータベースの代表格。埋め込みベクトルの保存・類似検索をフルマネージドで提供し、インフラ運用なしで大規模なRAGやセマンティック検索を構築できる。サーバーレス化により小規模から従量で使えるようになり、ハイブリッド検索やリランキングなど検索品質向上の機能も統合。「ベクトルDBといえばまずPinecone」という認知を確立した先行者。", "weaviate": "オープンソースのベクトルデータベース。ベクトル検索とキーワード検索を組み合わせたハイブリッド検索に強く、埋め込み生成を組み込みで行うモジュール機構、GraphQLベースのAPIなどを備える。セルフホストとマネージドクラウドの両方が選べ、エンタープライズでの採用実績も多い。RAG構築の中核コンポーネントとして、Qdrant・Milvusと並び称される存在。", "qdrant": "Rustで書かれた高速なオープンソースベクトルデータベース。性能とメモリ効率に定評があり、ペイロード(メタデータ)によるフィルタリングを組み合わせた検索が得意。量子化によるコスト削減機能も充実している。セルフホストのしやすさと無料枠のあるクラウド版により、スタートアップから大規模サービスまで採用が広い。ベンチマーク性能を重視する開発者に好まれる。", "chroma": "開発者体験を重視した軽量なオープンソースベクトルデータベース。pipで入れてすぐ使えるシンプルさから、RAGのプロトタイピングやローカル開発の定番として圧倒的に使われている。アプリ組み込み(エンベデッド)での利用が手軽で、チュートリアルや書籍でもまず登場することが多い。近年はサーバーレスのマネージドクラウドも提供し、本番用途への道筋も整えた。", "milvus": "大規模利用を想定して設計されたオープンソースのベクトルデータベース。数十億ベクトル規模の分散構成に対応し、GPUアクセラレーションや多様なインデックスをサポートする。LF AI & Data財団のプロジェクトとして開発され、開発元のZillizがマネージドクラウドを提供している。軽量版のMilvus Liteから大規模クラスタまで同じAPIで移行できる点も特徴。", "pgvector": "PostgreSQLにベクトル型と類似検索を追加するオープンソース拡張。既存のPostgreSQLにそのままベクトル検索を組み込めるため、「専用ベクトルDBを増やさずRDBに寄せる」構成の中核となる。トランザクションやリレーショナルデータとの結合をそのまま使える点が実務上の強みで、Supabase・RDS・Cloud SQLなど主要マネージドPostgreSQLが軒並み対応している。", "llamaparse": "LlamaIndex社が提供するドキュメント解析サービス。表・図・複雑なレイアウトを含むPDFやOffice文書を、LLM/RAGで使いやすい構造化テキストに高精度で変換する。財務資料や技術文書のような「普通のパーサーでは崩れる文書」への強さが売りで、RAGの品質を左右する前処理工程を担う。LlamaCloudの一部として、パイプライン全体のマネージド化も進む。", "unstructured": "PDF、Word、PowerPoint、HTML、メールなど多様な形式の非構造化データを、LLMで使える形に変換するETLツール。文書の要素(見出し・段落・表など)を検出して分割し、埋め込み・格納までのパイプラインを構築できる。オープンソース版が広く使われるほか、企業向けにはコネクタ・スケジューリングを備えたマネージドプラットフォームを提供。RAG前処理の定番。", "reducto": "高精度なドキュメント解析APIを提供するスタートアップ。視覚モデルと独自パイプラインを組み合わせ、複雑な表・図表・手書きを含む文書を高い精度で構造化データに変換する。金融・医療・保険など、解析ミスが許されない業界の本番ワークロードでの採用を打ち出しており、精度評価を前面に出したポジショニングが特徴。RAGやデータ抽出の品質を底上げする部品。", "airbyte": "データ統合(ELT)のオープンソース標準。数百のコネクタでSaaSやDBからデータを抽出し、ウェアハウスやベクトルDBへ同期する。コネクタをコミュニティが開発・共有するモデルで急成長した。AI文脈では、社内データをRAG基盤へ継続的に流し込むパイプラインとして使われ、ベクトルDBへの直接ロードにも対応。セルフホスト版とクラウド版が提供される。", "dbt": "データウェアハウス内のデータ変換をSQLで管理する業界標準ツール。変換ロジックをコードとしてバージョン管理し、テスト・ドキュメント・リネージを整備する「アナリティクスエンジニアリング」という職能を生み出した。AI文脈では、エージェントに正しいデータを渡すための土台となる整備されたデータモデルとセマンティックレイヤーを提供する役割を担う。", "cube": "データの「意味」を定義するセマンティックレイヤーの代表格。指標(売上、解約率など)の定義を一元管理し、BIツールやAIエージェントがどこから聞いても同じ定義で正しい数値を返せるようにする。自然言語でデータに質問するAI分析の精度は指標定義の曖昧さで崩れがちで、Cubeはその問題を解く基盤として位置づけられる。AIによるデータ分析の信頼性を支える中核部品。", "langsmith": "LangChainチームが提供するLLMアプリの開発・監視プラットフォーム。エージェントの実行を1ステップずつ追えるトレーシング、データセットに対する評価、プロンプトの管理・比較などを一体で提供する。LangChain/LangGraphとの統合は当然深いが、フレームワークに依存せず使うこともできる。「エージェントがなぜその挙動をしたか」を調べる際の代表的なツール。", "langfuse": "オープンソースのLLMオブザーバビリティ基盤の代表格。トレーシング、コスト追跡、評価、プロンプト管理、アノテーションといった機能を備え、セルフホストできることから、データを外に出せない企業やコストを抑えたいチームに広く採用されている。主要フレームワーク・ゲートウェイとの連携も豊富で、「まずLangfuseを立てる」が定番の選択肢になりつつある。ドイツ発。", "braintrust": "LLMアプリの評価(Evals)を中心に据えた開発プラットフォーム。プロンプトやモデルの変更が品質に与える影響をデータセットで継続的に測定し、実験の比較、本番ログからの評価データ作成、プレイグラウンドでの試行までを一つの流れとして提供する。「勘ではなく評価に基づいてAIプロダクトを改善する」文化を実装するツールとして、米国のAIプロダクト企業で採用が多い。", "arize-phoenix": "ML監視企業Arizeが公開するオープンソースのLLMトレーシング・評価ツール。OpenTelemetryベースの計装(OpenInference)でエージェントの実行を可視化し、検索品質や幻覚の評価、実験比較をローカルからでも手軽に行える。ノートブックですぐ立ち上がる手軽さが人気で、商用のArize AXと組み合わせて本番監視までスケールさせる導線が用意されている。", "w-b-weave": "実験管理ツールの定番Weights & BiasesによるLLMアプリ向けの評価・監視ツール。数行のコードでLLM呼び出しを自動トレースし、評価・比較・本番モニタリングまでを行える。MLエンジニアがモデル学習で使い慣れたW&Bの体験をそのままLLMアプリ開発に持ち込める点が強みで、研究寄りのチームからの支持が厚い。CoreWeaveによる買収後もサービスは継続している。", "helicone": "LLM APIの手前に置くだけで使えるオブザーバビリティサービス。ベースURLを差し替える(プロキシ方式)だけでリクエストの記録・コスト集計・キャッシュ・レート制限が有効になる導入の手軽さが最大の特徴。ユーザー別・機能別のコスト分析やプロンプト実験機能も備える。オープンソースで公開されており、セルフホストも可能。小さく始めるチームに人気が高い。", "agentops": "AIエージェントに特化した監視・デバッグツール。LLM呼び出しだけでなく、ツール実行、エージェント間のやり取り、セッション全体の流れを時系列で再生でき、マルチエージェントの複雑な挙動を追跡しやすい。CrewAIやAutoGenなど主要フレームワークとの統合が用意され、数行で導入できる。コスト追跡やコンプライアンス用途の記録にも対応する。", "promptfoo": "プロンプト・モデル・RAGの評価をコマンドラインから行えるオープンソースツール。YAMLでテストケースを書き、複数のプロンプトやモデルの出力品質を表形式で比較できる。CIに組み込んで「プロンプトの回帰テスト」を回す使い方が定着しているほか、プロンプトインジェクションや有害出力を試すレッドチーミング機能も充実。開発者主導の評価文化を支える定番ツール。", "deepeval": "「LLMアプリのためのPytest」を掲げるオープンソース評価フレームワーク。忠実性、回答関連性、幻覚などの評価指標が組み込みで用意され、ユニットテストを書く感覚でLLM出力の品質テストを記述できる。RAG評価やレッドチーミング、ベンチマーク実行にも対応。CIでの自動評価に組み込みやすく、テスト駆動でLLM開発を進めたいエンジニアに支持されている。", "datadog-llm-obs": "インフラ監視大手Datadogが提供するLLM監視機能。エージェントやRAGのトレーシング、品質・安全性の評価、コスト追跡を、既存のAPM・インフラ監視と同じ画面で扱えるのが最大の強み。すでにDatadogを使っている企業であれば、LLM固有の監視ツールを別途増やさずに本番エージェントの運用監視を統合できる。エンタープライズの本番運用文脈で選ばれやすい。", "lakera": "生成AIアプリを攻撃から守るセキュリティサービスの代表格。プロンプトインジェクション、ジェイルブレイク、データ漏洩などをリアルタイムに検知するAPI(Lakera Guard)を提供する。プロンプト攻撃を体験できるゲーム「Gandalf」で収集した大量の攻撃データを検知モデルに活かしていることで知られる。エージェントが外部入力を扱う場面の防御層として組み込まれる。チェコ・スイス発。", "guardrails-ai": "LLMの入出力を検証・矯正するオープンソースフレームワーク。「バリデータ」と呼ばれる検証部品(PII検出、有害表現、形式チェックなど)を組み合わせてガードレールを定義し、違反時には再生成や修正を行える。コミュニティがバリデータを共有するGuardrails Hubを持ち、用途に応じた防御を組み立てられる。構造化出力の保証にも強く、実装レベルの安全策として定番。", "nemo-guardrails": "NVIDIAが公開する対話システム向けのガードレールツールキット。Colangという専用言語で「話してよい話題・拒否すべき話題・応答の流れ」をレール(軌道)として定義し、LLMの会話を制御する。ジェイルブレイク検知や事実性チェックの部品も統合でき、外部ツール実行前の安全確認にも使える。会話型エージェントに方針レベルの制御を入れたい場合の代表的な選択肢。", "llm-guard": "LLMの入出力をサニタイズするオープンソースのセキュリティツールキット。プロンプトインジェクション検知、個人情報の匿名化、有害コンテンツ検出、シークレット漏洩防止などのスキャナーを組み合わせ、入出力の両方向にフィルタを設ける。Protect AI(現Palo Alto Networks傘下)が支援しており、自前の防御層をOSSで構築したい場合の定番部品となっている。", "prompt-security": "企業の生成AI利用全体を守るセキュリティプラットフォーム。社員のシャドーAI利用の可視化、ブラウザ経由のデータ漏洩防止、自社アプリへのプロンプトインジェクション対策、MCPやエージェントの監視までを一括でカバーする。開発者向けの部品というよりも、CISO視点で組織のAI利用にガバナンスを効かせる製品。イスラエル発で、SentinelOneによる買収が報じられた。", "protect-ai": "AIシステムのセキュリティに特化した統合プラットフォーム。モデルファイルの脆弱性スキャン(Guardian)、LLMの攻撃耐性テスト、実行時防御(Layer)など、AIサプライチェーン全体を守る製品群を展開する。huntr(AI特化のバグバウンティ)やOSSツール群の運営でも知られ、2025年にPalo Alto Networksに買収された。エンタープライズのAIセキュリティ体制の中核を担う。\n\n---\n\n*区分・内容は2026年8月時点の公開情報に基づく概略です。各社の提供形態・機能は変化が速いため、導入検討時は公式情報をご確認ください。*"}, "domains": {"devin": "devin.ai", "openhands": "all-hands.dev", "jules": "jules.google", "openai-codex": "openai.com", "claude-code": "claude.ai", "pi-agent": "pi.dev", "opencode": "opencode.ai", "v0": "v0.dev", "bolt-new": "bolt.new", "lovable": "lovable.dev", /* ---------- index ---------- */
const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const TOOL={};   // slug -> {name,type,desc,tier,bt,zi,ci}
zones.forEach((z,zi)=>z.cats.forEach((c,ci)=>c.tools.forEach(t=>{
  const [name,type,desc,tiers,bt]=t;
  TOOL[slug(name)]={name,type,desc,tiers:tiers||[],bt,zi,ci};
})));
const relOf=s=>relations.filter(r=>r.f===s||r.t===s);
const catRels=(zi,ci)=>{
  const inCat=[],cross=[];
  const here=new Set(zones[zi].cats[ci].tools.map(t=>slug(t[0])));
  relations.forEach(r=>{
    const fIn=here.has(r.f),tIn=here.has(r.t);
    if(fIn&&tIn)inCat.push(r);
    else if(fIn||tIn)cross.push(r);
  });
  return {inCat,cross};
};

/* ---------- shared renderers ---------- */
function iconBox(s){
  const t=TOOL[s];
  const ic=window.GEN.icons[s];
  const tierColor=t.tiers.length?`var(--t-${t.tiers[0]})`:"#B9C0BB";
  if(ic)return `<span class="ic" style="--tier:${tierColor}"><img src="${ic}" alt="" loading="lazy"></span>`;
  const hue=zones[t.zi].cats[t.ci].hue;
  return `<span class="ic mono" style="--tier:${tierColor};--mono-bg:${hue}">${t.name[0].toUpperCase()}</span>`;
}
const tierBadges=tiers=>(tiers||[]).map(k=>`<span class="tier-badge ${k}">${TIERS[k]}</span>`).join("");
const typeLabel={saas:"SaaS / 商用",oss:"オープンソース",both:"OSS + 商用版あり"};

/* ---------- zoom navigation ---------- */
const ov=document.getElementById("ov");
const ovPanel=document.getElementById("ovPanel");
let zoomSrc=null; // rect of the clicked element, for the zoom-in animation

function openFrom(el){zoomSrc=el.getBoundingClientRect();}

function crumbHtml(items){
  return `<nav class="crumbs">`+items.map((it,i)=>{
    const last=i===items.length-1;
    return (i?`<span class="sep">›</span>`:"")+
      (last?`<span class="cur">${it.label}</span>`:`<a data-hash="${it.hash}">${it.label}</a>`);
  }).join("")+`</nav>`;
}

function playZoomIn(){
  if(!zoomSrc){ovPanel.style.opacity="";ovPanel.style.transform="";return;}
  const target=ovPanel.getBoundingClientRect();
  const sx=zoomSrc.width/target.width, sy=zoomSrc.height/target.height;
  const dx=zoomSrc.left+zoomSrc.width/2-(target.left+target.width/2);
  const dy=zoomSrc.top+zoomSrc.height/2-(target.top+target.height/2);
  ovPanel.classList.remove("zooming");
  ovPanel.style.transform=`translate(${dx}px,${dy}px) scale(${Math.max(sx,.2)},${Math.max(sy,.2)})`;
  ovPanel.style.opacity="0.4";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    ovPanel.classList.add("zooming");
    ovPanel.style.transform="none";
    ovPanel.style.opacity="1";
  }));
  zoomSrc=null;
}

function parseHash(){
  const h=location.hash;
  let m;
  if((m=h.match(/^#c\/(\d+)-(\d+)$/))){
    const zi=+m[1],ci=+m[2];
    if(zones[zi]&&zones[zi].cats[ci])return{level:1,zi,ci};
  }
  if((m=h.match(/^#t\/([a-z0-9-]+)$/))&&TOOL[m[1]])return{level:2,s:m[1]};
  return{level:0};
}

function render(){
  const st=parseHash();
  if(st.level===0){
    ov.classList.remove("open");
    document.body.style.overflow="";
    ovPanel.innerHTML="";
    return;
  }
  ov.classList.add("open");
  document.body.style.overflow="hidden";
  if(st.level===1)renderCat(st.zi,st.ci);
  else renderTool(st.s);
  ov.scrollTop=0;
  playZoomIn();
}

/* ---------- category view ---------- */
function renderCat(zi,ci){
  const z=zones[zi],c=z.cats[ci];
  ovPanel.style.setProperty("--hue",c.hue);
  const {inCat,cross}=catRels(zi,ci);

  let html=`<button class="ov-close" data-hash="">× 全体マップへ (Esc)</button>`;

  html+=`<h2 class="ov-title">${c.title}</h2><p class="ov-desc">${c.desc} — ツールをクリックすると詳細解説へ</p>`;
  html+=`<div class="relwrap"${inCat.length?' style="margin-top:68px"':''}><svg class="relsvg"></svg><div class="cards">`;
  c.tools.forEach(t=>{
    const [name,type,desc,tiers,bt]=t;
    const s=slug(name);
    html+=`<div class="tcard" data-slug="${s}" data-hash="t/${s}">
      <div class="row1">${iconBox(s)}<span class="nm">${name}</span></div>

      <div class="d">${desc}</div>
    </div>`;
  });
  html+=`</div></div>`;

  if(cross.length){
    html+=`<div class="xrel"><h3>他カテゴリとの関係</h3><div class="xrel-items">`;
    cross.forEach(r=>{
      const rt=RTYPES[r.r];
      const F=TOOL[r.f],T=TOOL[r.t];
      const catOf=t=>`${zones[t.zi].name} / ${zones[t.zi].cats[t.ci].title}`;
      html+=`<div class="xrel-item">
        <a data-hash="t/${r.f}">${F.name}</a><span class="cat-of">(${catOf(F)})</span>
        <span class="reltag" style="background:${rt.color}">${rt.label} →</span>
        <a data-hash="t/${r.t}">${T.name}</a><span class="cat-of">(${catOf(T)})</span>
      </div>`;
    });
    html+=`</div></div>`;
  }
  const usedTypes=[...new Set([...inCat,...cross].map(r=>r.r))];
  if(usedTypes.length){
    html+=`<div class="rel-legend"><h3>関係の凡例</h3><div class="items">`+
      usedTypes.map(k=>{
        const rt=RTYPES[k];
        return `<span><span class="sw" style="border-top:2.5px ${rt.dash?"dashed":"solid"} ${rt.color}"></span>${rt.label}</span>`;
      }).join("")+`</div></div>`;
  }
  ovPanel.innerHTML=html;
  const redraw=()=>drawArrows(inCat);
  redraw();                                  // layout is already computed here
  requestAnimationFrame(redraw);             // repeat on next paint just in case
  ovPanel.addEventListener("transitionend",redraw,{once:true}); // after the zoom-in settles
  // card heights shift when webfonts finish loading (or on any reflow) —
  // arrows must be re-routed from the final geometry or they drift onto text
  if(document.fonts)document.fonts.ready.then(()=>requestAnimationFrame(redraw));
  if(cardsRO)cardsRO.disconnect();
  cardsRO=new ResizeObserver(()=>redraw());
  ovPanel.querySelectorAll(".tcard").forEach(el=>cardsRO.observe(el));
}

function drawArrows(rels){

  Object.entries(RTYPES).forEach(([k,rt])=>{
    defs+=`<marker id="ah-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="${rt.color}"/></marker>`;
  });
  defs+=`</defs>`;

  /* Manhattan routing: arrows travel only through the gutters between cards,
     turning at right angles (rounded corners), so they never cross card text. */
  const R={};
  ovPanel.querySelectorAll(".tcard").forEach(el=>{
    const r=el.getBoundingClientRect();
    R[el.dataset.slug]={l:r.left-wr.left,t:r.top-wr.top,r:r.right-wr.left,b:r.bottom-wr.top,
      cx:r.left-wr.left+r.width/2,w:r.width};
  });
  const cluster=vals=>{
    const s=[...new Set(vals.map(v=>Math.round(v)))].sort((a,b)=>a-b),g=[];
    s.forEach(v=>{if(g.length&&v-g[g.length-1][g[g.length-1].length-1]<=20)g[g.length-1].push(v);else g.push([v]);});
    return g.map(x=>x[0]);
  };
  const all=Object.values(R);
  const rowTops=cluster(all.map(r=>r.t));
  const colLefts=cluster(all.map(r=>r.l));
  const rowOf=r=>rowTops.findIndex(t=>Math.abs(t-r.t)<=20);
  const colOf=r=>colLefts.findIndex(l=>Math.abs(l-r.l)<=20);
  const rows=rowTops.map((t,i)=>{const rs=all.filter(r=>rowOf(r)===i);
    return{top:Math.min(...rs.map(r=>r.t)),bottom:Math.max(...rs.map(r=>r.b))};});
  const cols=colLefts.map((l,i)=>{const rs=all.filter(r=>colOf(r)===i);
    return{left:Math.min(...rs.map(r=>r.l)),right:Math.max(...rs.map(r=>r.r))};});
  // hG(i): y of the horizontal gutter above row i / vG(i): x of the vertical gutter left of col i
  const hG=i=>i===0?rows[0].top-40:(rows[i-1].bottom+rows[i].top)/2;
  const vG=i=>i===0?cols[0].left-22:i===cols.length?cols[cols.length-1].right+22:(cols[i-1].right+cols[i].left)/2;
  const roundedPath=(pts,rad)=>{
    let d=`M${pts[0][0]},${pts[0][1]}`;
    for(let i=1;i<pts.length-1;i++){
      const [x0,y0]=pts[i-1],[x1,y1]=pts[i],[x2,y2]=pts[i+1];
      const l1=Math.hypot(x1-x0,y1-y0),l2=Math.hypot(x2-x1,y2-y1);
      const r1=Math.min(rad,l1/2),r2=Math.min(rad,l2/2);
      d+=`L${x1-(x1-x0)/l1*r1},${y1-(y1-y0)/l1*r1} Q${x1},${y1} ${x1+(x2-x1)/l2*r2},${y1+(y2-y1)/l2*r2}`;
    }
    return d+`L${pts[pts.length-1][0]},${pts[pts.length-1][1]}`;
  };

  let body="";
  rels.forEach((rel,idx)=>{
    const A=R[rel.f],B=R[rel.t];
    if(!A||!B)return;
    const rt=RTYPES[rel.r];
    const lane=(idx-(rels.length-1)/2)*9;          // spread parallel arrows apart
    const clampX=(x,c)=>Math.max(c.l+16,Math.min(c.r-16,x));
    const sx=clampX(A.cx+lane*.6,A), tx=clampX(B.cx+lane,B);
    const rA=rowOf(A),rB=rowOf(B),cA=colOf(A),cB=colOf(B);
    let pts;
    if(rA===rB){
      const gy=hG(rA)+lane;
      pts=[[sx,A.t],[sx,gy],[tx,gy],[tx,B.t]];
    }else{
      const down=rB>rA;
      const gyA=hG(down?rA+1:rA)+lane;
      const gyB=hG(down?rB:rB+1)+lane;
      const exitY=down?A.b:A.t, entY=down?B.t:B.b;
      if(Math.abs(gyA-gyB)<1){
        pts=[[sx,exitY],[sx,gyA],[tx,gyA],[tx,entY]];
      }else{
        // long hop: run vertically inside the column gutter next to the target
        const gx=vG(cA<cB?cB:cB+1)+lane*.8;
        pts=[[sx,exitY],[sx,gyA],[gx,gyA],[gx,gyB],[tx,gyB],[tx,entY]];
      }
    }
    body+=`<path d="${roundedPath(pts,12)}" fill="none" stroke="${rt.color}" stroke-width="2" ${rt.dash?`stroke-dasharray="${rt.dash}"`:""} marker-end="url(#ah-${rel.r})" opacity=".9"/>`;
    // label on the longest horizontal run — always inside a gutter, never on a card
    let best=null,bl=-1;
    for(let i=0;i<pts.length-1;i++){
      if(Math.abs(pts[i][1]-pts[i+1][1])<1){
        const L=Math.abs(pts[i][0]-pts[i+1][0]);
        if(L>bl){bl=L;best=[(pts[i][0]+pts[i+1][0])/2,pts[i][1]];}
      }
    }
    if(best)body+=`<text x="${best[0]}" y="${best[1]-5}" font-size="10" font-weight="700" fill="${rt.color}" text-anchor="middle" stroke="#FAFBF7" stroke-width="3" paint-order="stroke">${rt.label}</text>`;
  });
  svg.innerHTML=defs+body;
}

/* ---------- service view ---------- */
function renderTool(s){
  const t=TOOL[s];
  const z=zones[t.zi],c=z.cats[t.ci];
  ovPanel.style.setProperty("--hue",c.hue);
  const long=window.GEN.long[s]||t.desc;
  const dom=window.GEN.domains[s];

  let html=`<button class="ov-close" data-hash="c/${t.zi}-${t.ci}">× カテゴリへ (Esc)</button>`;
  html+=crumbHtml([
    {label:"全体マップ",hash:""},
    {label:c.title,hash:`c/${t.zi}-${t.ci}`},
    {label:t.name}
  ]);
  html+=`<div class="svc-head">${iconBox(s)}
    <div class="svc-meta">
      <h2 class="ov-title">${t.name}</h2>
      <div class="svc-cat-line">${z.name}レイヤー / ${c.title}</div>
      <div class="svc-badges">${tierBadges(t.tiers)}<span class="mini">${typeLabel[t.type]}</span>${t.bt?`<span class="mini">BigTech / 大手提供</span>`:""}
      ${dom?`<a class="svc-link" href="https://${dom}" target="_blank" rel="noopener">${dom} ↗</a>`:""}</div>
    </div></div>`;
  html+=`<div class="svc-body">${long.split(/\n+/).map(p=>`<p>${p}</p>`).join("")}</div>`;

  const rels=relOf(s);
  if(rels.length){
    html+=`<div class="svc-rels"><h3>関係のあるツール</h3><div class="xrel-items">`;
    rels.forEach(r=>{
      const rt=RTYPES[r.r];
      const other=r.f===s?r.t:r.f;
      const ot=TOOL[other];
      const dirLabel=r.f===s?`${rt.label} →`:`← ${rt.label}`;
      html+=`<div class="xrel-item">
        <span class="reltag" style="background:${rt.color}">${dirLabel}</span>
        <a data-hash="t/${other}">${ot.name}</a>
        <span class="cat-of">(${zones[ot.zi].cats[ot.ci].title})</span>
      </div>`;
    });
    html+=`</div></div>`;
  }

  const sibs=c.tools.map(x=>slug(x[0])).filter(x=>x!==s);
  if(sibs.length){
    html+=`<div class="svc-sibs"><h3>同カテゴリのツール</h3><div class="sib-cloud">`+
      sibs.map(x=>`<span class="tile" data-hash="t/${x}">${iconBox(x)}<span class="nm">${TOOL[x].name}</span></span>`).join("")+
      `</div></div>`;
  }
  ovPanel.innerHTML=html;
}

/* ---------- event wiring ---------- */
ovPanel.addEventListener("click",e=>{
  const el=e.target.closest("[data-hash]");
  if(!el)return;
  e.stopPropagation();
  const h=el.getAttribute("data-hash");
  openFrom(el.classList.contains("tcard")||el.classList.contains("tile")?el:ovPanel);
  if(el.classList.contains("ov-close")||el.tagName==="A")zoomSrc=null; // going up: no zoom-in effect
  location.hash=h?`#${h}`:"";
  if(!h)history.replaceState(null,"",location.pathname+location.search); // drop dangling '#'
});
ov.addEventListener("click",e=>{
  if(e.target===ov)goUp();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")goUp();
});
function goUp(){
  const st=parseHash();
  if(st.level===2){
    const t=TOOL[st.s];
    zoomSrc=null;
    location.hash=`#c/${t.zi}-${t.ci}`;
  }else if(st.level===1){
    zoomSrc=null;
    location.hash="";
    history.replaceState(null,"",location.pathname+location.search);
  }
}
window.addEventListener("hashchange",render);
window.addEventListener("resize",()=>{
  const st=parseHash();
  if(st.level===1)drawArrows(catRels(st.zi,st.ci).inCat);
});
render(); // handle direct links like page.html#t/devin
</script>
</body>
</html>

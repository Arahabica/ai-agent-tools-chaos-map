初の高額な料金体系は従量制へ見直され、導入の裾野が広がった。人手が足りないチームが定型バックログを外注感覚で捌く場面に向く一方、複雑なタスクでは人間のレビュー体制が成否を分けるという評価が定着している。", "claude-code": "Anthropicが開発したCLI型のコーディングエージェント。ターミナルから自然言語で指示するだけで、コードベースの探索、複数ファイルの編集、テスト実行、Gitコミットまでを自律的に行う。MCP(Model Context Protocol)による外部ツール連携や、作業手順を再利用可能にするスキル機能を備え、IDEを開かずに開発タスクを丸ごと委任するスタイルを確立した。デスクトップアプリやモバイル連携にも広がっている。\nエージェンティックコーディングというカテゴリ自体を定着させた存在で、Codex CLIやOpenCodeなど後発の多くが本作を参照点として設計されている。大規模で複雑なコードベースを扱う専業エンジニアからの評価が特に高く、Agent SDKを通じて他社製品の基盤としても使われる。フックやサブエージェントを駆使した高度なカスタマイズ文化が育っている点も競合との差になっている。", "pi-agent": "Mario Zechner氏が開発する超ミニマルなオープンソースのコーディングエージェント(pi.dev)。ツールはread・write・edit・bashの4つのみ、システムプロンプトは1,000トークン未満という徹底した最小設計で、MCPやプランモードのような機能をあえて持たず、必要なものはユーザーが拡張やスキルで足していく思想を貫く。常駐型エージェントOpenClawが内部の実行エンジンとして採用したことで広く知られるようになり、GitHubスターは6万を超える。モデル性能だけでなく「エージェントをどう動かすか」というハーネス層の設計が競争軸になったことを象徴する存在。\n多機能化が進む商用エージェントへのアンチテーゼとして支持を集めており、Claude Codeなどの対極に位置する。エージェントの仕組みをブラックボックスにせず自分で理解・制御したい開発者や、ハーネスを自作・研究したい層に向く。「機能はコアではなく拡張に置く」という設計思想は後発のOSSにも影響を与え、ミニマリズム回帰という潮流の起点になった。", "opencode": "オープンソースのターミナル型コーディングエージェント。特定ベンダーに依存せず、Anthropic・OpenAI・Google・ローカルモデルなど任意のLLMを接続して使えるプロバイダー非依存設計と、完成度の高いターミナルUI、クライアント/サーバー構成による拡張性が特徴。「Claude CodeのOSS代替」の代表格としてコミュニティで急速に支持を集め、GitHubスターも多い。モデルの選択肢を自分で握りながらエージェントコーディングを行いたい開発者の定番になりつつある。\nベンダー各社が自社モデル前提のCLIを競わせる中で、中立的な選択肢としての立ち位置を確立している。契約済みのサブスクリプションやローカルモデルを流用してコストを抑えたい開発者、モデルの当たり外れに応じて乗り換えたいチームに向く。特定モデルの性能に縛られない「ハーネスの良さ」で勝負する構図は、エージェント市場の多層化を象徴する潮流でもある。", "openai-codex": "OpenAIが提供するコーディングエージェント。クラウド上のサンドボックス環境で動くエージェントに、機能実装・バグ修正・PR作成などのタスクを並列に依頼できる。ローカルで動くCLI版も提供されており、ChatGPTのサブスクリプションと連携して使える。GitHub連携によりリポジトリを直接扱え、複数タスクの同時進行を前提とした設計が特徴。\nChatGPTの巨大なユーザー基盤に同梱される形で配布される点が最大の競争優位で、追加契約なしに試せる手軽さからClaude Codeと市場を二分する存在になった。GPT系モデルとの最適化された組み合わせを求めるチームや、クラウドでの並列実行を活かして複数タスクを同時に流したい場面で選ばれる。CLI版のオープンソース化などエコシステムの拡大も速い。", "openhands": "旧称OpenDevin。Devinの登場を受けてコミュニティ主導で始まった、オープンソースの自律型開発エージェントプラットフォーム。サンドボックス環境内でコード編集・コマンド実行・Webブラウジングを行い、Issueの解決からPR作成までを自律的にこなす。SWE-benchなどのベンチマークで高いスコアを示し、研究・実務の両面で参照されることが多い。クラウド版も提供されている。\n商用SaaSに閉じないDevin代替の代表格として、透明性やカスタマイズ性を重視する層に選ばれている。開発元のAll Hands AIが商用クラウドを展開しつつも、コードを自社環境で動かしエージェントの挙動を検証したい研究者や、セキュリティ要件でSaaSを使えない企業に特に適する。学術ベンチマークの標準実装として引用されることが多い点も独特の強みだ。", "jules": "Googleが提供する非同期型のコーディングエージェント。GitHubリポジトリと連携し、Issueやタスクを依頼するとクラウド上のVMでコードを解析・修正し、変更計画とdiffを提示してPRを作成する。「依頼して待つ」タイプのエージェントで、Gemini CLIのような対話型とは補完関係にある。バグ修正や依存関係の更新など、バックログ消化に向く。\nGoogle製という安心感とGeminiの長大なコンテキストを武器に、DevinやCodexが先行した非同期エージェント市場を追う立場にある。無料枠から試せる敷居の低さが特徴で、まず委任型エージェントを体験してみたい個人開発者や、GitHub中心のワークフローに小さく組み込みたいチームに向く。Gemini CLIとの役割分担でGoogle開発者体験の一角を担う。", "v0": "Vercelが提供する生成UIサービス。自然言語で指示するとReact+Tailwind CSS(shadcn/ui)ベースのUIコードを生成し、プレビューを見ながら対話的に修正できる。生成物はコードとしてエクスポートでき、Vercelへのデプロイもシームレス。デザインモックアップから実装済みコンポーネントまでの距離を一気に縮めるツールとして、フロントエンド開発者やデザイナーに広く使われている。\nLovableやBolt.newと同じ生成系ビルダー市場にありながら、フルアプリ生成よりUIコンポーネントの品質で差別化している。Next.jsやshadcn/uiをすでに使っているチームなら生成物をそのまま本番コードに取り込めるため、既存プロジェクトの部品づくりに最も馴染む。デザインシステムを持つ企業向けの機能拡充が進み、プロ開発者寄りの進化を続けている。", "bolt-new": "StackBlitzが提供するブラウザ完結型のAIアプリ生成サービス。WebContainer技術によりブラウザ内でNode.js環境を動かし、プロンプトからフルスタックアプリの生成・実行・デプロイまでを完結させる。オープンソース版のbolt.diyも公開されており、任意のLLMを接続して自前で動かせる。プロトタイピング速度の速さで人気を得た。\n公開直後に数か月でARRが急伸した「バイブコーディング」ブームの立役者で、LovableやReplit Agentと市場を争う。WebContainerによりサーバー側のインフラを持たない構造がコスト面の強みで、思いついたアイデアをその場で動かして確かめたいプロトタイピング用途に最も向く。生成物を本番運用に載せる際は別途インフラ設計が必要という割り切りも知っておきたい。", "lovable": "スウェーデン発のAIアプリ生成サービス。自然言語での対話を通じてWebアプリを構築し、Supabase連携によるバックエンド(DB・認証)まで含めて動くプロダクトを作れる。非エンジニアでもアイデアを形にできる手軽さで急成長し、欧州で最速級のARR成長を記録したスタートアップとして知られる。GitHub連携でコードの所有権もユーザー側にある。\nBolt.newやv0と並ぶアプリ生成市場の主役で、特に非エンジニアの起業家やデザイナーが最初のプロダクトを作る場面で選ばれることが多い。認証やDBまで含めて動くものが手に入る一方、生成アプリのセキュリティ設定の甘さが指摘される事例も報じられ、公開前のレビューの重要性が語られるようになった。欧州スタートアップの成功例としても注目され続けている。", "replit-agent": "クラウドIDEのReplitが提供するアプリ構築エージェント。自然言語で要望を伝えると、環境構築からコード生成、データベース設定、デプロイまでをReplitのクラウド上で一気通貫で行う。開発環境の準備が一切不要な点が最大の強みで、モバイルアプリからも操作できる。非エンジニアの社内ツール開発用途でも広く使われるようになった。\n教育向けIDEとして築いたユーザー基盤を土台に、LovableやBolt.newとは「実行環境ごと提供する」点で差別化している。ホスティングやDBの契約を別途考えたくない人、社内業務ツールを現場部門が内製したい企業に特に向く。近年は企業向け販売を強化しており、非エンジニアによるアプリ内製という潮流の代表例として取り上げられることが多い。", "base44": "プロンプトからフルスタックアプリを生成するノーコード系サービス。認証・データベース・ホスティングなどを内蔵し、コードを意識せずに動くアプリを作れる手軽さが特徴。個人開発者が立ち上げたサービスながら急成長し、Wixに買収されたことで話題になった。業務ツールや社内アプリを素早く作る用途に向く。\n巨大資金を集める競合がひしめくアプリ生成市場で、少人数開発による収益性の高さを証明しWixによる高額買収に至った点が語り草になっている。買収後はWixの基盤に支えられ、事業継続性の面で個人開発SaaSより安心して選べるようになった。凝った要件よりも、フォームやダッシュボード中心の業務アプリを最短で形にしたい非エンジニアに向く。", "google-ai-studio": "GoogleのGeminiを使うための公式開発ハブ。プロンプトの試作やAPIキー発行の場として始まり、現在は「Build」機能により、自然言語で指示するだけでGeminiを組み込んだWebアプリを生成し、そのまま公開・共有できるようになっている。ブラウザだけで無料から始められる手軽さが特徴で、終了予定のFirebase Studioからの移行先としても案内されている。Geminiエコシステムでアプリを作る際の実質的な入口。\nOpenAIのPlaygroundに相当する位置づけだが、無料枠の広さとアプリ公開までの一体化で一歩踏み込んでいる。Gemini APIを検討する開発者が最初に触る場所であると同時に、コードを書かない人がAIアプリ作りを体験する入口も兼ねる。Geminiの新機能が最速で試せる場でもあり、モデル発表のたびに注目が集まる。学習用途から小規模な社内ツールまで幅広い。", "google-opal": "Google Labsが提供する、ノーコードでAIミニアプリを構築・共有できるツール。「入力→生成→出力」というシンプルなノード構成を自然言語の指示や直感的なUI操作で組み立て、作ったアプリはURLですぐにチームへ共有できる。2025年7月に米国で提供が始まり、同年10月に日本を含む15か国へ拡大。完全無料で使え、テンプレートのRemixから始められる手軽さもあって、非エンジニアの業務改善ツール作成の入口として注目されている。\nn8nやZapierのような本格的な自動化基盤と、ChatGPTに都度依頼する使い方の中間を埋める存在といえる。定型的なプロンプト作業をアプリ化して同僚に配りたい、といった小さな業務改善に最適で、ITに詳しくない現場担当者でも扱える。Google Labs発の実験的プロダクトのため仕様変化は速いが、無料で試せるノーコードAI構築の入口として評価されている。", "create": "テキストから、サイト・アプリ・内部ツールなどを生成するAIビルダー。プロンプトを書くとフロントエンドとバックエンド機能を含むプロダクトを組み立て、そのまま公開できる。複数のAIモデルを裏側で使い分け、非エンジニアがアイデアを最速で形にすることに焦点を当てている。米国発のスタートアップで、バイブコーディング系サービスの一角。\n\n---\nLovableやBolt.newといった資金力のある競合がひしめく市場では小規模なプレイヤーだが、モバイルアプリ対応や複数モデルの使い分けなどで独自色を出している。凝った開発環境よりも「とにかく早く公開したい」個人や小規模チームに向き、無料から始められる料金設計も敷居が低い。乱立するビルダーの中でどこが生き残るかという市場淘汰の渦中にある。", "langchain": "LLMアプリケーション開発フレームワークの草分けであり、最大のエコシステムを持つオープンソース。プロンプト管理、モデル抽象化、ツール呼び出し、RAGなどの部品を組み合わせてアプリを構築できる。Python版とJavaScript/TypeScript版があり、対応するインテグレーション(モデル・ベクトルDB・外部サービス)の数は群を抜く。エージェント時代には後述のLangGraphへと発展し、周辺にLangSmithなどの商用サービス群を持つ。\n抽象化が過剰で本番には不向きという批判に長くさらされてきたが、v1.0での大幅な整理を経て評価を立て直しつつある。とにかく多くのモデルやベクトルDBを試したい検証フェーズ、情報の多さを頼りたい初学者には依然として最有力だ。一方で本番システムはLangGraphや軽量な代替へ移す動きも定着しており、「入口としての標準」という位置づけが実態に近い。", "langgraph": "LangChainチームが開発した、エージェントの制御フローを「状態を持つグラフ」として設計するフレームワーク。各ステップをノード、遷移をエッジで表現し、分岐・ループ・人間の承認(Human-in-the-loop)・チェックポイントによる中断再開を厳密に制御できる。自由度の高い自律エージェントではなく、信頼性が求められる本番システム向けの設計思想が特徴。マネージド実行環境のLangGraph Platformも提供される。\nLinkedInやUberなど大企業の本番採用事例を積み上げ、「実務で使うエージェントフレームワーク」の代表格という評価を確立した。学習コストは高めで、CrewAIのような直感的なフレームワークと対照的な存在として比較されることが多い。エージェントの挙動を監査・再現できることが必須の金融や大規模SaaSなど、失敗コストの高い領域でこそ真価を発揮する。", "llamaindex": "データ接続とRAG(検索拡張生成)に強みを持つLLMアプリフレームワーク。多様なデータソースからの取り込み、インデックス構築、クエリエンジンといったRAGの部品を豊富に備え、エージェントワークフロー機能も拡充している。商用側では、複雑なドキュメント解析のLlamaParseやマネージド基盤のLlamaCloudを展開し、「企業データをLLMにつなぐ」領域で確固たる地位を築いている。\n汎用化を進めるLangChainに対し、「企業文書とRAG」という得意領域を深掘りする戦略で棲み分けてきた。社内文書検索やドキュメントQAが主目的ならまず候補に挙がる存在で、PDFなど複雑な文書を扱う場合はLlamaParseとの組み合わせが効く。RAG単体は一般化しつつあるが、エージェントに正確な社内知識を持たせる需要は増しており、その文脈で再評価が進む。", "crewai": "「役割(Role)を持つエージェントのチーム=クルー」という比喩でマルチエージェントを構築するPythonフレームワーク。各エージェントに役割・目標・背景設定を与え、タスクを順次または階層的に協働させる設計が直感的で、マルチエージェント入門として絶大な人気を得た。より厳密な制御を行うFlows機能や、デプロイ・監視を担う商用プラットフォーム(AMP)も提供している。\n書籍や講座で扱われる頻度が高く、マルチエージェントの学習経路として事実上の標準になっている。役割分担の比喩が直感的なぶん細かい制御は苦手とされ、厳密さを求める場面ではLangGraphと使い分けられることが多い。まず動くマルチエージェントを組んで概念を掴みたい人、社内デモを素早く作りたいチームに向く。独立系として大型調達を続けている点も特徴だ。", "autogen-ag2": "Microsoft Researchから生まれたマルチエージェント会話フレームワーク。複数のエージェントが会話を通じて協調しタスクを解決する「対話ベース」の設計が特徴で、コード実行エージェントとレビューエージェントの組み合わせなどの研究的ユースケースを切り開いた。現在はコミュニティ主導のAG2が開発を継続する一方、Microsoft本体はSemantic Kernelと統合した後継「Microsoft Agent Framework」への移行を進めており、新規採用時は後継側も含めて検討したい。\nマルチエージェント研究の火付け役としての歴史的意義は大きいが、本家の開発リソースがMicrosoft Agent Frameworkへ移った現在は移行期の技術という見方が一般的だ。会話型の協調という設計は探索的な研究や実験には今も有効で、論文の実装基盤として引用され続けている。新規の業務システムでの採用は、後継や他フレームワークとの比較検討が前提になる。", "semantic-kernel": "Microsoftが開発するエンタープライズ向けのAIオーケストレーションSDK。C#・Python・Javaに対応し、既存の業務システムにLLM機能やエージェントを組み込むことを重視した設計。プラグインによる関数呼び出し、プランナー、メモリなどの機能を備え、Azure OpenAIとの親和性が高い。.NET系エンタープライズ環境の定番だが、MicrosoftはAutoGenと統合した後継「Microsoft Agent Framework」への移行を進めており、新規プロジェクトでは後継側が推奨されつつある。\nLangChainがPythonコミュニティを押さえたのに対し、C#/.NETという企業システムの主戦場を押さえた点が独自の強みだった。既存の.NET資産にAIを組み込みたい企業、Azure中心のガバナンスを崩したくない情報システム部門に適する。Agent Frameworkへの統合はMicrosoftのエージェント戦略の一本化を意味し、既存利用者には移行パスが示されている。", "openai-agents-sdk": "OpenAIが公開した軽量なエージェント構築SDK。実験的だったSwarmを本番向けに発展させたもので、「エージェント」「ハンドオフ(エージェント間のタスク引き継ぎ)」「ガードレール」という少数の抽象だけでマルチエージェントを組める簡潔さが特徴。トレーシング機能を内蔵し、OpenAIのResponses APIやツール群と自然に統合される。OpenAIエコシステムでの標準的な選択肢。\nLangChainなどの重厚なフレームワークに対する「公式の軽量な回答」として位置づけられ、抽象を絞った設計は他社のSDKにも影響を与えた。OpenAIのモデルとツール群で完結させる前提を受け入れられるなら、学習コストの低さと公式サポートの安心感は大きい。逆にマルチベンダー戦略を取る組織には向かず、ロックインの許容度が選定の分水嶺になる。", "google-adk": "GoogleのAgent Development Kit。Geminiを中心としつつモデル非依存で使えるエージェント構築フレームワークで、階層的なマルチエージェント構成、豊富なツール連携、評価機能などを備える。エージェント同士が相互運用するためのA2A(Agent2Agent)プロトコルと対をなす存在で、Google CloudのVertex AI Agent Engineにデプロイして本番運用する流れまで整備されている。\nOpenAI Agents SDKやAWSのStrandsと並ぶ「モデルベンダー製SDK」競争の一角で、Vertex AIへの展開まで見据えた本番運用の道筋が太い点が差別化要素だ。Google CloudとGeminiに投資している企業なら第一候補になる。エージェント間連携のA2Aプロトコルを推進する立場でもあり、マルチエージェントの相互運用という次の潮流を占う意味でも動向が注視される。", "mastra": "TypeScript向けのオープンソースAIエージェントフレームワーク。静的サイトジェネレータGatsbyの開発チームが立ち上げたことで注目された。エージェント、ワークフロー(耐久性のあるグラフベース実行)、RAG、評価、ローカル開発用のプレイグラウンドまでを一体で提供し、「TS開発者がエージェントを作るときの標準スタック」を狙う。クラウド版によるデプロイ・監視も提供。\nPython中心だったエージェント開発をTypeScriptへ引き寄せる潮流の中心にあり、Vercel AI SDKより上のワークフロー層を担う点で補完関係にある。Webアプリと同じ言語・リポジトリでエージェントまで完結させたいフルスタックTS開発者に最適だ。Y Combinator出身で大型調達も続き、急速に機能を広げる開発速度そのものがコミュニティの評価につながっている。", "pydantic-ai": "Pythonのデータ検証ライブラリとして絶大なシェアを持つPydanticのチームが開発したエージェントフレームワーク。型安全性と構造化出力を中核に据え、「FastAPIのような開発体験をLLMアプリに」という思想で設計されている。依存性注入によるテスト容易性、主要モデルへの対応、Logfireとの連携による観測性など、堅実なエンジニアリングを好む層に支持されている。\nLangChainの複雑さに疲れたPython開発者の受け皿として支持を広げており、「薄くて型安全」という設計は後発の標準になりつつある。LLMの出力を確実に構造化データとして受け取りたいAPI開発や、テストとCIを重視する本番志向のチームに向く。Pydantic本体がLLMエコシステム全体の基盤である以上、開発元への信頼がそのまま採用理由になるという珍しい存在だ。", "smolagents": "Hugging Faceが開発した軽量エージェントライブラリ。エージェントがJSONでツールを呼ぶのではなく、Pythonコードを書いて実行する「コードエージェント」方式を中核に据えるのが特徴で、少ないステップ数で複雑な処理を表現できる。コアのコードが約1,000行と小さく、学習用途にも本番の小規模エージェントにも使いやすい。Hugging Face Hubのモデル・ツールと自然に連携する。\n重量級フレームワークへの対抗というよりも、エージェントの原理を最短で学ぶ教材としての価値が高く、Hugging Faceの公式コースと併せて入門者の定番になっている。コード実行方式は研究面でも性能の優位が報告され、後発フレームワークが同方式を取り入れる潮流を作った。依存を最小限にしたい小さなプロジェクトや、論文実装の検証にも使いやすい。", "vercel-ai-sdk": "Vercelが開発する、JavaScript/TypeScript向けAI開発ツールキットの事実上の標準。プロバイダー抽象化により、OpenAI・Anthropic・Googleなどのモデルを統一APIで切り替えられ、ストリーミングUI、構造化出力、ツール呼び出し、エージェントループまでをカバーする。React等のフロントエンドフレームワークとの統合が丁寧で、Webアプリに AI機能を組み込む際の定番となっている。\nnpmダウンロード数で他を圧倒し、JS/TS圏ではLangChain.jsを事実上置き換える形で標準の座を握った。Next.jsのアプリにチャットUIやAI機能を組み込みたいフロントエンド開発者ならまず選ぶべき存在で、近年はエージェントループの強化により単なるUI用SDKの枠を超えつつある。MastraなどTS系フレームワークの下層としても使われ、エコシステムの土台になっている。", "haystack": "ドイツのdeepset社が開発する、検索・RAGパイプライン構築のための老舗オープンソースフレームワーク。コンポーネントをパイプラインとして接続するアーキテクチャが明快で、本番運用を意識した堅牢性に定評がある。エージェント機能やMCP対応も進み、商用のdeepsetプラットフォームでは企業向けのRAG/エージェント開発・運用環境を提供している。\nLangChain以前から存在する老舗として、流行を追うより後方互換と安定性を重視する開発姿勢が信頼されている。ドキュメント検索や社内QAを地道に本番運用したい企業、フレームワークの破壊的変更に振り回されたくないチームに向く。エージェントブームの中では地味な存在だが、欧州企業を中心に堅実な採用が続き、「枯れた選択肢」としての価値が再認識されている。", "strands-agents": "AWSがオープンソースとして公開したエージェントSDK。「モデル駆動」アプローチを掲げ、複雑なオーケストレーションコードを書かずに、モデル自身の推論にツール選択やプランニングを委ねるシンプルな設計が特徴。Amazon Q DeveloperやAWS GlueなどAWS内部での実運用を経て公開された。Bedrockをはじめ各種モデルに対応し、AWS環境でのエージェント構築に自然に馴染む。\nOpenAIやGoogleに続いてAWSが投じた「ベンダー製エージェントSDK」で、Bedrock AgentCoreと組み合わせた本番運用までの導線が競争力の源泉だ。すでにAWSへ寄せているエンタープライズなら、IAMや監視など既存の運用体制に自然に載せられる点で第一候補になる。オーケストレーションを書き込まないモデル駆動の設計は、モデル性能の向上を前提とした潮流に沿う。", "n8n": "ソースコードが公開されたワークフロー自動化ツール(fair-code)。ノードをつないで数百のサービスを連携させる点はZapier的だが、セルフホストできるためデータを社外に出せない企業でも使える。AIエージェントノードを備え、LLM・ツール・メモリを組み合わせたエージェントをワークフローに埋め込める点が近年の急成長の要因。「AI自動化の実装先」として最有力の選択肢になっている。\nZapierやMakeと比較されることが多いが、コードを書ける層に最も支持されている点が特徴で、JavaScriptでの拡張やGitによる管理と相性が良い。コミュニティが公開するワークフローのテンプレートが数千件規模で流通しており、他人の自動化を写して始められる。近年は評価額が急上昇し、AIブームの恩恵を最も受けた自動化ツールと目されており、エンジニアが社内の自動化基盤を内製したい場面でまず候補に挙がる。", "dify": "LLMアプリケーションをGUIで構築できるオープンソースプラットフォーム。チャットボット、ワークフロー、エージェント、RAGパイプラインをノーコード/ローコードで組み立てられ、プロンプト管理・ログ・アノテーションなど運用機能まで一体化している。セルフホスト可能な点と完成度の高さから、日本企業でも社内LLM基盤として採用例が非常に多い。クラウド版も提供される。\n中国発のチームが開発しており、GitHubスター数はLLMアプリ基盤の中でもトップクラスに伸びた。コードで組むLangChainやフロービルダー系のFlowiseと比べ、開発から運用・改善までを一つの画面で完結できる「業務アプリとしての完成度」が差別化点だ。プラグインマーケットの整備など機能追加のペースも速い。エンジニアが少ない組織がPoCから本番導入まで一気に進めたい場合に特に向く。", "zapier": "ノーコード自動化の老舗にして最大手。8,000を超えるアプリ連携を持ち、「トリガーとアクション」を組み合わせて業務を自動化する。近年はAIを全面に取り入れ、自然言語からの自動化作成、AIエージェント(Zapier Agents)、チャットボット、MCP経由でのエージェント連携などを展開。既存のSaaS連携資産をAIエージェントの「手足」として提供する方向に進化している。\nn8nやMakeといった後発の追い上げを受ける立場だが、連携数と非エンジニアへの浸透度では依然として頭一つ抜けている。凝った処理や大量実行では割高になりやすく、複雑な自動化は他ツールへ流れる傾向がある一方、「とにかく早く確実に動かしたい」業務部門には今も最短の選択肢だ。エージェント時代には、蓄積した連携資産をMCPで外部のAIに開放する側に回ることで生き残りを図っている。", "openai-agentkit": "OpenAIが2025年のDevDayで発表したエージェント構築キット。ノードをつないでエージェントのロジックを組み立てるビジュアルツール「Agent Builder」、自社サービスにチャットUIを埋め込む「ChatKit」、評価(Evals)やコネクタ管理などを統合し、OpenAIのモデル・ツール群の上でエージェントを本番導入するまでの距離を縮める。コードで組むAgents SDKに対する「GUI側の入口」であり、OpenAIエコシステム内でワークフロー系スタートアップの領域に踏み込む動きとして注目された。\n発表時には「ワークフロー系スタートアップを飲み込むのでは」と業界をざわつかせたが、実際にはOpenAIモデル前提のロックインを嫌う層も多く、n8nやDifyを置き換えるには至っていない。ChatGPTを全社導入済みで、スタックをOpenAIに寄せると決めた企業が追加ツールなしにエージェントを社内展開したい場合に最も合理的な選択となる。純正ならではの新モデル・新機能への追随の速さが最大の魅力だ。", "make": "旧Integromat。ビジュアルなシナリオエディタで複雑な自動化を組めるノーコードツール。分岐・繰り返し・データ変換の表現力が高く、Zapierより込み入った処理を安価に組めるとして人気がある。AI方面ではAIエージェント機能やMCP対応を追加し、既存の2,000以上のアプリ連携をエージェントから利用できるようにしている。欧州発のサービス。\n位置づけとしてはZapierとn8nの中間にあり、セルフホストまでは不要だがZapierでは表現しきれない複雑な処理を組みたい、という層の受け皿になっている。視覚的なシナリオ表現は自動化の全体像を把握しやすく、マーケティングや業務部門の「作り込む非エンジニア」に根強いファンが多い。プロセスマイニング大手Celonis傘下という背景もあり、業務プロセス改善の文脈で語られる機会が増えている。", "flowise": "ノードベースのGUIでLLMアプリやエージェントを構築できるオープンソースツール。LangChain系のコンポーネントをドラッグ&ドロップで接続し、チャットフロー、エージェントフロー、RAGを素早く形にできる。構築したフローはAPIや埋め込みウィジェットとして公開可能。セルフホストの手軽さと学習コストの低さから、プロトタイピング用途で広く使われる。クラウド版もある。\n常にLangflowやDifyと比較される立場で、運用機能まで抱え込むDifyに対し、フロービルダーとしての軽さと導入の簡単さで差別化している。Node.js製のためJavaScript系の技術スタックを持つチームには特に馴染みやすい。学習教材やチュートリアルでの露出が多く、「初めてLLMアプリを組む」入口として選ばれることが多い一方、大規模な本番運用では別の基盤へ移行する例も見られる。", "langflow": "LLMワークフローをビジュアルに構築するオープンソースのビルダー。LangChainベースのコンポーネントをキャンバス上で接続し、RAGやマルチエージェントのフローを作成、APIとして公開できる。Pythonでのカスタムコンポーネント拡張が容易で、開発者寄りの柔軟性を持つ。DataStax(のちIBMが買収)の支援を受けており、マネージド版も提供されている。\n直接の競合はFlowiseで、Python製である点が最大の分かれ目となる。データサイエンティストやPythonエンジニアが自作コンポーネントで拡張しながら使う場面ではこちらに分があり、IBM傘下となったことでエンタープライズ向けの信頼性や既存データ基盤との統合も強化されつつある。ビジュアルビルダーは試作用と見なされがちだが、作ったフローをAPI化して本番システムの部品に組み込む使い方が広がっている。", "gumloop": "AI処理を前提に設計されたワークフロー自動化SaaS。Webスクレイピング、文書解析、LLMによる処理などをノードとして接続し、営業リスト作成やSEO業務のような「AIならではの自動化」を組みやすい。非エンジニアの現場担当者が自力で業務フローを自動化できることを重視しており、Y Combinator出身のスタートアップとして急成長している。\nZapierやMakeが既存の連携資産にAIを後付けしたのに対し、最初からLLM処理を中心に設計された「AIネイティブ自動化」の代表格として語られる。特に営業・マーケティング領域のオペレーション自動化で評価が高く、米国ではRevOps担当者の間で定番化しつつある。大型の資金調達を経てエンタープライズ対応も進めており、同種のAIワークフロー系スタートアップの中では頭一つ抜けた存在になっている。", "lindy": "ノーコードでAIアシスタント/エージェントを作成できるサービス。メール対応、会議調整、リード対応、電話応対などのテンプレートから始めて、トリガーと指示を自然言語で設定するだけで「AI社員」を配置できる。数千のアプリ連携を持ち、複数のLindy(エージェント)同士を連携させることも可能。営業・サポート・バックオフィス業務の自動化に焦点を当てている。\n「AI社員」市場ではRelevance AIやZapier Agentsと競合するが、テンプレートの充実と設定の平易さで、技術者のいない中小企業や個人事業主でも導入しやすい点が持ち味だ。特にメール処理や会議調整のような秘書的業務では完成度が高く、まず一つの業務をAIに任せてみる入口として選ばれることが多い。創業者自身が積極的に発信していることもあり、米国のスモールビジネス層での知名度が着実に上がっている。", "activepieces": "オープンソースのZapier代替として開発されたワークフロー自動化ツール。TypeScript製で、連携コネクタ(ピース)をコミュニティが拡張できる設計。セルフホストによりデータ主権を保ちながら自動化を構築でき、AIエージェント機能やMCPサーバーとしての利用にも対応した。すべてのピースがMCPツールとして使える点を打ち出し、AI連携ハブとしての性格を強めている。\n最大のライバルはn8nだが、あちらがfair-codeライセンスで商用利用に一定の制約を残すのに対し、コア部分を寛容なMITライセンスで公開している点が思想的な違いだ。自社製品に自動化機能を組み込みたいSaaS企業向けのエンベデッド提供にも力を入れており、単なるZapier代替に留まらない展開を見せる。知名度ではn8nに劣るものの、ライセンスの自由度を重視する開発者や組み込み用途では有力な選択肢となる。", "relevance-ai": "「AIワークフォース(AIの労働力)」を掲げるノーコードのエージェント構築プラットフォーム。営業のリード対応、リサーチ、サポートなどの業務ごとにAIエージェントを作成し、ツール・ナレッジ・他のエージェントと組み合わせてチームとして働かせることができる。テンプレートが豊富で、ビジネス部門主導でエージェント導入を進めたい企業に向く。オーストラリア発。\n競合のLindyが個人・中小向けの手軽さを打ち出すのに対し、こちらは営業開発エージェント「Bosh」のような役割特化型AIを軸に、チームや部門単位での導入を狙う色が濃い。大型調達を重ねて「AIワークフォース」という市場カテゴリ自体を牽引する存在になっており、エージェントを一体だけでなく複数組み合わせて業務プロセス全体を任せたい場合に向く。エンジニアを介さず現場が運用を回せる点も評価されている。", "mem0": "AIエージェントに長期記憶を持たせるためのメモリレイヤー。会話やユーザーの好みから重要な情報を抽出・保存し、次回以降の対話で自動的に想起させることで、「ユーザーを覚えているAI」を実現する。ベクトル検索とグラフを組み合わせた記憶管理をOSSとして公開し、マネージドAPIも提供。パーソナライズが重要なアシスタントやコンパニオン系アプリで広く採用されている。\nメモリ層ではZepやLettaと比較されるが、導入の手軽さと汎用性で最も広く知られた存在であり、GitHubスター数もこの分野で群を抜く。研究論文で既存手法に対する精度・コスト面の優位を主張し、MCP経由で複数のAIツール間で記憶を共有するOpenMemoryのような展開も進める。凝った時系列管理よりも、まずエージェントに「ユーザーを覚えさせる」ことを最短で実現したい開発者に向いた選択肢だ。", "zep": "エージェント向けのメモリ基盤。会話履歴やビジネスデータから「時間的ナレッジグラフ」を構築し、事実がいつ有効だったかまで追跡しながら関連情報を取り出せるのが特徴。単なる会話要約ではなく、変化する事実関係を保持できるため、長期運用するアシスタントやCRM連携エージェントに向く。コアエンジンのGraphitiはOSSとして公開されている。\n手軽さを売りにするMem0とは対照的に、記憶の正確性と時間軸の扱いを重視する設計で、両者はベンチマークの優劣を巡って論争を繰り広げたことでも知られる。事実関係が頻繁に更新される業務データを扱う場合や、数か月単位で運用するエージェントの記憶基盤としては、こちらの構造化アプローチが効く。エンタープライズ寄りのポジションを取っており、精度要件の厳しいユースケースで検討される機会が多い。", "letta": "研究プロジェクトMemGPTから発展した、ステートフルなエージェントの実行基盤。LLMのコンテキスト長の制約を、OSの仮想メモリのような階層的メモリ管理で乗り越える設計思想が特徴で、エージェントが自分の記憶を自分で編集する。エージェントを「デプロイして動かし続けるサービス」として扱うAPI・開発環境(ADE)を提供し、長期稼働するエージェントの構築に向く。\nMem0やZepが既存エージェントに後付けする記憶部品なのに対し、エージェント自体の実行と状態管理まで丸ごと引き受ける基盤である点で立ち位置が異なる。UCバークレーの研究室発で学術的な裏付けが強く、エージェントの状態をファイルとして持ち運ぶ標準化の提案など、エコシステム形成にも積極的だ。数週間から数か月動き続けるエージェントを本格的に設計したい開発者が選ぶ、思想の濃い選択肢と言える。", "composio": "AIエージェントと外部SaaSをつなぐツール連携プラットフォーム。GitHub、Slack、Gmail、Salesforceなど数百のサービスへの認証済みツールを提供し、OAuth管理という面倒な部分を肩代わりする。LangChain、CrewAI、OpenAI SDKなど主要フレームワークに数行で組み込め、MCP経由での利用にも対応。「エージェントの手足を最速で増やす」ためのサービス。\n同種のツール連携レイヤーではArcadeやPipedreamと競合するが、対応フレームワークの広さと連携数の多さで「まず試される」立場を確立している。個々のMCPサーバーを寄せ集めるより、認証込みのツール群を一括で得られる点が時間短縮につながるため、プロトタイプを急ぐスタートアップとの相性が特に良い。大型調達を経てエンタープライズ機能も拡充しており、この領域の主導権争いの中心にいるプレイヤーだ。", "arcade": "エージェントにツールを「安全に」実行させることに焦点を当てたツール呼び出し基盤。ユーザーごとのOAuth認証を管理し、エージェントが本人の権限でGmailやSlackなどを操作できるようにする。ツールの実行を仲介するランタイムとして動作し、認可・監査の仕組みを提供する点が特徴。ツールキットはOSSとして公開されており、エンタープライズでの本番運用を意識した設計。\n連携数で勝負するComposioに対し、「誰の権限で実行したか」を厳密に扱う認可設計を差別化軸に据えている。エージェントが本番業務でメール送信や決済のような不可逆な操作を行うようになると、監査証跡やユーザー単位の権限管理が必須になるという読みで、金融など規制産業への導入を意識した作りだ。機能の派手さより統制を重視するエンタープライズが、エージェントに実行権限を渡す段階で検討すべき選択肢である。", "smithery": "MCP(Model Context Protocol)サーバーのレジストリ兼ホスティングサービス。数千のMCPサーバーが登録されており、開発者は自分のエージェントに接続したいツールをここで探し、ワンクリックやCLIで導入できる。MCPエコシステムの「アプリストア」的な役割を果たしており、MCPサーバーの公開・配布の事実上のハブの一つになっている。\nMCPレジストリとしてはmcp.soなどの類似サービスや後発の公式レジストリと並存する状況にあるが、単なる一覧に留まらずホスティングや利用統計まで提供する点で開発者体験に優れる。エージェントに外部ツールを足したいとき、自前でサーバーを立てる前にまずここを検索するのが定石になりつつある。公式レジストリの整備が進む中で独自の付加価値をどう保つかが注目されるものの、MCP普及初期を支えた功績は大きい。", "pipedream": "開発者向けのAPI連携・自動化プラットフォーム。数千のアプリ連携とサーバーレスのコード実行(Node.js/Python)を組み合わせ、コードを書ける人向けのZapierとして人気を得た。近年は全連携先をMCPサーバーとして提供する取り組みで注目され、エージェントに数千のツールを一括で持たせる基盤として使われている。認証管理を肩代わりする点も強み。\nノーコードに純化したZapierと、コードを全部自分で書くスクリプト運用の中間という立ち位置で、「コードは書けるがインフラは持ちたくない」開発者層を的確に捉えてきた。エージェント時代にはこの資産がそのまま効いており、Composioなどと並んでツール連携レイヤーの有力候補に名前が挙がる。個人向けの無料枠が寛大なことでも知られ、まず一人で試してからチームへ広げる草の根的な普及パターンが多いのも特徴だ。", "fastmcp": "MCPサーバーを最小限のコードで構築できるPythonフレームワーク。デコレータを付けるだけで関数をMCPツールとして公開でき、MCP公式SDKにも取り込まれた事実上の標準的存在。認証やプロキシ、サーバー合成などの応用機能も備え、v2系では本番運用向けの機能拡充が進む。「自社システムをエージェントから使えるようにする」最初の一歩として最も使われるツール。\n\n---\nワークフローツールPrefectの創業者が立ち上げたプロジェクトで、その設計思想はFastAPIの開発体験に強く影響を受けている。v1が公式SDKに取り込まれた後もv2として独自の進化を続けるという珍しい経緯を持ち、公式より機能が先行する状態が続く。Pythonで社内APIや業務ロジックをエージェントに開放したい場合の最短ルートであり、MCPサーバー構築の入門記事でほぼ必ず登場する教科書的な存在だ。", "multica": "コーディングエージェントを「ツール」ではなく「チームメイト」として扱うことを掲げるオープンソースのマネージドエージェント基盤。Issueトラッカー上でエージェントを人間と同じように担当者としてアサインし、進捗報告やブロッカー報告をさせながらタスクを消化させる。実行はローカルのデーモン(手元のCLI・APIキー・コード)で行い、管理と可視化を中央に寄せる設計。完了したタスクからスキルを蓄積・共有する仕組みも持つ。\n複数エージェントを一画面で束ねるOrchaが「監督」の道具だとすれば、こちらはIssueトラッカーという既存の開発プロセスにエージェントを溶け込ませる思想で、スクラムなどの運用が確立したチームに馴染みやすい。実行が手元で完結するため、コードやAPIキーを外部サービスに預けたくない組織でも導入しやすい。エージェントを増員の代わりに使う「AIチームメイト」型の運用を試したい開発チームの選択肢となる。", "orcha": "複数のコーディングエージェント(Claude、Gemini、Codexなど)を並列に統括するマルチエージェント・オーケストレーションツール。ビジュアルなワークフロー、エージェント間の自動ハンドオフ、テンプレート保存に対応し、作りたいものを平易な言葉で伝えるとPMエージェントがチーム構成を設定してくれる。ターミナルを何枚も開いて手動で複数エージェントを回す運用を、一画面での監督型運用に置き換えることを狙う。\n手動でターミナルを並べて複数エージェントを回す運用が限界を迎える中、その監督作業自体を製品化した点に新しさがある。ローカル実行と中央管理を組み合わせるMulticaとは補完的な関係にあり、こちらはビジュアルな一画面監督とエージェント間ハンドオフの自動化に重心を置く。特定のコーディングエージェントに縛られない中立的な立場のため、複数のエージェントを使い分けながら大量のタスクを捌きたい層に向く。", "temporal": "「耐久性のある実行(Durable Execution)」を提供するワークフローエンジン。処理の途中状態を永続化し、障害やプロセス再起動があっても正確に再開できるため、決済処理などミッションクリティカルな分野で実績がある。長時間動き、失敗し得るステップを多く含むAIエージェントの実行基盤としても採用が拡大しており、リトライ・タイムアウト・人間の承認待ちを堅牢に扱える。クラウド版も提供。\nUberのCadenceを源流に持ち、分散システム界隈では以前から確固たる評価を得てきた技術が、エージェントブームで再び脚光を浴びた形だ。軽量なInngestに対し、こちらは学習コストが高い分、大規模・長期運用での堅牢性に振り切っている。数分で終わるデモではなく、数日単位の処理や人間の承認を挟む業務エージェントを金融級の信頼性で動かしたい場合の本命であり、大手AI企業の本番基盤での採用事例も増えている。", "inngest": "イベント駆動の耐久実行プラットフォーム。関数にステップとリトライを宣言的に定義するだけで、キューやステート管理のインフラなしに信頼性の高いバックグラウンド処理を実装できる。AIエージェントやRAGパイプラインのような「複数ステップ・失敗あり・長時間」のワークフローに適し、エージェント構築キットAgentKitも提供。TypeScript/Python開発者に使いやすい設計。\n重厚なTemporalに対する「軽量で始めやすい耐久実行」という対抗軸で支持を広げてきた。専用クラスタの運用が不要で、Vercelなどのサーバーレス環境にそのまま載る手軽さが持ち味であり、TypeScript中心のスタートアップがAI機能のバックグラウンド処理を固めたい場面で最初に検討されることが多い。エージェント基盤を「まず動かしてから育てる」進め方をしたいチームには、Temporalより現実的な入口になる。", "e2b": "AIエージェントがコードを安全に実行するためのクラウドサンドボックス。Firecracker microVMベースの隔離環境を数百ミリ秒で起動し、エージェントが生成したPython/JSコードの実行、ファイル操作、パッケージインストールを安全に行える。生成コードの実行環境という、エージェント運用の急所を担うインフラとして、データ分析エージェントやコーディングエージェントの裏側で広く使われている。\nエージェントのコード実行環境という新市場を最初に切り開いた存在で、DaytonaやModalのサンドボックス機能が競合に当たる。PerplexityやHugging Faceといった著名サービスでの採用実績を公表しており、この分野の事実上の基準点になっている。LLMが生成したコードを自社インフラで直接実行する危険を避けたい開発者なら、データ分析機能やコード実行付きエージェントを作る際にまず検討すべきインフラだ。", "modal": "Pythonコードをそのままクラウドで実行できるサーバーレス基盤。デコレータを付けるだけで関数をGPU付きコンテナで動かせ、大規模な並列実行や自動スケーリングも数行で実現する。モデルの推論・ファインチューニング・バッチ処理からエージェントのサンドボックス実行まで、AIワークロード全般の実行基盤として開発者人気が高い。インフラ管理を completelyに抽象化する開発体験が売り。\n従来のクラウドではGPU確保やコンテナ整備に数日かかった作業を数分に縮めた開発体験が革命的と評され、AIスタートアップのインフラ標準として急速に広がった。推論APIに特化するBasetenやReplicateより汎用性が高く、学習・バッチ・サンドボックスまで一つの基盤で賄える点が強みだ。インフラ専任者を置けない小規模チームがGPUワークロードを抱える場合に特に効果が大きく、評価額の急上昇も話題になっている。", "daytona": "AIエージェントのための実行環境・サンドボックス基盤。ミリ秒単位で起動する隔離環境でエージェントにコード実行・ファイル操作・ブラウザ利用をさせることができ、環境のスナップショットや永続化にも対応する。もともと開発環境管理ツールとして始まり、エージェント時代に「AIが安全に働くコンピュータ」を提供する方向へ舵を切った。E2Bと並び比較される存在。\n後発としてE2Bを追う立場だが、開発環境管理ツール時代に培った環境構築・永続化の技術を武器に、使い捨てではなく状態を保つサンドボックスという切り口で差別化を図る。起動速度のベンチマークを前面に出した比較マーケティングも特徴的だ。ピボットによってエージェントインフラ市場に賭けた企業の代表例であり、長時間動き続けるエージェントや環境の再現性を重視するユースケースで検討する価値がある。", "amazon-bedrock": "AWSのマネージド生成AI基盤。Claude、Llama、Amazon Nova など多様な基盤モデルを統一APIで利用でき、RAGを構築するKnowledge Bases、エージェントを組み立てるBedrock Agents、入出力を制御するGuardrailsなどを統合している。さらにAgentCoreでは、任意のフレームワークで作ったエージェントを本番運用するためのランタイム・メモリ・ゲートウェイ・監視機能を提供。AWS上でエージェントを構築・運用する際の中核サービスであり、エンタープライズでの採用が急速に進んでいる。\n三大クラウドのAI基盤競争ではAzure AI Foundry、Vertex AIと真っ向から競合するが、特定のモデルベンダーに肩入れしない中立的な品揃えが差別化点となっている。既にAWSへインフラを寄せている企業や、IAM・VPCなど既存のセキュリティ統制の枠内で生成AIを扱いたい企業に向く。国内でも金融・製造など規制の厳しい業界での採用事例が目立ち、派手さより堅実さで選ばれる傾向が強い。", "azure-ai-foundry": "Microsoftの統合AI開発プラットフォーム(旧Azure AI Studio)。OpenAIの最新モデルを含む豊富なモデルカタログ、エージェントを構築・運用するFoundry Agent Service、評価・監視・コンテンツセーフティ機能までを一体で提供する。Microsoft 365やCopilot エコシステム、Entra IDによる権限管理などエンタープライズ要件との統合が強みで、「Azureに寄せている企業がエージェントを作る場所」としての地位を固めつつある。\nOpenAIの最新モデルをいち早く商用利用できる点が他クラウドに対する最大の武器で、モデル中立を掲げるBedrockとは対照的な戦略を取る。ChatGPTで生成AIに触れた企業がそのまま本番開発へ進む導線として機能しており、開発部門と情報システム部門の双方に馴染みやすい。エンタープライズのエージェント案件では最初に比較表に載る存在であり、導入社数の調査でも先行が報じられることが多い。", "vertex-ai-agent-builder": "Google CloudのAI基盤Vertex AI上でエージェントを構築・運用するためのサービス群。オープンソースのADK(Agent Development Kit)で開発したエージェントを、マネージド実行環境のAgent Engineにデプロイし、セッション管理・メモリ・監視まで任せられる。エージェント間連携プロトコルA2Aや、社内検索・エージェント活用基盤のGoogle Agentspaceとも接続し、Geminiを軸にした企業向けエージェント展開の中核を担う。\nGeminiの性能向上と価格競争力を背景に、データ基盤としてBigQueryを使う企業がそのまま採用する流れが強い。三大クラウドの中では検索・グラウンディング技術の質に定評があり、社内データを根拠にした回答精度を重視する場面で選ばれやすい。エージェント相互運用の標準化を主導する立場でもあるため、将来的にマルチベンダーでエージェントを繋ぐ構想を持つ企業ほどGoogle陣営の動向は無視できない。", "copilot-studio": "ノーコード/ローコードでカスタムCopilotや業務エージェントを構築するMicrosoftのツール。グラフィカルな画面で会話フローやトリガー、ナレッジ、アクションを設定し、TeamsやWebサイトなどに配置できる。人の指示なしにイベント起点で動く自律エージェント機能や、Power Platformの豊富なコネクタとの連携が特徴。情報システム部門や業務部門が自らエージェントを内製する入口として、Microsoft 365導入企業で広く使われ始めている。\n前身はPower Virtual Agentsであり、Power Platformの市民開発文化の延長線上にある点が独自の強みだ。汎用自動化ツールとも比較されるが、Microsoft 365のライセンス体系に組み込まれているため追加調達のハードルが低く、稟議が通りやすいのが実務上の利点。一方で複雑なエージェントには表現力の限界も指摘され、本格的な開発はAzure AI Foundry側へ引き継ぐ二層構えが定石になりつつある。", "salesforce-agentforce": "SalesforceがCRMに組み込んだエージェントプラットフォーム。顧客対応・営業支援・サービス業務などのエージェントをローコードで構築し、CRMデータやFlowと連携して実際の業務アクションまで実行させられる。「デジタルレイバー(AIの労働力)」というコンセプトを掲げ、既存のSalesforce導入基盤に乗せて大規模展開を進めており、業務SaaSベンダーによるエージェント参入の代表例となっている。\n既にSalesforceへ顧客データが集約されている企業にとって、外部のエージェント基盤を選ぶよりデータ連携の手間が圧倒的に少ないことが採用の決め手になる。会話数ベースの課金など価格モデルの試行錯誤も話題となり、投資対効果の見極めが導入検討の焦点だ。CRM領域ではMicrosoftやServiceNowとの競争が激化しており、業務SaaSがエージェント市場の主戦場になる流れを最前線で体現している。", "openclaw": "Peter Steinberger氏が開発し、コミュニティとともに育つオープンソースの常駐型AIエージェント(旧Clawdbot/Moltbot)。自分のマシンで動くエージェントに、WhatsApp・Telegram・Slack・Discord・LINE・iMessageなど30以上のチャネルから話しかけられるゲートウェイ設計が核で、「チャットUIから依頼すると成果物が返る」体験を個人やチームで実現できる。スキル共有マーケットのClawHubには1万件を超えるコミュニティスキルが登録され、Discordコミュニティは約17万人規模。一方で強力な権限を持つため、隔離環境での運用などセキュリティ面の設計が課題として語られることも多い。\n個人開発者のプロジェクトから始まりながら、常駐型エージェントというカテゴリ自体を市場に定着させた点で影響力は大きい。既製のアシスタントでは物足りず、自分の環境と権限で自由に動くAIが欲しい技術者に向くが、導入と運用にはある程度の知識が要る。NanoClawやNemoClawといった派生・補完プロジェクトを生む震源地となっており、エコシステムの中心としての地位は当面揺らぎそうにない。", "hermes-agent": "Nous Researchが開発するオープンソースの自己学習型エージェント。「使うほど成長するエージェント」を掲げ、経験からスキルを自動生成して改善し、working/episodic/semanticの3層メモリでセッションを跨いでユーザー像を深めていく学習ループを内蔵する。DiscordやTelegramなど主要チャネルに対応し、公開後急速に注目を集めてGitHubスターは2026年4月時点で約8.7万に到達。OpenClawが「広く繋がる」志向なのに対し、こちらは「深く育つ」志向で、常駐型エージェントの次の方向性を示す存在。\n開発元のNous Researchはオープンモデルの開発で知られる研究集団であり、モデルとエージェントの両輪を握る数少ない存在だ。使い込むほど自分専用に最適化される特性上、単発の作業依頼よりも長期間付き合う相棒を求めるユーザーに向く。学習内容の透明性や制御をどう担保するかは今後の論点だが、記憶と自己改善を常駐型エージェントの標準機能へ押し上げた功績は大きいと評価されている。", "nanoclaw": "OpenClawブームの中で「何でもできる=何でもしでかす」リスクへの反省から登場した、セキュリティ重視の軽量常駐型エージェント。機能を最小限に絞り、コンテナによる隔離実行を前提とした設計で、エージェントに与える権限を明確に制御しながら運用できることを重視する。多機能なOpenClaw、自己学習のHermes Agentに対する「安全側に振った選択肢」として、ホスティングサービスの選択肢にも並ぶようになっている。\n多機能競争とは逆張りの「引き算」の設計思想が支持の理由で、OpenClawの事故事例が報じられるたびに注目が高まる構図にある。会社のマシンで動かしたい、家族の情報を扱わせたいなど、万一の暴走が許されない環境での利用に向く。コード量が小さく読み切れるため、エージェントの内部動作を理解する教材として薦められることも多い。安全側に振りたい層の受け皿として、地味だが着実に存在感を増している。", "nemoclaw": "NVIDIAが2026年3月のGTCで発表した、OpenClawを企業環境で安全に動かすためのオープンソースのセキュリティスタック(公開時点では早期アルファ)。OpenShellサンドボックスによる隔離実行、外部通信をデフォルトで全拒否するネットワークポリシー、機密データをローカル推論へ振り分けるPrivacy Router、詳細な監査ログなどを、OpenClawを置き換えるのではなくプラグインとして被せる設計が特徴。コミュニティ発のブームであるOpenClawをエンタープライズのガバナンス要件に接続する試みであり、NVIDIAがモデル実行基盤からエージェント統治のレイヤーへ踏み出した象徴的なプロダクトでもある。\n情報システム部門が社員のOpenClaw利用を黙認から公認へ切り替える際の現実解と位置づけられ、シャドーAI対策の文脈で語られることが多い。既存環境へ後付けできるため移行コストが小さく、まず監査ログとネットワーク制御だけ導入する段階的な適用も可能だ。完成度はまだ発展途上だが、エージェント統治という新市場に大手が本気で踏み込んだ事例として、競合各社の製品戦略にも影響を与え始めている。", "genspark": "検索から資料作成までを自動化するオールインワンのAIワークスペース。中核の「スーパーエージェント」は、1つのプロンプトから自律的に計画を立て、Web調査、スライド・シート・ドキュメント作成、画像生成、さらには電話予約代行までを実行する。複数のLLMを組み合わせるMoA(Mixture of Agents)構成や、多数のツール・MCP連携を裏側で使い分けるのが特徴で、出典付き構造化ページ「Sparkpage」などの独自機能も持つ。日本でも個人・ビジネス双方で知名度が高く、汎用エージェント競争の最前線を走るサービスの一つ。\n競合はManusやChatGPTのエージェント機能だが、スライドやシートといった成果物の完成度と日本語対応の丁寧さで差別化している。調査からアウトプット作成までを一人で完結させたいビジネス職や、資料の下書きを大量にこなしたい場面に特に向く。無料枠から試せる手軽さもあって非エンジニア層への浸透が速く、汎用エージェントの大衆化を牽引するプレイヤーとして急速に評価を高めている。", "manus": "中国発チームが開発し世界的な話題となった汎用自律エージェント。指示を与えると、クラウド上の自身のコンピュータでWebブラウジング・情報収集・ファイル作成・コード実行を組み合わせ、調査レポート作成やサイト構築のような複合タスクを最後まで遂行する。「タスクを丸ごと任せる」体験を一般ユーザーに広めた存在で、汎用エージェント競争の火付け役となった。\n登場時の熱狂と実力への賛否の両方を通じて、汎用エージェントの評価軸そのものを世に問うた存在だ。GensparkやChatGPTのエージェント機能と競合するが、仮想マシンの画面で作業過程を追える透明性が支持されている。時間のかかる調査や繰り返しの定型作業をまとめて任せたい場面に向き、資金調達や拠点戦略など事業面の動きも常に注目を集める、この分野の台風の目である。", "browser-use": "LLMにブラウザを操作させるためのオープンソースライブラリの代表格。ページのDOM情報をLLMが扱いやすい形に変換し、クリック・入力・ナビゲーションといった操作をエージェントに行わせる。Pythonで数行から始められる手軽さでGitHubスター数が爆発的に伸び、Webエージェント開発の定番となった。クラウドAPI版も提供され、商用サービスの裏側でも採用が進む。\n競合にはStagehandやSkyvernがいるが、OSSとしての勢いとコミュニティ規模ではこの分野の筆頭格だ。とりあえずWebエージェントを試したい開発者の最初の選択肢であり、研究論文やベンチマークでもベースラインとして頻繁に参照される。一方で本番運用ではコストや安定性の課題も語られ、クラウド版や周辺ツールで補う構成が現実的とされる。Web操作エージェントの動向を追うなら、まずここを見ておけばよい。", "stagehand": "ヘッドレスブラウザ基盤のBrowserbase社が開発したAIブラウザ自動化フレームワーク。Playwrightを拡張し、act(自然言語での操作)、extract(データ抽出)、observe(ページ理解)といったAPIを提供する。「全部AI任せ」でも「全部コード」でもなく、決まった部分はコードで、壊れやすい部分は自然言語で書くというハイブリッド設計が特徴で、保守性の高いWeb自動化を実現する。\n「自然言語だけの自動化は本番で壊れる」という実務者の不満に応えた設計で、全部AI任せ型のBrowser Useとの対比で語られることが多い。既にPlaywrightでE2Eテストを書いているチームが段階的にAIを取り入れる経路として最適で、テスト保守コストに悩むQA領域からの関心も高い。Browserbaseとの垂直統合により、フレームワークから実行基盤までを一気通貫で揃えられる点も採用理由になっている。", "browserbase": "AIエージェント向けのヘッドレスブラウザをクラウドで提供する基盤サービス。数千のブラウザセッションを瞬時に立ち上げ、CAPTCHA対応、プロキシ、セッション録画・デバッグ機能などを備える。エージェントが「Webを見て操作する」ためのインフラ層を担い、Stagehandや各種エージェントフレームワークと組み合わせて使われる。Web操作系スタートアップの標準的な裏側になりつつある。\n自前でヘッドレスブラウザ群を運用する苦労を知る開発者ほど価値を実感しやすく、「ブラウザ版のクラウドインフラ」という地位を確立しつつある。競合にはSteelなどのOSS勢や新興サービスがあるが、資金調達規模と採用実績で先行する。エージェント製品を短期間で市場投入したいスタートアップや、スクレイピング基盤の内製をやめたいチームに向く。MCP対応などエージェント標準への追従も速い。", "skyvern": "LLMとコンピュータビジョンを組み合わせてブラウザ操作を自動化するツール。従来のRPAのようにXPathで要素を指定するのではなく、画面を視覚的に理解して操作対象を判断するため、レイアウト変更に強いのが特徴。フォーム入力、請求書ダウンロード、政府系サイトでの申請といった定型業務の自動化に向く。OSS版とマネージドクラウド版が提供されている。\nノーコードRPAの置き換えを狙う実務寄りのポジションで、開発者向けライブラリ色の強いBrowser Useとは客層がややずれる。ログインや認証を含む面倒なサイトでの帳票処理など、地味だが確実に工数を食う業務を任せたい企業に向く。ベンチマークでの高スコアを掲げて精度への自信を打ち出しており、RPA導入で挫折した経験のある組織が再挑戦する選択肢として名前が挙がることが増えている。", "playwright-mcp": "Microsoftのブラウザ自動化ツールPlaywrightの公式MCPサーバー。スクリーンショットの画像認識ではなく、アクセシビリティツリーという構造化データを使ってページを理解・操作するため、高速かつ安定して動くのが特徴。Claude CodeやCursorなどのエージェントに接続すれば、Webのテスト・操作・情報取得を任せられる。ブラウザ操作系MCPの標準的な選択肢。\nMicrosoft公式という安心感と追加コスト不要の気軽さから、エージェントにブラウザ操作を試させる際のデフォルトになった。専用フレームワークと違い、MCP対応クライアントなら実装を選ばず繋がる汎用性が強みだ。特にE2Eテストの自動生成・修復の用途でコーディングエージェントとの相性が良く、QAワークフローへのAI導入の入口として使われることが多い。凝った制御が必要になったら専用ツールへ進めばよい。", "steel": "AIエージェント向けのオープンソース・ブラウザAPI基盤。クラウドまたはセルフホストでブラウザセッションを提供し、スクレイピングやWeb操作エージェントの実行環境となる。セッション管理、プロキシ、アンチボット対策などの実務的な機能を備え、Browserbaseのオープンソース代替として位置づけられる。インフラを自社管理したい開発者に選ばれている。\nセルフホスト可能なブラウザ基盤という立ち位置は、データ主権やコストの理由でSaaSを避けたい層に刺さり、Browserbaseに対する「OSS対SaaS」の対抗軸として語られる。小規模ならOSS版を無料で動かし、スケールが必要になればクラウド版へ移る段階的な導入ができるのが利点だ。エージェント向けブラウザインフラはまだ勝者が確定しておらず、オープンソース戦略でコミュニティを固める動きは注目に値する。", "openrouter": "数百のLLMを単一のAPIで呼び出せるモデルゲートウェイ。OpenAI互換のインターフェースで、OpenAI・Anthropic・Google・Meta系・中国系など主要モデルをすべて扱え、料金は従量課金で一元化される。モデルごとの契約・キー管理が不要になるため、複数モデルを試したい開発者や、モデルをアプリ側で切り替えたいサービスの標準的な選択肢になっている。利用統計の公開でも知られる。\n個人の実験から商用サービスまで利用層は幅広いが、新モデルの登場当日に試せる速さがコミュニティで愛される最大の理由だ。公開されるモデル別利用ランキングは業界トレンドの指標として引用されることも多く、一種のメディア的影響力も持つ。LiteLLMがゲートウェイを自前で立てる選択肢だとすれば、こちらは運用を丸ごと任せる選択肢であり、手数料を払ってでも管理の手間を消したい場合に向く。", "litellm": "100以上のLLM APIをOpenAI形式に統一して呼び出せるオープンソースのプロキシ/SDK。社内にゲートウェイとして立てれば、コスト管理、レート制限、フォールバック、キー管理を一元化でき、「社内LLMゲートウェイ」のデファクトとして企業導入が非常に多い。アプリ側のコードを変えずにモデルを差し替えられるため、マルチモデル戦略の土台になる。商用のエンタープライズ版もある。\nOpenRouterと役割は近いが、外部SaaSに依存せず自社インフラ内で完結できる点が決定的な違いで、規制業界や大企業ほどこちらを選ぶ傾向がある。プラットフォームチームがモデル利用を統制し、部門ごとに予算やアクセス権を割り当てる「社内AI基盤の管理レイヤー」としての採用が典型だ。OpenAI互換形式を業界標準に押し上げた立役者の一つでもあり、マルチモデル運用が広がるほど存在感が増す構図にある。", "ollama": "ローカルマシンでLLMを動かすための定番オープンソースツール。コマンド一つでLlamaやGemma、Qwenなどのモデルをダウンロードして起動でき、OpenAI互換APIも提供するため、ローカル開発やオフライン環境、機密データを扱う用途で広く使われる。GUIアプリも提供され、「手元でLLMを動かす」体験の入口として圧倒的な普及度を誇る。\n競合にはLM Studioやllama.cppの直接利用があるが、CLIとAPIのシンプルさで開発者の支持を集め続けてきた。クラウドAPIのコストや情報漏洩リスクを避けたい企業のPoC、オフライン環境、教育用途など「まず手元で動かす」あらゆる場面の共通基盤になっている。近年は有力なオープンモデルの公開が相次いでローカル実行の実用性が急上昇しており、その恩恵を最も受けやすい立ち位置にいる。", "vllm": "UCバークレー発の高スループットLLM推論エンジン。PagedAttentionという手法でGPUメモリを効率的に使い、同時リクエストを大量に捌けることから、オープンモデルを本番サービングする際の業界標準となっている。主要なモデルアーキテクチャや量子化、分散推論に対応し、多くの推論系スタートアップやクラウドの裏側でも採用されている。自前でLLM APIを立てるならまず候補に上がる。\n対抗馬にはSGLangやTensorRT-LLMがあり推論エンジンの性能競争は激しいが、コミュニティ規模と新モデル対応の速さで首位を維持している。自社でGPUを確保してオープンモデルをサービングする組織には事実上の第一候補で、API利用だけなら直接触れる機会は少ない。新モデルの公開と同時にvLLM対応が発表されるのが慣例化するほどエコシステムの中心にあり、推論最適化研究の実装先としても機能している。", "lm-studio": "ローカルLLMをGUIで扱えるデスクトップアプリ。モデルの検索・ダウンロード・チャット・ローカルAPIサーバー化までを画面操作だけで完結でき、コマンドラインに馴染みのない層にもローカルLLMを開放した。MLX(Apple Silicon最適化)対応など動作環境の幅も広い。アプリ自体は無料だがオープンソースではなく、企業利用向けのライセンスも用意されている。\nOllamaとの棲み分けは明確で、コマンドラインを避けたい層や、量子化の種類を比較しながらモデルを選ぶなどGUIで細かく調整したい層はこちらを選ぶ。ローカルLLM特有のつまずきを丁寧に吸収する作り込みが評価され、非エンジニアの業務利用にも広がっている。機密文書を手元だけで処理したい士業や企画職が導入する例も多く、クラウドに出せないデータとAIをつなぐ現実解として静かに普及が進む。", "groq": "独自開発のLPU(Language Processing Unit)というチップで超高速なLLM推論を提供するサービス。GPUと比べて桁違いのトークン生成速度を実現し、「即答するAI」の体験で注目を集めた。オープンモデルを中心にOpenAI互換APIで提供され、応答速度が体験を左右する音声エージェントやリアルタイム用途で特に選ばれている。\n推論速度という単一の軸で市場に食い込んだ点が独特で、CerebrasやSambaNovaといった同じ独自チップ系の新興と速度競争を繰り広げている。多段のLLM呼び出しを重ねるエージェントでは一回ごとの応答速度が全体の体感を左右するため、エージェント時代の追い風を受けやすい。最強のモデルより「十分賢くて速い」構成が活きる用途、つまり音声対話やリアルタイムUIを作るなら最初に検討すべき選択肢だ。", "together-ai": "オープンソースモデルに特化したクラウドAI基盤。Llama、Qwen、DeepSeekなど数百のモデルの推論APIに加え、ファインチューニングやGPUクラスタの提供まで行う。オープンモデルを「すぐ使えるAPI」として提供する層の代表格で、独自モデルを運用したい企業の学習・推論基盤としても使われる。研究コミュニティとの関係が深いことでも知られる。\nFireworks AIやGroqと同じオープンモデル推論の激戦区にいるが、推論に加えて学習・ファインチューニング・GPUクラスタまで垂直に揃える総合力で差別化する。APIで小さく始め、軌道に乗ったら自社モデルの学習へ進む成長経路を一社で支えられるため、AIを中核に据えるスタートアップに向く。著名研究者が在籍する研究力の高さも競争力の源泉で、オープンモデル陣営の主要プレイヤーであり続けている。", "fireworks-ai": "高速・低コストの推論に特化したAIクラウド。独自の推論エンジンでオープンモデルを最適化して提供し、低レイテンシと高スループットを売りにする。関数呼び出しや構造化出力など、エージェント用途で必要となる機能のサポートも手厚い。Metaの PyTorchチーム出身者らが創業しており、モデルの本番運用における性能チューニングに強みを持つ。\n同じ推論特化のTogether AIやGroqと比較されるが、企業の本番ワークロードに対する最適化支援の手厚さで評価を得ている。オープンモデルを自社製品に組み込みたいがGPU運用はしたくない、しかしレイテンシ要件は厳しい、という中間層の需要にちょうど嵌まる。特定用途向けにモデルを蒸留・チューニングして速度とコストを両立させるアプローチが特徴で、推論コストが経営課題になる規模の企業から選ばれやすい。", "replicate": "機械学習モデルをAPIとして即実行できるプラットフォーム。画像生成、動画生成、音声、LLMなど数千の公開モデルが登録されており、数行のコードで試せる手軽さが特徴。研究者が公開した最新モデルをいち早く動かせる「モデルのショーケース」的な存在で、自分のモデルをコンテナ(Cog)としてデプロイすることもできる。プロトタイピングや個人開発で特に人気が高い。\n本番運用の信頼性ではBasetenなどに譲る面もあるが、「話題のモデルを今日試す」という体験では他の追随を許さない。SNSで新モデルが話題になった数時間後にはもう動かせる、という速度感がコミュニティでの地位を支えている。画像・動画生成系のスタートアップや個人開発者が最初のプロダクトを立ち上げる場として定番で、無数のニッチなモデルの需要を拾うマーケットプレイス的な役割も果たしている。", "baseten": "機械学習モデルの本番デプロイに特化した推論基盤。オープンソースのパッケージングツールTrussでモデルをコンテナ化し、自動スケーリング付きのAPIとして運用できる。専用推論エンジンによる高速化、SLAを意識した信頼性、専有GPUの提供など、スタートアップの本番ワークロードを支えることに焦点を当てており、音声AIや検索系サービスでの採用事例が多い。\n試しやすさではReplicateに譲る代わりに、レイテンシ保証や専有GPUといった「落ちてはいけない本番」の要件に応える路線で成長してきた。大型の資金調達を重ねる有望株で、推論基盤の内製を避けつつ信頼性を確保したい成長期のAIスタートアップが主要な顧客層だ。遅延に厳しい音声AI領域での実績を前面に出しており、推論インフラ市場の中でも本番運用セグメントで確固たる位置を占めつつある。", "elevenlabs": "音声合成(TTS)の代表的サービス。人間と区別がつかないレベルの自然な音声と、数秒のサンプルから声を再現するボイスクローニングで市場を切り開いた。多言語対応、感情表現、音声変換に加え、会話型AIエージェントを構築するプラットフォーム(Agents)も展開し、電話応対やキャラクターの音声対話まで一気通貫で作れるようになっている。音声AI領域の中心的存在。\nOpenAIやGoogleも高品質な音声合成を提供する中、専業ならではの声の表現力と開発者体験で首位を守り続けている。オーディオブックやゲーム、動画ナレーションといったコンテンツ制作から電話応対まで顧客層は広い。評価額の急上昇が続くユニコーンであり、モデルの内製とプラットフォーム化を両立させる戦略はこの分野の教科書的存在だ。声の権利保護やディープフェイク対策への取り組みも業界の基準として注目される。", "vapi": "開発者向けの音声AIエージェント構築プラットフォーム。音声認識(STT)、LLM、音声合成(TTS)を組み合わせたリアルタイム会話のパイプラインをAPIとして提供し、電話の発着信、割り込み対応、ツール呼び出しなどを備えたボイスエージェントを短期間で構築できる。各コンポーネントを好きなベンダーに差し替えられる柔軟性が特徴で、音声エージェント開発のインフラ層を担う。\nRetell AIやBland AIとひとまとめに語られがちだが、コンポーネントの差し替え自由度が最も高い「開発者の部品」志向で、既製の完成度より構成の自由を取りたいチームに向く。音声エージェントのスタートアップが自社製品の土台に使う例が多く、この市場の裏方としての存在感が大きい。音声AIは各層の進化が速いため、ベンダーを固定しない設計思想は将来の変化への保険としても機能する。", "retell-ai": "電話対応に特化したAIエージェント構築基盤。コールセンターの受電・架電を自動化するボイスエージェントを、会話フロー設計・電話番号取得・既存電話システム(SIP)連携込みで構築できる。通話のモニタリングや分析、予約システムやCRMとの連携機能も揃い、「電話業務の自動化」という明確なユースケースに絞った完成度で医療・不動産・金融などの業界で採用が進む。\n自由度で勝負するVapi、規模で押すBland AIに対し、業務システム連携込みの完成度で選ばれる中間的なポジションにある。Y Combinator出身で、コールセンター業務の置き換えという明確な市場に集中する戦略が奏功した。エンジニアが少ない事業会社でも導入しやすい作りで、まず自社の業務フローに合うかを確かめたい企業に向く。電話は音声エージェントの中で最も実導入が進む領域であり、その成長を直接享受している。", "livekit": "リアルタイム音声・映像通信のオープンソース基盤(WebRTC)。数百万人規模の同時接続を支えるメディアサーバーとして実績があり、音声AI時代にはAIエージェント用のフレームワーク(LiveKit Agents)を展開。音声の入出力とLLMをつなぐパイプラインや電話連携を提供し、ChatGPTの音声モードの基盤として使われたことでも知られる。クラウド版も提供される。\n音声エージェント各社の一段下のレイヤーを押さえるインフラ企業であり、VapiやRetell AIのような上位サービスとは競合というより供給関係にある。WebRTCの知見を自前で抱えたくないが遅延品質は妥協できない、というリアルタイムAIの核心的な課題を解決する。大手AI企業との協業実績が信頼の証となり、音声AIブームの最大の受益者の一つとなった。通信の低レベル制御まで必要な本格的アプリなら第一候補だ。", "pipecat": "音声・マルチモーダルAIエージェントを構築するためのオープンソースPythonフレームワーク。Daily社が開発し、STT・LLM・TTSなどをパイプラインとして自由に組み合わせ、リアルタイムの音声会話ボットを構築できる。特定ベンダーに縛られないオープンな設計が特徴で、対応サービスのプラグインが豊富。音声エージェントを自前で組みたい開発者の定番になりつつある。\n商用プラットフォームに任せず音声パイプラインを自分で握りたい開発者の受け皿で、LiveKit Agentsとはこの層の二大選択肢としてよく比較される。ベンダー中立なOSSという性格から、特定サービスの障害や値上げに備えたい企業の本番採用も増えている。開発元のDaily自身がインフラを提供するため、OSSで組んでからマネージドへ寄せる道もある。音声エージェントの内部構造を学ぶ教材としても優れている。", "bland-ai": "電話の発着信を自動化するボイスAIプラットフォーム。自然な音声での通話を大量に並列実行でき、営業のフォローコール、予約確認、カスタマーサポートなどを自動化する。会話フローをパスウェイとして設計する仕組みや、自社インフラでのエンドツーエンド運用による低レイテンシを打ち出す。米国で企業向け電話自動化の代表的プレイヤーの一つ。\n\n---\nセルフサーブで始めやすいVapiやRetell AIに対し、大企業の大量架電案件を直接取りに行くエンタープライズ寄りの戦略が特徴だ。インフラの垂直統合はコストと遅延の面で効く一方、柔軟性では部品型の競合に譲る。数万件規模のアウトバウンドコールなど、規模がものを言う用途で本領を発揮する。営業電話の自動化には規制や倫理面の議論もつきまとうが、電話業務の構造を変えるプレイヤーとして注目度は高い。", "glean": "社内に散らばるデータ(Google Drive、Slack、Jira、Salesforceなど数百のSaaS)を横断検索し、権限を考慮した上で回答するエンタープライズAI検索・アシスタント。社員ごとのアクセス権を尊重したナレッジグラフを構築する点が技術的な核で、「社内版のAI検索」の代表格として大企業への導入が進む。近年は検索にとどまらず、社内業務を自動化するエージェント基盤へと拡大している。\nエンタープライズAI検索市場ではMicrosoft 365 CopilotやGoogleのAgentspaceと競合するが、特定ベンダーのスイートに縛られない中立性が差別化要因になっている。導入コストは高めで、数百人規模以上の組織でSaaSが乱立し情報が分散している企業ほど効果が出やすい。評価額は数十億ドル規模に達し、「社内エージェントの土台」を巡る主戦場の一角を占める。", "perplexity": "Web検索と LLMを組み合わせた「回答エンジン」の代表格。質問に対して出典付きの回答を直接返すスタイルで検索体験を変え、一般ユーザーから急速に普及した。開発者向けには検索グラウンディング付きのAPI(Sonar)を提供しており、エージェントに「最新のWeb情報を根拠付きで引く」能力を持たせる部品としても使われる。ブラウザCometなどプロダクト展開も広い。\n検索市場ではGoogleのAI OverviewsやChatGPT searchと真っ向から競合し、巨人の追撃を受けながらも高速な機能追加で存在感を保っている。日本ではソフトバンク経由の無償提供で利用者が一気に広がった。じっくり出典を確認しながら調べ物をしたい人や、エージェントに安価な検索グラウンディングを持たせたい開発者に向き、評価額の急騰が続く注目株でもある。", "notebooklm": "Googleが提供するソース接地型のリサーチ・ノートツール。アップロードしたPDFや資料、URLだけを根拠として回答・要約するため、一般的なチャットAIより幻覚が起きにくく、出典も明示される。資料の内容を対話形式のポッドキャスト風音声にする「音声概要」が世界的にヒットし、一般層にまで普及した。個人の学習・調査からチームのナレッジ活用(企業向け版)まで用途が広く、「手持ちの資料をAIで使いこなす」という周辺ツールの代表格になっている。\n汎用チャットAIと競合するというより、「与えた資料の範囲内で使うAI」という独自ポジションを確立しており、直接の対抗馬が少ないのが強みだ。論文や社内規程、講義資料など「読むべき文書が既に手元にある」場面で真価を発揮し、学生・研究者・士業での利用が特に多い。Gemini本体との機能統合が進み、Googleの学習・リサーチ領域の看板プロダクトになりつつある。", "notion-ai": "ドキュメント・Wiki・タスク管理を統合したNotionに組み込まれたAI機能。ワークスペース内のページやデータベースを横断して質問に答えたり、文書作成・要約・翻訳を行ったりできる。SlackやGoogle Driveなど外部ソースへの接続にも対応し、「会社のナレッジが集まる場所にAIが同居している」ことの強みを活かす。ナレッジ活用の入口として導入ハードルが低い。\nスタンドアロンのAI検索製品と異なり、既にNotionを全社導入している組織なら追加の情報連携なしで使い始められる点が最大の競争力だ。GleanやMicrosoft Copilotと比べると検索対象の広さでは譲るが、ドキュメント作成と一体化した体験では勝る。料金プランへのAI機能の統合が進み、スタートアップや中小規模チームのナレッジAIの事実上の初手になっている。", "exa": "AI・エージェント向けに設計されたセマンティック検索API。キーワード一致ではなく埋め込みベースの意味検索でWebを探索でき、「この文章に似たページ」のような検索や、結果の全文取得、構造化した調査(リサーチAPI)までを提供する。人間向け検索エンジンの流用ではなく「機械が使う検索」を掲げており、リサーチエージェントやリード発掘などの用途で採用が広がる。\nWeb検索APIの領域ではTavilyやSerper、Brave Search APIなどと競合するが、独自の検索インデックスと埋め込みベースの検索エンジンを自前で構築している点で技術的な独自性が際立つ。深いリサーチや網羅的な調査、類似企業探索のような「キーワードでは表現しにくい検索」が必要な場面で選ばれやすい。ディープリサーチ系エージェントの普及とともに評価を高めている。", "tavily": "AIエージェント専用に設計されたWeb検索API。LLMがそのまま扱いやすい形式で検索結果・抽出コンテンツを返すことに特化しており、RAGやエージェントのツールとして数行で組み込める。LangChainなど主要フレームワークとの統合が充実し、「エージェントに検索能力を持たせる最短ルート」として個人開発から企業まで広く使われている。検索に加えて抽出・クロール機能も提供。\n競合のExaが独自インデックスによる検索品質で勝負するのに対し、こちらは導入の手軽さと料金の分かりやすさで裾野を取る戦略が明確だ。無料枠から始められ、ドキュメントやサンプルが充実しているため、初めてエージェントに検索機能を付ける開発者の最初の選択肢になりやすい。エージェント構築チュートリアルでの登場頻度は突出しており、事実上の入門標準の地位を築いた。", "firecrawl": "WebサイトをLLMが扱いやすいデータ(Markdown等)に変換するクローラー/スクレイピングAPI。URLを渡すだけでJavaScriptレンダリング込みでページを取得し、サイト全体のクロールや構造化データの抽出もできる。RAGの前処理やエージェントの情報収集ツールとして定番化しており、オープンソース版とマネージドAPIの両方が提供されている。開発者人気が非常に高い。\nスクレイピング領域ではApifyやJina Reader、Browserbase系のツールと競合するが、「LLMに食わせる前提のデータ整形」に特化した割り切りが支持の源泉だ。GitHubスターの伸びはこの分野で群を抜き、Y Combinator出身スタートアップとして資金調達も順調に進む。個別ページの取得で済むなら軽量な代替もあるが、サイト全体の定期クロールまで見据えるなら本命となる。", "jina-ai": "検索基盤技術を提供するベルリン発の企業。URLを付けるだけでWebページをLLM向けテキストに変換するReader API、高性能な埋め込みモデルやリランカーなどを提供し、検索・RAGの品質を支える部品として広く使われる。多くの成果をオープンソース・オープンウェイトで公開しており、研究と実務の橋渡し的な存在。エージェントの「読む・探す」能力を強化する。\n商用APIの完成度で勝負するFirecrawlやCohereに対し、埋め込み・リランカーをオープンウェイトで公開し続ける姿勢が独自の立ち位置を作っている。OpenAIの埋め込みからの乗り換え先やセルフホスト運用の候補として名前が挙がることが多く、コストと自社管理を重視するチームに向く。多言語対応の強さから、日本語を含む非英語圏のRAG構築でも採用しやすい。", "guru": "社内ナレッジ管理とAI検索を組み合わせたプラットフォーム。検証済みのナレッジカードという形で情報の鮮度・正確性を担当者が保証する仕組みが特徴で、その信頼できるナレッジを土台にAIが社内の質問に回答する。SlackやChromeから使え、サポートチームや営業チームのイネーブルメント用途に強い。「AIに食わせる社内情報の品質管理」まで含めて設計されている。\n全文検索の網羅性で勝負するGleanに対し、「人が検証した正しい情報だけを検索対象にする」というキュレーション型のアプローチで差別化している。ナレッジの陳腐化が業務事故に直結するカスタマーサポートや営業組織で特に選ばれやすく、中堅規模の企業に導入しやすい価格帯も強みだ。AI回答の信頼性が問われる時代に、情報の鮮度管理という古典的な課題の価値が再評価されている。", "pinecone": "マネージドベクトルデータベースの代表格。埋め込みベクトルの保存・類似検索をフルマネージドで提供し、インフラ運用なしで大規模なRAGやセマンティック検索を構築できる。サーバーレス化により小規模から従量で使えるようになり、ハイブリッド検索やリランキングなど検索品質向上の機能も統合。「ベクトルDBといえばまずPinecone」という認知を確立した先行者。\n先行者として市場を作った一方、現在はQdrantやpgvectorなどOSS勢からの追い上げと価格競争の圧力にさらされている。それでも運用の手間を一切かけたくないチームや、SLAと安定性を重視するエンタープライズでは依然として有力な選択肢だ。ベクトル検索単体のコモディティ化を見据え、リランキングや埋め込み生成まで含めた検索プラットフォームへの拡張を急いでいる。", "weaviate": "オープンソースのベクトルデータベース。ベクトル検索とキーワード検索を組み合わせたハイブリッド検索に強く、埋め込み生成を組み込みで行うモジュール機構、GraphQLベースのAPIなどを備える。セルフホストとマネージドクラウドの両方が選べ、エンタープライズでの採用実績も多い。RAG構築の中核コンポーネントとして、Qdrant・Milvusと並び称される存在。\nQdrantやMilvusとの競争では、生のベクトル検索性能よりも「検索アプリを丸ごと組み立てられる機能の厚み」で勝負するタイプだ。埋め込み生成からRAGまでを一体で扱いたいチームや、複数のモデルプロバイダを組み合わせたい場面に向く。近年はエージェント向け機能やマネージドのEmbeddingsサービスを拡充し、単なるDBから検索基盤プラットフォームへの脱皮を図っている。", "qdrant": "Rustで書かれた高速なオープンソースベクトルデータベース。性能とメモリ効率に定評があり、ペイロード(メタデータ)によるフィルタリングを組み合わせた検索が得意。量子化によるコスト削減機能も充実している。セルフホストのしやすさと無料枠のあるクラウド版により、スタートアップから大規模サービスまで採用が広い。ベンチマーク性能を重視する開発者に好まれる。\nマネージド前提のPineconeとエコシステム重視のWeaviateの間で、素の検索性能とコスト効率を最重視する層の受け皿になっている。大規模サービスの裏側での採用事例が知られ、OSS版と商用クラウドの機能差が小さいことも移行のしやすさにつながる。ベクトルDB間の機能差が縮まる中、フィルタ付き検索や量子化の実装品質という地味だが効く部分での評価が定着している。", "chroma": "開発者体験を重視した軽量なオープンソースベクトルデータベース。pipで入れてすぐ使えるシンプルさから、RAGのプロトタイピングやローカル開発の定番として圧倒的に使われている。アプリ組み込み(エンベデッド)での利用が手軽で、チュートリアルや書籍でもまず登場することが多い。近年はサーバーレスのマネージドクラウドも提供し、本番用途への道筋も整えた。\nプロトタイプ用途の代名詞だった反動で「本番には不向き」と見られがちだったが、分散アーキテクチャへの刷新とサーバーレスクラウドの投入でその評価の書き換えを進めている。まず手元で動かして学びたい個人や、小さく始めて必要になったら移行したいスタートアップに最も向く。検索精度やコンテキスト品質に関する研究発信にも力を入れ、開発者コミュニティでの存在感は根強い。", "milvus": "大規模利用を想定して設計されたオープンソースのベクトルデータベース。数十億ベクトル規模の分散構成に対応し、GPUアクセラレーションや多様なインデックスをサポートする。LF AI & Data財団のプロジェクトとして開発され、開発元のZillizがマネージドクラウドを提供している。軽量版のMilvus Liteから大規模クラスタまで同じAPIで移行できる点も特徴。\n数十億ベクトル級のスケールが現実的な要件になる大企業やプラットフォーム事業者が主戦場で、小規模用途中心のChromaとは対極に位置する。中国発のプロジェクトとして国内外のテック大手での採用実績が厚く、財団管理による中立性もエンタープライズには安心材料だ。GPU推論との親和性を活かした高速化や、Zillizクラウドの海外展開強化が近年の動きとして目立つ。", "pgvector": "PostgreSQLにベクトル型と類似検索を追加するオープンソース拡張。既存のPostgreSQLにそのままベクトル検索を組み込めるため、「専用ベクトルDBを増やさずRDBに寄せる」構成の中核となる。トランザクションやリレーショナルデータとの結合をそのまま使える点が実務上の強みで、Supabase・RDS・Cloud SQLなど主要マネージドPostgreSQLが軒並み対応している。\n専用ベクトルDB各社にとって最大の脅威は他社製品ではなくこの拡張だ、と言われるほど「Postgresで済ませる」構成の引力は強い。データ量が数百万〜数千万ベクトル程度で、既にPostgreSQLを運用しているチームならまず検討すべき選択肢となる。性能面の課題もpgvectorscaleなど補完拡張の登場で縮まりつつあり、ベクトル検索のコモディティ化を象徴する存在になっている。", "llamaparse": "LlamaIndex社が提供するドキュメント解析サービス。表・図・複雑なレイアウトを含むPDFやOffice文書を、LLM/RAGで使いやすい構造化テキストに高精度で変換する。財務資料や技術文書のような「普通のパーサーでは崩れる文書」への強さが売りで、RAGの品質を左右する前処理工程を担う。LlamaCloudの一部として、パイプライン全体のマネージド化も進む。\nドキュメント解析市場ではUnstructuredやReductoと三つ巴の競争にあるが、LlamaIndexのエコシステムと地続きで使える点が固有の強みだ。フレームワークからパース、インデックス構築までを一社で揃えたいチームには導入の摩擦が小さい。解析モードを精度とコストで使い分けられる料金設計も実務的で、RAGの品質問題の多くは前処理に起因するという認識の広がりが追い風になっている。", "unstructured": "PDF、Word、PowerPoint、HTML、メールなど多様な形式の非構造化データを、LLMで使える形に変換するETLツール。文書の要素(見出し・段落・表など)を検出して分割し、埋め込み・格納までのパイプラインを構築できる。オープンソース版が広く使われるほか、企業向けにはコネクタ・スケジューリングを備えたマネージドプラットフォームを提供。RAG前処理の定番。\n商用APIで精度を競うReductoやLlamaParseに対し、OSSとしての普及度とコネクタの幅広さで面を取ってきた存在だ。まず無料で試してからパイプラインを本格化したいチームや、多様な社内文書形式を一括で扱う必要があるエンタープライズに向く。VLMベースの解析への移行が業界全体で進む中、従来型パーサー資産をどう進化させるかが問われる局面にある。", "reducto": "高精度なドキュメント解析APIを提供するスタートアップ。視覚モデルと独自パイプラインを組み合わせ、複雑な表・図表・手書きを含む文書を高い精度で構造化データに変換する。金融・医療・保険など、解析ミスが許されない業界の本番ワークロードでの採用を打ち出しており、精度評価を前面に出したポジショニングが特徴。RAGやデータ抽出の品質を底上げする部品。\nOSSで裾野を取るUnstructuredとは対照的に、精度が収益に直結する金融・医療の本番ワークロードという最上位セグメントを最初から狙う戦略だ。誤読が許されないドキュメントを扱う企業や、ベンチマークで実測比較してから選定したいチームに向く。VLM単体では表や数値の抽出がまだ不安定だという実務者の認識が、専業パーサーの存在意義を支えている。", "airbyte": "データ統合(ELT)のオープンソース標準。数百のコネクタでSaaSやDBからデータを抽出し、ウェアハウスやベクトルDBへ同期する。コネクタをコミュニティが開発・共有するモデルで急成長した。AI文脈では、社内データをRAG基盤へ継続的に流し込むパイプラインとして使われ、ベクトルDBへの直接ロードにも対応。セルフホスト版とクラウド版が提供される。\nデータ統合市場では商用のFivetranが最大の対抗馬で、コネクタの品質・運用の安定性で勝負する相手に対し、OSSによるカスタマイズ性とセルフホストでのデータ主権を武器にする構図が続く。接続先がロングテールで既製コネクタが揃わない企業や、コストを抑えたいチームに向く。AI文脈ではMCP対応やコネクタ自動生成など、エージェントとデータ基盤をつなぐ方向の投資が目立つ。", "dbt": "データウェアハウス内のデータ変換をSQLで管理する業界標準ツール。変換ロジックをコードとしてバージョン管理し、テスト・ドキュメント・リネージを整備する「アナリティクスエンジニアリング」という職能を生み出した。AI文脈では、エージェントに正しいデータを渡すための土台となる整備されたデータモデルとセマンティックレイヤーを提供する役割を担う。\nアナリティクスエンジニアリングの標準としての地位は揺るがない一方、2025年にFivetranとの統合が発表され、データ基盤業界の再編の中心に立つことになった。AI時代には「エージェントが参照すべき信頼できる指標定義はどこにあるか」という問いへの答えとして重要性がむしろ増しており、既にデータウェアハウスを運用しているなら導入しない理由を探す方が難しい定番だ。", "cube": "データの「意味」を定義するセマンティックレイヤーの代表格。指標(売上、解約率など)の定義を一元管理し、BIツールやAIエージェントがどこから聞いても同じ定義で正しい数値を返せるようにする。自然言語でデータに質問するAI分析の精度は指標定義の曖昧さで崩れがちで、Cubeはその問題を解く基盤として位置づけられる。AIによるデータ分析の信頼性を支える中核部品。\nセマンティックレイヤー領域ではdbtのSemantic LayerやLookerのモデリング層と競合するが、BIツール非依存の独立レイヤーとして幅広い接続先を持つ点が強みだ。複数のBIやAIエージェントから同じ指標を参照させたい企業に特に向く。MCP対応やAIエージェント向けAPIの整備を早期に打ち出しており、「AIにデータを正しく答えさせる」需要の高まりを最も直接的に追い風にしている。", "langsmith": "LangChainチームが提供するLLMアプリの開発・監視プラットフォーム。エージェントの実行を1ステップずつ追えるトレーシング、データセットに対する評価、プロンプトの管理・比較などを一体で提供する。LangChain/LangGraphとの統合は当然深いが、フレームワークに依存せず使うこともできる。「エージェントがなぜその挙動をしたか」を調べる際の代表的なツール。\nLLMオブザーバビリティ市場ではOSSのLangfuseと比較される筆頭で、セルフホストの自由度では譲る一方、評価・監視・プロンプト管理の統合度と洗練では先行する。LangChain/LangGraphを本番採用しているチームなら実質的な標準であり、迷う余地は少ない。エージェントの本番導入が増えるにつれ、デプロイ基盤まで含めたプラットフォーム化を進めている。", "langfuse": "オープンソースのLLMオブザーバビリティ基盤の代表格。トレーシング、コスト追跡、評価、プロンプト管理、アノテーションといった機能を備え、セルフホストできることから、データを外に出せない企業やコストを抑えたいチームに広く採用されている。主要フレームワーク・ゲートウェイとの連携も豊富で、「まずLangfuseを立てる」が定番の選択肢になりつつある。ドイツ発。\n商用SaaSのLangSmithに対するOSS代替という立ち位置から出発し、今では自前ホスト可能なLLM監視基盤の事実上の標準に成長した。データ主権の要件が厳しい欧州・日本の企業や、ベンダーロックインを避けたいチームとの相性が良い。コア機能のOSS化を段階的に進めるオープンな姿勢がコミュニティの信頼を集め、導入事例の公開数でも同カテゴリで頭一つ抜けている。", "braintrust": "LLMアプリの評価(Evals)を中心に据えた開発プラットフォーム。プロンプトやモデルの変更が品質に与える影響をデータセットで継続的に測定し、実験の比較、本番ログからの評価データ作成、プレイグラウンドでの試行までを一つの流れとして提供する。「勘ではなく評価に基づいてAIプロダクトを改善する」文化を実装するツールとして、米国のAIプロダクト企業で採用が多い。\nトレーシング起点のLangfuse・LangSmithに対し、評価データセットと実験管理を中心に据える「評価ファースト」の設計思想で差別化する。プロンプト変更のたびに品質を数値で確認するプロセスを組織に根付かせたいチームや、複数モデルを継続比較するAIプロダクト企業に向く。著名テック企業の採用事例と大型調達を背景に、ハイエンド市場での存在感を強めている。", "arize-phoenix": "ML監視企業Arizeが公開するオープンソースのLLMトレーシング・評価ツール。OpenTelemetryベースの計装(OpenInference)でエージェントの実行を可視化し、検索品質や幻覚の評価、実験比較をローカルからでも手軽に行える。ノートブックですぐ立ち上がる手軽さが人気で、商用のArize AXと組み合わせて本番監視までスケールさせる導線が用意されている。\nOpenTelemetryベースの標準規格に乗る設計のため、特定ベンダーへのロックインを避けたいチームの受け皿になっており、この点でプロプライエタリな計装を持つ競合と対照的だ。まずノートブックで無料で始めて、必要になれば商用版へ進む段階的な導入パスが明確で、実験段階のチームや研究者に特に向く。評価用LLMジャッジの品質に関する知見の発信でも存在感がある。", "w-b-weave": "実験管理ツールの定番Weights & BiasesによるLLMアプリ向けの評価・監視ツール。数行のコードでLLM呼び出しを自動トレースし、評価・比較・本番モニタリングまでを行える。MLエンジニアがモデル学習で使い慣れたW&Bの体験をそのままLLMアプリ開発に持ち込める点が強みで、研究寄りのチームからの支持が厚い。CoreWeaveによる買収後もサービスは継続している。\nLLM監視専業の新興勢と異なり、モデル学習の実験管理から推論の監視までを同じ基盤で扱える点が固有の価値だ。既にW&Bで学習ジョブを管理している組織なら追加の学習コストがほぼなく、ファインチューニングとアプリ評価を行き来するチームに最適となる。専業ツールと比べるとLLM特化機能の追加速度が問われる局面もあるが、研究文化の強い組織での信頼は厚い。", "helicone": "LLM APIの手前に置くだけで使えるオブザーバビリティサービス。ベースURLを差し替える(プロキシ方式)だけでリクエストの記録・コスト集計・キャッシュ・レート制限が有効になる導入の手軽さが最大の特徴。ユーザー別・機能別のコスト分析やプロンプト実験機能も備える。オープンソースで公開されており、セルフホストも可能。小さく始めるチームに人気が高い。\n計装SDKを組み込むLangfuse系と異なりプロキシ方式を取るため、コードへの侵入がほぼゼロで済む反面、経路上に単一障害点を挟むことを嫌う組織では議論になる。まずコストの見える化から始めたい小規模チームや、複数プロダクトのLLM支出を横断把握したい管理者に向く。ゲートウェイ機能の強化を進めており、監視ツールからLLMインフラ層への拡張を狙う動きが見える。", "agentops": "AIエージェントに特化した監視・デバッグツール。LLM呼び出しだけでなく、ツール実行、エージェント間のやり取り、セッション全体の流れを時系列で再生でき、マルチエージェントの複雑な挙動を追跡しやすい。CrewAIやAutoGenなど主要フレームワークとの統合が用意され、数行で導入できる。コスト追跡やコンプライアンス用途の記録にも対応する。\n汎用のLLM監視ツールがエージェント対応を後付けで進めるのに対し、最初からマルチエージェントのセッション再生に焦点を絞った専業ポジションが特徴だ。CrewAIなどのフレームワークで複数エージェントを協調させ、どこで連携が破綻したかを追いたい開発者に向く。エージェントの本番導入が進むほど「LLM単発呼び出しの監視では足りない」という認識が広がり、追い風を受けている。", "promptfoo": "プロンプト・モデル・RAGの評価をコマンドラインから行えるオープンソースツール。YAMLでテストケースを書き、複数のプロンプトやモデルの出力品質を表形式で比較できる。CIに組み込んで「プロンプトの回帰テスト」を回す使い方が定着しているほか、プロンプトインジェクションや有害出力を試すレッドチーミング機能も充実。開発者主導の評価文化を支える定番ツール。\nGUIで評価を管理するBraintrust系とは対照的に、設定ファイルとCLIで完結する開発者主導のワークフローを貫く。評価基盤をSaaSに預けたくないチームや、CIパイプラインに品質ゲートを仕込みたいエンジニアに最も向く。近年はレッドチーミングとLLMセキュリティスキャンへ軸足を広げ、評価ツールからAIセキュリティ企業への進化を打ち出して大型調達も実施した。", "deepeval": "「LLMアプリのためのPytest」を掲げるオープンソース評価フレームワーク。忠実性、回答関連性、幻覚などの評価指標が組み込みで用意され、ユニットテストを書く感覚でLLM出力の品質テストを記述できる。RAG評価やレッドチーミング、ベンチマーク実行にも対応。CIでの自動評価に組み込みやすく、テスト駆動でLLM開発を進めたいエンジニアに支持されている。\n評価ライブラリとしてはRagasと並び称される存在で、RAG特化色の強い競合に対し、指標の網羅性とテストフレームワークとしての完成度で幅広い用途をカバーする。裏側にはConfident AIという商用プラットフォームがあり、OSSで始めて結果管理をクラウドに乗せる導線が用意されている。既存のPytest資産と地続きで書けるため、テスト文化が根付いた開発組織との相性が特に良い。", "datadog-llm-obs": "インフラ監視大手Datadogが提供するLLM監視機能。エージェントやRAGのトレーシング、品質・安全性の評価、コスト追跡を、既存のAPM・インフラ監視と同じ画面で扱えるのが最大の強み。すでにDatadogを使っている企業であれば、LLM固有の監視ツールを別途増やさずに本番エージェントの運用監視を統合できる。エンタープライズの本番運用文脈で選ばれやすい。\n専業スタートアップがひしめくLLM監視市場に、既存の顧客基盤と運用体制ごと参入した「統合型」の代表であり、New RelicやGrafanaも同様の路線で追随する。ツールを増やすことを嫌うプラットフォームエンジニアリング組織や、監視の責任部門が明確な大企業に向く。オブザーバビリティ業界全体の統合圧力の中で、LLM監視が独立市場であり続けるかを占う試金石でもある。", "lakera": "生成AIアプリを攻撃から守るセキュリティサービスの代表格。プロンプトインジェクション、ジェイルブレイク、データ漏洩などをリアルタイムに検知するAPI(Lakera Guard)を提供する。プロンプト攻撃を体験できるゲーム「Gandalf」で収集した大量の攻撃データを検知モデルに活かしていることで知られる。エージェントが外部入力を扱う場面の防御層として組み込まれる。チェコ・スイス発。\n2025年にCheck Pointによる買収が発表され、AIセキュリティ専業スタートアップが大手セキュリティベンダーに吸収される業界再編の象徴となった。競合のPrompt SecurityやProtect AIも相次いで買収されており、この領域は独立企業がほぼ残らない統合期に入っている。既製の検知APIを最短で組み込みたい開発チームに向き、検知精度の実データ由来の強さが引き続き評価軸だ。", "guardrails-ai": "LLMの入出力を検証・矯正するオープンソースフレームワーク。「バリデータ」と呼ばれる検証部品(PII検出、有害表現、形式チェックなど)を組み合わせてガードレールを定義し、違反時には再生成や修正を行える。コミュニティがバリデータを共有するGuardrails Hubを持ち、用途に応じた防御を組み立てられる。構造化出力の保証にも強く、実装レベルの安全策として定番。\nSaaS型の検知APIを提供するLakera系と異なり、アプリケーションコードの中に検証ロジックを組み込む「実装レベルの部品」という立ち位置が明確だ。検証内容を自分で細かく制御したい開発者や、外部サービスに入出力を渡せない環境に向く。安全性だけでなく構造化出力の保証という実用ニーズも取り込んでおり、ガードレールという言葉を開発者の共通語彙にした功績も大きい。", "nemo-guardrails": "NVIDIAが公開する対話システム向けのガードレールツールキット。Colangという専用言語で「話してよい話題・拒否すべき話題・応答の流れ」をレール(軌道)として定義し、LLMの会話を制御する。ジェイルブレイク検知や事実性チェックの部品も統合でき、外部ツール実行前の安全確認にも使える。会話型エージェントに方針レベルの制御を入れたい場合の代表的な選択肢。\n検知モデルで攻撃を弾くタイプの製品と異なり、会話の流れそのものを宣言的に設計するアプローチが独自で、直接の競合が少ない。顧客対応ボットのように「話題を業務範囲に閉じ込める」要件が明確な場面で特に力を発揮する。NVIDIAのNIMやNemotron系の安全性モデルと組み合わせる導線が整備されており、同社のエンタープライズAIスタックの一角として位置づけが強まっている。", "llm-guard": "LLMの入出力をサニタイズするオープンソースのセキュリティツールキット。プロンプトインジェクション検知、個人情報の匿名化、有害コンテンツ検出、シークレット漏洩防止などのスキャナーを組み合わせ、入出力の両方向にフィルタを設ける。Protect AI(現Palo Alto Networks傘下)が支援しており、自前の防御層をOSSで構築したい場合の定番部品となっている。\nマネージドサービスに入出力データを渡せない規制産業や、防御ロジックを完全に自社管理したいチームにとっての現実的な選択肢であり、SaaS型のLakeraとは補完関係にある。個別のスキャナーを取捨選択して軽量に組める柔軟さが実装者に好まれる。支援元のProtect AIがPalo Alto Networksに買収された後もOSSとして利用でき、自前ガードレール構築の教材的存在にもなっている。", "prompt-security": "企業の生成AI利用全体を守るセキュリティプラットフォーム。社員のシャドーAI利用の可視化、ブラウザ経由のデータ漏洩防止、自社アプリへのプロンプトインジェクション対策、MCPやエージェントの監視までを一括でカバーする。開発者向けの部品というよりも、CISO視点で組織のAI利用にガバナンスを効かせる製品。イスラエル発で、SentinelOneによる買収が報じられた。\n開発者が自作アプリを守る部品を選ぶLakeraやLLM Guardとは顧客層が異なり、買い手はCISOや情報システム部門だ。従業員による生成AI利用を止めずに統制したい、AI利用ポリシーはあるが実効性がない、といった悩みを持つ企業に向く。ブラウザ拡張ベースで従業員側に展開できる手軽さが特徴で、SentinelOne傘下入りによりエンドポイント防御との統合が進む見通しだ。", "protect-ai": "AIシステムのセキュリティに特化した統合プラットフォーム。モデルファイルの脆弱性スキャン(Guardian)、LLMの攻撃耐性テスト、実行時防御(Layer)など、AIサプライチェーン全体を守る製品群を展開する。huntr(AI特化のバグバウンティ)やOSSツール群の運営でも知られ、2025年にPalo Alto Networksに買収された。エンタープライズのAIセキュリティ体制の中核を担う。\n\n---\n\n*区分・内容は2026年8月時点の公開情報に基づく概略です。各社の提供形態・機能は変化が速いため、導入検討時は公式情報をご確認ください。*\nランタイム防御中心の競合と異なり、モデルファイルのスキャンから脆弱性報奨金制度まで「AIサプライチェーン」という広い概念で市場を定義した点が特徴だ。Hugging Face上のモデルスキャンで得た知見という独自データ資産を持つ。Palo Alto Networksへの合流後は同社のPrisma AIRSに統合され、単体製品としてよりも大手セキュリティ基盤の一機能として使われる形へ移行しつつある。", "yoom": "日本発のノーコード業務自動化プラットフォーム。「フローボット」と呼ばれる自動化フローをトリガーとオペレーションの組み合わせで構築し、データ入力・転記・通知といったデスクワークを自動化する。kintoneやfreeeをはじめとする国内SaaSとの連携の厚さが海外勢(Zapier等)に対する最大の差別化点で、AI-OCRによる書類読み取りや音声の文字起こしなどのAI処理もフローに組み込める。2021年8月のベータ公開以来、国内企業への導入を着実に広げている。\nZapierやMakeといった海外勢が国内SaaSへの対応で後手に回りがちな中、「日本の業務ソフトが最初からつながる」ことを最大の価値として選ばれている。請求書処理や勤怠連携など、日本企業特有の定型業務との相性が良い。ノーコード自動化の入口としてIT部門以外の現場部門が導入するケースが多く、エンジニア向けのn8nとは利用者層が明確に分かれる。", "cloudflare-os": "Cloudflareが2026年8月にApache 2.0でオープンソース化したエージェントプラットフォーム。名前に反して従来型のOSではなく、AIエージェントに隔離された実行環境(Agent Workspace)を与え、外部サービスとの間に「Gatekeeper」と呼ばれるポリシー制御層を挟むことで、データ漏洩を防ぎながらエージェントに実務を任せるための基盤。アプリケーションや業務プロセスを「Gadget」「Blueprint」というモジュールとして再構成し、ACLベースの権限管理の下で組織のワークフローを構築できる。os.cloudflare.app でホスト版も提供される。\nBedrockやAzure AI Foundryといったマネージド基盤に対する「オープンな対抗軸」としての登場であり、Apache 2.0ライセンスと自社ホスト可能な設計が最大の差別化点。エージェントに権限を渡す際の統制(Gatekeeper)を中核に据えた点で、セキュリティ/ガードレール分野の思想を基盤側に取り込んだ存在とも言える。発表直後から注目度は高いが、エコシステムの厚みはこれからが勝負。", "comet": "Perplexityが2025年7月に公開したChromiumベースのエージェント型ブラウザ。組み込みアシスタントがページの要約や質問応答に加え、予約・買い物といった複数ステップのタスクを自律的に実行する。当初は月額200ドルのMaxプラン限定だったが、2025年10月に全ユーザーへ無償開放された。「エージェント型ブラウザ」という製品ジャンルを主流に押し上げ、Chromeへの正面挑戦と位置づけられる先行製品。\nエージェント型ブラウザという新ジャンルを最初にマスマーケットへ届けた製品であり、Perplexityの検索資産と組み合わさることで「調べる→実行する」が1つの画面で完結する体験を確立した。無償開放後はChatGPT Atlasとの直接対決の構図となり、ブラウザシェアという巨大な賭け金を巡る競争の最前線にいる。", "chatgpt-atlas": "OpenAIが2025年10月21日に公開したChatGPT中心のWebブラウザ(まずmacOS版)。サイドバーのChatGPT、閲覧を記憶するブラウザメモリ、そしてサイト上で予約などのマルチステップ作業を代行する「エージェントモード」を備える。発表当日にAlphabet株が約1.6%下落するなど、Chromeの牙城への直接攻撃として市場に受け止められた。\nChatGPTの週次アクティブユーザーという世界最大級の導線をそのままブラウザに流し込める点が最大の強みで、後発ながら本命視される理由でもある。エージェントモードによるサイト操作はOperatorの系譜を引き継いだもの。ブラウザメモリが蓄積する閲覧文脈は、常駐型エージェント化への布石と見られている。", "dia": "The Browser Company製のAIファーストブラウザで、Arcの後継。2024年12月に発表され、2025年6月にmacOSベータ(当初はArcユーザー招待制)、同年10月に一般公開された。タブと会話するチャット、AIオムニボックス、「スキル」とメモリによるパーソナライズが中核で、Arcのパワーユーザー志向とは対照的に万人向けの設計。2025年末にAtlassianが約6.1億ドルで買収し、開発が継続されている。\n熱狂的ファンを持ちながら大衆化に失敗したArcの反省を踏まえ、「普通の人のためのAIブラウザ」に振り切った設計思想が特徴。Atlassian買収は消費者向けブラウザとしては異例の出口で、今後は仕事文脈(Jira/Confluence)との統合による業務ブラウザ化が予想される。CometやAtlasと比べ、エージェントによる自律操作より「読む・書くの支援」に重心がある。", "fellou": "「世界初のエージェント型AIブラウザ」を掲げるスタートアップ製ブラウザ。「Deep Action」と呼ばれる自律ワークフローで、複数サイト横断のリサーチ、レポート生成、タスク実行をユーザーが他の作業をしている間に進める。2025年4月に招待制で公開され、100万ユーザー超を主張。2025年9月には空間UIの「Fellou CE」を発表した。エンジンにはOSSのエージェントフレームワークEkoを採用している。\n大手の参入前から「ブラウザがユーザーの代わりに働く」体験に特化してきた先行者で、複数サイトを横断する長時間の自律タスクの完成度に強みがある。エンジンのEkoフレームワークをOSS公開する開発者志向も特徴。巨大プラットフォームの物量に対し、深い自律性というニッチで生き残れるかが焦点。", "skyfire": "2024年8月に公開された、自律AIエージェントの取引に特化した初の決済ネットワーク。エージェント用ウォレット、検証可能なエージェントID(KYA=Know Your Agent)、USDCレールのオープン決済プロトコルを提供する。Ripple・Google出身者が創業し、Visa・Stripe・Coinbaseの参入より約1年早く「エージェントがお金を使う」領域を開拓した先駆者。\n決済大手が動く1年前から「エージェントがお金を使うにはIDと決済の両方が要る」という問題設定を提示していた先駆者。KYA(Know Your Agent)という概念はこの分野の共通語彙になりつつある。Visa・Stripe・x402という巨人たちの標準争いの中で、中立的な専業プレイヤーとしての立ち位置をどう保つかが問われている。", "stripe-agentic-commerce": "Stripeのエージェントコマース基盤。2025年9月末にOpenAIと共同で、ChatGPT内で購入が完結する「Instant Checkout」と、その裏側のオープン標準「Agentic Commerce Protocol(ACP)」を公開した。Shared PaymentTokenによる委任決済で、エージェントが安全に加盟店との購入を完了できる。Etsyから始まりShopifyの100万超の加盟店へ拡大、Microsoft Copilotなど OpenAI以外への採用も進む。\n「エージェント経由の購入」という新しい売上経路を最初に大規模実装した事例であり、ChatGPTという最大の消費者接点を押さえた意味は大きい。ACPはオープン標準を掲げるが、実装の中心にStripeの決済インフラがある構図は、Web決済でStripeが辿った成功パターンの再現を狙ったものと言える。x402陣営とのプロトコル競争が当面の見どころ。", "visa-intelligent-commerce": "Visaが2025年4月30日に発表した、VisaNetをAIエージェントに開放する取り組み。AI対応のトークン化カード資格情報、エージェントの本人性検証、ユーザーが設定する支出制御をAPIとして提供する。Anthropic・OpenAI・Microsoft・Mistral・Perplexity・Stripeなどがローンチパートナーに名を連ね、2026年を「エージェント決済が主流化する年」と位置づけて推進している。\nカードネットワークという既存の信頼インフラをエージェント時代に持ち込む王道アプローチで、発行体・加盟店・利用者の三者関係を崩さずにエージェントを差し込む設計が特徴。AnthropicからMistralまで主要AIラボを横断的にパートナーに揃えた中立性も強み。決済の主導権をAI企業側に渡さないための、既存金融側の防衛線でもある。", "x402": "Coinbaseが2025年5月に公開したオープン決済標準。長年休眠していたHTTP 402(Payment Required)ステータスコードを復活させ、あらゆるエンドポイントに課金を付け、人でもエージェントでもステーブルコイン(当初はBase上のUSDC)で即時支払いできるようにする。2025年9月にはCloudflareとCoinbaseがx402 Foundationを設立して中立運営に移行。公開から約半年で数千万件規模の取引を処理する急成長を見せた。\nカードレールを介さず、HTTPレベルでマシン同士が直接少額決済するという急進的なビジョンで、API課金やエージェント間取引のような「人間不在の商取引」に最も適合する。Cloudflareとの財団設立で単一企業の色を薄め、標準としての中立性を確保した。ステーブルコイン規制の行方がこの陣営の成長速度を左右する。", "auth0-for-ai-agents": "Okta/Auth0によるAIエージェント向けアイデンティティ基盤。エージェント内でのユーザー認証、ユーザーに代わってサードパーティAPIを呼ぶためのToken Vault、非同期の人間承認(CIBA)、RAG向けの細粒度認可を提供する。LangChain・LlamaIndex・Vercel AI SDKなどと統合済み。2025年4月に「Auth for GenAI」として開発者プレビューを開始し、同 const toolLong=s=>LONG_OVERRIDES[s]||window.GEN.long[s];
const DOMAIN_OVERRIDES={
  linear:"linear.app/agents",
  "github-agent-hq":"github.com/features/copilot/agents",
  kitesurf:"developers.cloudflare.com/browser-run/kitesurf/"

const toolDomain=s=>DOMAIN_OVERRIDES[s]||window.GEN.domains[s];
function iconBox(s){
  const t=TOOL[s];
  const ic=ICON_OVERRIDES[s]||window.GEN.icons[s];
  const tierColor=t.tiers.length?`var(--t-${t.tiers[0]})`:"#B9C0BB";
  if(ic)return `<span class="ic" style="--tier:${tierColor}${DARK_ICON_BG.has(s)?";background:#17212B":""}"><img src="${ic}" alt="" loading="lazy"></span>`;
  const hue=zones[t.zi].cats[t.ci].hue;
  return `<span class="ic mono" style="--tier:${tierColor};--mono-bg:${hue}">${t.name[0].toUpperCase()}</span>`;
}
const tierBadges=tiers=>(tiers||[]).map(k=>`<span class="tier-badge ${k}">${TIERS[k]}</span>`).join("");
/* category-card description: lead sentences of the full write-up (2-3x the one-liner) */
function cardDesc(s){
  const long=toolLong(s);
  if(!long)return TOOL[s].desc;
  let out="";
  for(const x of long.split("。")){
    if(!x.trim())break;
    if(out&&(out.length>=70||out.length+x.length>180))break;
    out+=x+"。";
  }
  return out||TOOL[s].desc;
}
const typeLabel={saas:"SaaS / 商用",oss:"オープンソース",both:"OSS + 商用版あり"};

/* ---------- zoom navigation ---------- */
const ov=document.getElementById("ov");
const ovPanel=document.getElementById("ovPanel");
let zoomSrc=null; // rect of the clicked element, for the zoom-in animation

function openFrom(el){zoomSrc=el.getBoundingClientRect();}

function crumbHtml(items){
  return `<nav class="crumbs">`+items.map((it,i)=>{
    const last=i===items.length-1;
    return (i?`<span class="sep">›</span>`:"")+
      (last?`<span class="cur">${it.label}</span>`:`<a data-hash="${it.hash}">${it.label}</a>`);
  }).join("")+`</nav>`;
}

function categoryGuideHtml(c){
  if(!c.guide)return `<p class="ov-desc-fallback">${c.desc}</p>`;
  const sections=[
    ["こんな人向け",c.guide.audience],
    ["解決する課題",c.guide.problem],
    ["使うと何が嬉しい？",c.guide.benefit],
    ["使う前に",c.guide.caution]
  ];
  const lines=text=>(text.match(/[^。！？]+[。！？]?/g)||[text])
    .map(line=>`<span>${line}</span>`).join("");
  return `<div class="ov-desc" aria-label="カテゴリ解説">${sections.map(([label,text])=>
    `<section class="ov-desc-block"><h3>${label}</h3><p>${lines(text)}</p></section>`
  ).join("")}</div>`;
}

function playZoomIn(){
  if(!zoomSrc){ovPanel.style.opacity="";ovPanel.style.transform="";return;}
  const target=ovPanel.getBoundingClientRect();
  const sx=zoomSrc.width/target.width, sy=zoomSrc.height/target.height;
  const dx=zoomSrc.left+zoomSrc.width/2-(target.left+target.width/2);
  const dy=zoomSrc.top+zoomSrc.height/2-(target.top+target.height/2);
  ovPanel.classList.remove("zooming");
  ovPanel.style.transform=`translate(${dx}px,${dy}px) scale(${Math.max(sx,.2)},${Math.max(sy,.2)})`;
  ovPanel.style.opacity="0.4";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    ovPanel.classList.add("zooming");
    ovPanel.style.transform="none";
    ovPanel.style.opacity="1";
  }));
  zoomSrc=null;
}

function parseHash(){
  const h=location.hash;
  let m;
  if((m=h.match(/^#c\/(\d+)-(\d+)$/))){
    const zi=+m[1],ci=+m[2];
    if(zones[zi]&&zones[zi].cats[ci])return{level:1,zi,ci};
  }
  if((m=h.match(/^#t\/([a-z0-9-]+)$/))&&TOOL[m[1]])return{level:2,s:m[1]};
  return{level:0};
}

function render(){
  const st=parseHash();
  if(st.level===0){
    ov.classList.remove("open");
    document.body.style.overflow="";
    ovPanel.innerHTML="";
    return;
  }
  ov.classList.add("open");
  document.body.style.overflow="hidden";
  if(st.level===1)renderCat(st.zi,st.ci);
  else renderTool(st.s);
  ov.scrollTop=0;
  playZoomIn();
}

/* ---------- category view ---------- */
function renderCat(zi,ci){
  const z=zones[zi],c=z.cats[ci];
  ovPanel.style.setProperty("--hue",c.hue);
  const {inCat,cross}=catRels(zi,ci);

  let html=`<button class="ov-close" data-hash="">× 全体マップへ (Esc)</button>`;
  html+=crumbHtml([{label:"全体マップ",hash:""},{label:`${z.name} / ${c.title}`}]);
  html+=`<h2 class="ov-title">${c.title}</h2>${categoryGuideHtml(c)}`;
  html+=`<div class="relwrap"${inCat.length?' style="margin-top:68px"':''}><svg class="relsvg"></svg><div class="cards">`;
  c.tools.forEach(t=>{
    const [name,type,desc,tiers,bt]=t;
    const s=slug(name);
    html+=`<div class="tcard" data-slug="${s}" data-hash="t/${s}">
      <div class="row1">${iconBox(s)}<span class="nm">${name}</span></div>
      <div class="row2">${tierBadges(tiers)}<span class="mini">${typeLabel[type]}</span>${bt?`<span class="mini">BigTech</span>`:""}</div>
      <div class="d">${cardDesc(s)}</div>
    </div>`;
  });
  html+=`</div></div>`;

  if(c.trend){
    html+=`<div class="pow"><h3>勢力図 — このカテゴリのいま</h3><p>${c.trend}</p></div>`;
  }

  const datedTools=c.tools.map(t=>({s:slug(t[0]),n:t[0]})).filter(x=>yearOf(x.s));
  const yrs=[...new Set(datedTools.map(x=>yearOf(x.s)))].sort();
  if(datedTools.length){
    const singleYear=yrs.length===1;
    const timelineTitle=singleYear?`登場時期 — ${yrs[0]}年のリリース順`:`登場時期(概ねの初登場時期)`;
    html+=`<div class="tl${singleYear?' single-year':''}"><h3>${timelineTitle}</h3><div class="tl-track">`;
    yrs.forEach((y,i)=>{
      if(i&&y-yrs[i-1]>1)html+=`<div class="tl-col gap">…</div>`;
      html+=`<div class="tl-col"><div class="tl-year">${y}</div><div class="tl-items">`+
        datedTools
          .filter(x=>yearOf(x.s)===y)
          .sort((a,b)=>(monthOf(a.s)||99)-(monthOf(b.s)||99))
          .map(x=>`<span class="tl-item" data-hash="t/${x.s}">${iconBox(x.s)}<span class="tl-txt">${monthOf(x.s)?`<span class="tl-m">${monthOf(x.s)}月</span>`:""}<span class="tl-n">${x.n}</span></span></span>`)
          .join("")+`</div></div>`;
    });
    html+=`</div></div>`;
  }

  if(cross.length){
    html+=`<div class="xrel"><h3>他カテゴリとの関係</h3><div class="xrel-items">`;
    cross.forEach(r=>{
      const rt=RTYPES[r.r];
      const F=TOOL[r.f],T=TOOL[r.t];
      const catOf=t=>`${zones[t.zi].name} / ${zones[t.zi].cats[t.ci].title}`;
      html+=`<div class="xrel-item">
        <a data-hash="t/${r.f}">${F.name}</a><span class="cat-of">(${catOf(F)})</span>
        <span class="reltag" style="background:${rt.color}">${rt.label} →</span>
        <a data-hash="t/${r.t}">${T.name}</a><span class="cat-of">(${catOf(T)})</span>
      </div>`;
    });
    html+=`</div></div>`;
  }
  const usedTypes=[...new Set([...inCat,...cross].map(r=>r.r))];
  if(usedTypes.length){
    html+=`<div class="rel-legend"><h3>関係の凡例</h3><div class="items">`+
      usedTypes.map(k=>{
        const rt=RTYPES[k];
        return `<span><span class="sw" style="border-top:2.5px ${rt.dash?"dashed":"solid"} ${rt.color}"></span>${rt.label}</span>`;
      }).join("")+`</div></div>`;
  }
  ovPanel.innerHTML=html;
  const redraw=()=>drawArrows(inCat);
  redraw();                                  // layout is already computed here
  requestAnimationFrame(redraw);             // repeat on next paint just in case
  ovPanel.addEventListener("transitionend",redraw,{once:true}); // after the zoom-in settles
  // card heights shift when webfonts finish loading (or on any reflow) —
  // arrows must be re-routed from the final geometry or they drift onto text
  if(document.fonts)document.fonts.ready.then(()=>requestAnimationFrame(redraw));
  if(cardsRO)cardsRO.disconnect();
  cardsRO=new ResizeObserver(()=>redraw());
  ovPanel.querySelectorAll(".tcard").forEach(el=>cardsRO.observe(el));
}
let cardsRO=null;

function drawArrows(rels){
  const svg=ovPanel.querySelector(".relsvg");
  const wrapEl=ovPanel.querySelector(".relwrap");
  if(!svg||!wrapEl||!rels.length)return;
  const wr=wrapEl.getBoundingClientRect();
  svg.setAttribute("viewBox",`0 0 ${wr.width} ${wr.height}`);
  // rects may be measured mid-zoom while the panel is scaled non-uniformly;
  // stretching the viewBox to the element box cancels that distortion exactly
  svg.setAttribute("preserveAspectRatio","none");
  let defs=`<defs>`;
  Object.entries(RTYPES).forEach(([k,rt])=>{
    defs+=`<marker id="ah-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="${rt.color}"/></marker>`;
  });
  defs+=`</defs>`;

  /* Manhattan routing: arrows travel only through the gutters between cards,
     turning at right angles (rounded corners), so they never cross card text. */
  const R={};
  ovPanel.querySelectorAll(".tcard").forEach(el=>{
    const r=el.getBoundingClientRect();
    R[el.dataset.slug]={l:r.left-wr.left,t:r.top-wr.top,r:r.right-wr.left,b:r.bottom-wr.top,
      cx:r.left-wr.left+r.width/2,w:r.width};
  });
  const cluster=vals=>{
    const s=[...new Set(vals.map(v=>Math.round(v)))].sort((a,b)=>a-b),g=[];
    s.forEach(v=>{if(g.length&&v-g[g.length-1][g[g.length-1].length-1]<=20)g[g.length-1].push(v);else g.push([v]);});
    return g.map(x=>x[0]);
  };
  const all=Object.values(R);
  const rowTops=cluster(all.map(r=>r.t));
  const colLefts=cluster(all.map(r=>r.l));
  const rowOf=r=>rowTops.findIndex(t=>Math.abs(t-r.t)<=20);
  const colOf=r=>colLefts.findIndex(l=>Math.abs(l-r.l)<=20);
  const rows=rowTops.map((t,i)=>{const rs=all.filter(r=>rowOf(r)===i);
    return{top:Math.min(...rs.map(r=>r.t)),bottom:Math.max(...rs.map(r=>r.b))};});
  const cols=colLefts.map((l,i)=>{const rs=all.filter(r=>colOf(r)===i);
    return{left:Math.min(...rs.map(r=>r.l)),right:Math.max(...rs.map(r=>r.r))};});
  // hG(i): y of the horizontal gutter above row i / vG(i): x of the vertical gutter left of col i
  const hG=i=>i===0?rows[0].top-40:(rows[i-1].bottom+rows[i].top)/2;
  const vG=i=>i===0?cols[0].left-22:i===cols.length?cols[cols.length-1].right+22:(cols[i-1].right+cols[i].left)/2;
  const roundedPath=(pts,rad)=>{
    let d=`M${pts[0][0]},${pts[0][1]}`;
    for(let i=1;i<pts.length-1;i++){
      const [x0,y0]=pts[i-1],[x1,y1]=pts[i],[x2,y2]=pts[i+1];
      const l1=Math.hypot(x1-x0,y1-y0),l2=Math.hypot(x2-x1,y2-y1);
      const r1=Math.min(rad,l1/2),r2=Math.min(rad,l2/2);
      d+=`L${x1-(x1-x0)/l1*r1},${y1-(y1-y0)/l1*r1} Q${x1},${y1} ${x1+(x2-x1)/l2*r2},${y1+(y2-y1)/l2*r2}`;
    }
    return d+`L${pts[pts.length-1][0]},${pts[pts.length-1][1]}`;
  };

  let body="";
  rels.forEach((rel,idx)=>{
    const A=R[rel.f],B=R[rel.t];
    if(!A||!B)return;
    const rt=RTYPES[rel.r];
    const lane=(idx-(rels.length-1)/2)*9;          // spread parallel arrows apart
    const clampX=(x,c)=>Math.max(c.l+16,Math.min(c.r-16,x));
    const sx=clampX(A.cx+lane*.6,A), tx=clampX(B.cx+lane,B);
    const rA=rowOf(A),rB=rowOf(B),cA=colOf(A),cB=colOf(B);
    let pts;
    if(rA===rB){
      const gy=hG(rA)+lane;
      pts=[[sx,A.t],[sx,gy],[tx,gy],[tx,B.t]];
    }else{
      const down=rB>rA;
      const gyA=hG(down?rA+1:rA)+lane;
      const gyB=hG(down?rB:rB+1)+lane;
      const exitY=down?A.b:A.t, entY=down?B.t:B.b;
      if(Math.abs(gyA-gyB)<1){
        pts=[[sx,exitY],[sx,gyA],[tx,gyA],[tx,entY]];
      }else{
        // long hop: run vertically inside the column gutter next to the target
        const gx=vG(cA<cB?cB:cB+1)+lane*.8;
        pts=[[sx,exitY],[sx,gyA],[gx,gyA],[gx,gyB],[tx,gyB],[tx,entY]];
      }
    }
    body+=`<path d="${roundedPath(pts,12)}" fill="none" stroke="${rt.color}" stroke-width="2" ${rt.dash?`stroke-dasharray="${rt.dash}"`:""} marker-end="url(#ah-${rel.r})" opacity=".9"/>`;
    // label on the longest horizontal run — always inside a gutter, never on a card
    let best=null,bl=-1;
    for(let i=0;i<pts.length-1;i++){
      if(Math.abs(pts[i][1]-pts[i+1][1])<1){
        const L=Math.abs(pts[i][0]-pts[i+1][0]);
        if(L>bl){bl=L;best=[(pts[i][0]+pts[i+1][0])/2,pts[i][1]];}
      }
    }
    if(best)body+=`<text x="${best[0]}" y="${best[1]-5}" font-size="10" font-weight="700" fill="${rt.color}" text-anchor="middle" stroke="#FAFBF7" stroke-width="3" paint-order="stroke">${rt.label}</text>`;
  });
  svg.innerHTML=defs+body;
}

/* ---------- service view ---------- */
function renderTool(s){
  const t=TOOL[s];
  const z=zones[t.zi],c=z.cats[t.ci];
  ovPanel.style.setProperty("--hue",c.hue);
  const long=toolLong(s)||t.desc;
  const dom=toolDomain(s);

  let html=`<button class="ov-close" data-hash="c/${t.zi}-${t.ci}">× カテゴリへ (Esc)</button>`;
  html+=crumbHtml([
    {label:"全体マップ",hash:""},
    {label:c.title,hash:`c/${t.zi}-${t.ci}`},
    {label:t.name}
  ]);
  html+=`<div class="svc-head">${iconBox(s)}
    <div class="svc-meta">
      <h2 class="ov-title">${t.name}</h2>
      <div class="svc-cat-line">${z.name}レイヤー / ${c.title}</div>
      <div class="svc-badges">${tierBadges(t.tiers)}<span class="mini">${typeLabel[t.type]}</span>${whenLabel(s)?`<span class="mini">${whenLabel(s)}</span>`:""}${t.bt?`<span class="mini">BigTech / 大手提供</span>`:""}
      ${dom?`<a class="svc-link" href="https://${dom}" target="_blank" rel="noopener">https://${dom} ↗</a>`:""}</div>
    </div></div>`;
  html+=`<div class="svc-body">${long.split(/\n+/).map(p=>`<p>${p}</p>`).join("")}</div>`;

  const rels=relOf(s);
  if(rels.length){
    html+=`<div class="svc-rels"><h3>関係のあるツール</h3><div class="xrel-items">`;
    rels.forEach(r=>{
      const rt=RTYPES[r.r];
      const other=r.f===s?r.t:r.f;
      const ot=TOOL[other];
      const dirLabel=r.f===s?`${rt.label} →`:`← ${rt.label}`;
      html+=`<div class="xrel-item">
        <span class="reltag" style="background:${rt.color}">${dirLabel}</span>
        <a data-hash="t/${other}">${ot.name}</a>
        <span class="cat-of">(${zones[ot.zi].cats[ot.ci].title})</span>
      </div>`;
    });
    html+=`</div></div>`;
  }

  const sibs=c.tools.map(x=>slug(x[0])).filter(x=>x!==s);
  if(sibs.length){
    html+=`<div class="svc-sibs"><h3>同カテゴリのツール</h3><div class="sib-cloud">`+
      sibs.map(x=>`<span class="tile" data-hash="t/${x}">${iconBox(x)}<span class="nm">${TOOL[x].name}</span></span>`).join("")+
      `</div></div>`;
  }
  ovPanel.innerHTML=html;
}

/* ---------- event wiring ---------- */
ovPanel.addEventListener("click",e=>{
  const el=e.target.closest("[data-hash]");
  if(!el)return;
  e.stopPropagation();
  const h=el.getAttribute("data-hash");
  openFrom(el.classList.contains("tcard")||el.classList.contains("tile")?el:ovPanel);
  if(el.classList.contains("ov-close")||el.tagName==="A")zoomSrc=null; // going up: no zoom-in effect
  location.hash=h?`#${h}`:"";
  if(!h)history.replaceState(null,"",location.pathname+location.search); // drop dangling '#'
});
ov.addEventListener("click",e=>{
  if(e.target===ov)goUp();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")goUp();
});
function goUp(){
  const st=parseHash();
  if(st.level===2){
    const t=TOOL[st.s];
    zoomSrc=null;
    location.hash=`#c/${t.zi}-${t.ci}`;
  }else if(st.level===1){
    zoomSrc=null;
    location.hash="";
    history.replaceState(null,"",location.pathname+location.search);
  }
}
window.addEventListener("hashchange",render);
window.addEventListener("resize",()=>{
  const st=parseHash();
  if(st.level===1)drawArrows(catRels(st.zi,st.ci).inCat);
});
render(); // handle direct links like page.html#t/devin
</script>
</body>
</html>

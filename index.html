<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIエージェント周辺ツール カオスマップ 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFBF7;
  --grid:#E4E9E0;
  --ink:#17212B;
  --sub:#5B6672;
  --line:#C9D2CC;
  --panel:#FFFFFF;
  --t-pioneer:#B08A2E;
  --t-main:#31517A;
  --t-rising:#3D8B57;
  --t-expert:#6B4F7A;
  --t-security:#A33D3D;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"IBM Plex Sans JP",-apple-system,"Hiragino Sans",sans-serif;
  color:var(--ink);
  background:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:28px 28px;
  line-height:1.5;
}
.wrap{max-width:1360px;margin:0 auto;padding:18px 16px 48px}

/* ---------- compact header ---------- */
header{
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 24px;
  border-bottom:3px solid var(--ink);padding-bottom:12px;margin-bottom:6px;
}
.h-left .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.18em;color:var(--sub)}
h1{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(20px,3.4vw,32px);line-height:1.2}
h1 .accent{color:#B4552D}
.h-right{display:flex;flex-direction:column;gap:4px;margin-left:auto;padding-bottom:2px}
.tier-legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;align-items:center}
.tier-key{display:inline-flex;align-items:center;gap:4px;color:var(--sub);font-weight:500}
.tier-key .ring{width:11px;height:11px;border:2.5px solid #888;background:#fff}
.legend-note{font-family:"IBM Plex Mono",monospace;color:var(--sub);font-size:10px}

/* ---------- zones (dense) ---------- */
.zone{display:flex;gap:8px;margin-top:12px}
.zone-rail{
  flex:0 0 30px;
  writing-mode:vertical-rl;
  font-family:"Shippori Mincho B1",serif;
  font-weight:700;font-size:15px;letter-spacing:.3em;
  color:#fff;text-align:center;padding:12px 0;
  display:flex;align-items:center;justify-content:center;
}
.zone-body{flex:1;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}

/* ---------- category panels: icon clouds ---------- */
.panel{
  background:var(--panel);
  border:2px solid var(--hue,#888);
  padding:8px 10px 6px;
  box-shadow:0 1px 0 rgba(23,33,43,.06);
  cursor:zoom-in;
  transition:box-shadow .15s,transform .15s;
  flex:1 1 auto;
}
.panel:hover{box-shadow:0 4px 14px rgba(23,33,43,.16);transform:translateY(-1px)}
.panel h2{
  font-size:12.5px;font-weight:700;line-height:1.3;
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  margin-bottom:2px;
}
.panel h2 .count{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:400;color:var(--sub)}
.cloud{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:flex-start}
.tile{
  width:74px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px 4px;
  cursor:zoom-in;
  transition:transform .12s;
}
.tile:hover{transform:scale(1.14);z-index:3;position:relative}
.tile .ic{
  width:48px;height:48px;
  background:#fff;border:2.5px solid var(--tier,#98a0a8);
  box-shadow:0 2px 6px rgba(23,33,43,.16);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.tile .ic img{width:36px;height:36px;object-fit:contain}
.tile .ic.mono{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:700;color:#fff;background:var(--mono-bg,#8a8f98)}
.tile .nm{
  font-size:10px;font-weight:700;line-height:1.15;text-align:center;
  max-width:74px;overflow-wrap:break-word;
}

footer{margin-top:28px;border-top:1px solid var(--line);padding-top:10px;font-size:11px;color:var(--sub)}
footer p+p{margin-top:3px}

/* ---------- zoom overlay ---------- */
#ov{
  position:fixed;inset:0;z-index:50;display:none;
  background:rgba(23,33,43,.45);
  backdrop-filter:blur(3px);
  overflow-y:auto;
  padding:4vh 16px 6vh;
}
#ov.open{display:block}
#ovPanel{
  max-width:1080px;margin:0 auto;
  background:var(--paper);
  border:3px solid var(--hue,#888);
  box-shadow:0 18px 60px rgba(0,0,0,.35);
  padding:22px 26px 28px;
  transform-origin:center top;
}
#ovPanel.zooming{transition:transform .28s cubic-bezier(.2,.8,.25,1),opacity .28s}
.crumbs{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font-size:12.5px;font-family:"IBM Plex Mono",monospace;color:var(--sub);
  margin-bottom:14px;
}
.crumbs a{color:var(--ink);text-decoration:none;border-bottom:1px dashed var(--sub);cursor:pointer}
.crumbs a:hover{color:#B4552D;border-color:#B4552D}
.crumbs .sep{color:var(--line)}
.crumbs .cur{font-weight:700;color:var(--ink)}
.ov-close{
  float:right;
  font-family:"IBM Plex Mono",monospace;font-size:12px;
  border:1.5px solid var(--ink);background:#fff;
  padding:4px 10px;cursor:pointer;
}
.ov-close:hover{background:var(--ink);color:#fff}
.ov-title{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(20px,3.6vw,30px);line-height:1.3}
.ov-desc{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;
  max-width:980px;margin-top:16px;
}
.ov-desc-block{
  min-width:0;padding:12px 14px 13px;
  border:1px solid var(--line);border-top:3px solid var(--hue);background:#fff;
}
.ov-desc-block h3{
  display:flex;align-items:center;gap:7px;margin-bottom:7px;
  font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--ink);
}
.ov-desc-block h3::before{
  content:"";width:6px;height:6px;flex:none;background:var(--hue);border-radius:50%;
}
.ov-desc-block p{font-size:13px;color:var(--sub);line-height:1.8}
.ov-desc-block p span{display:block}
.ov-desc-block p span+span{margin-top:3px}
.ov-desc-fallback{font-size:13.5px;color:var(--sub);line-height:1.95;max-width:920px;margin-top:10px}
.tier-badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10.5px;font-weight:700;letter-spacing:.04em;
  padding:1px 7px;color:#fff;
}
.tier-badge.pioneer{background:var(--t-pioneer)}
.tier-badge.main{background:var(--t-main)}
.tier-badge.rising{background:var(--t-rising)}
.tier-badge.expert{background:var(--t-expert)}
.tier-badge.security{background:var(--t-security)}
.mini{
  font-size:10px;font-family:"IBM Plex Mono",monospace;color:var(--sub);
  border:1px solid var(--line);padding:0 5px;
}

/* category view */
.relwrap{position:relative;margin-top:20px}
.relsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:58px 54px;position:relative;z-index:1}
.tcard{
  background:#fff;border:1px solid var(--line);
  padding:11px 12px;cursor:zoom-in;
  box-shadow:0 1px 0 rgba(23,33,43,.06);
  transition:box-shadow .15s,transform .15s;
  display:flex;flex-direction:column;gap:6px;
}
.tcard:hover{box-shadow:0 5px 16px rgba(23,33,43,.2);transform:translateY(-2px)}
.tcard .row1{display:flex;align-items:center;gap:9px}
.tcard .ic{
  width:40px;height:40px;flex:none;
  background:#fff;border:2px solid var(--tier,#98a0a8);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.tcard .ic img{width:30px;height:30px;object-fit:contain}
.tcard .ic.mono{font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:700;color:#fff;background:var(--mono-bg,#8a8f98)}
.tcard .nm{font-weight:700;font-size:14px;line-height:1.25;flex:1}
.tcard .d{font-size:11.5px;color:var(--sub)}
.tcard .row2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.xrel{margin-top:22px;border-top:1px dashed var(--line);padding-top:14px}
.xrel h3,.rel-legend h3,.svc-rels h3,.svc-sibs h3,.tl h3,.pow h3{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--sub);margin-bottom:8px}

/* 勢力図 (category power-map commentary) */
.pow{margin-top:26px;border-top:1px dashed var(--line);padding-top:14px}
.pow p{font-size:13.5px;line-height:1.95;max-width:880px}

/* category timeline */
.tl{margin-top:26px;border-top:1px dashed var(--line);padding-top:14px}
.tl-track{display:flex;overflow-x:auto;border-left:2px solid var(--ink);align-items:stretch}
.tl-col{flex:1 0 auto;min-width:92px;border-right:1px dashed var(--line);padding:0 10px 6px}
.tl-col.gap{flex:0 0 auto;min-width:34px;display:flex;align-items:flex-start;justify-content:center;color:var(--sub);font-family:"IBM Plex Mono",monospace;padding-top:3px}
.tl-year{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:700;border-bottom:2px solid var(--ink);margin-bottom:9px;padding:1px 0}
.tl-items{display:flex;flex-direction:column;gap:7px}
.tl-item{display:flex;align-items:flex-start;gap:6px;font-size:11px;font-weight:700;cursor:zoom-in;line-height:1.2}
.tl-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.tl-n{overflow-wrap:break-word}
.tl-item:hover{color:#B4552D}
.tl-item .ic{width:22px;height:22px;border-width:2px;flex:none;background:#fff;display:inline-flex;align-items:center;justify-content:center;overflow:hidden}
.tl-item .ic img{width:16px;height:16px;object-fit:contain}
.tl-item .ic.mono{font-size:11px}
.tl-m{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:400;color:var(--sub)}
.tl.single-year .tl-col{width:100%}
.tl.single-year .tl-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tl.single-year .tl-item{border:1px solid var(--line);background:var(--panel);padding:8px;min-height:42px}
.xrel-items{display:flex;flex-direction:column;gap:6px}
.xrel-item{font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xrel-item a{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:1px dashed var(--sub);cursor:pointer}
.xrel-item a:hover{color:#B4552D;border-color:#B4552D}
.xrel-item .cat-of{font-size:11px;color:var(--sub)}
.reltag{font-size:10.5px;font-weight:700;color:#fff;padding:1px 8px;flex:none}
.rel-legend{margin-top:18px;border-top:1px dashed var(--line);padding-top:12px}
.rel-legend .items{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--sub);align-items:center}
.rel-legend .sw{display:inline-block;width:22px;height:0;border-top-width:2.5px;margin-right:5px;vertical-align:middle}

/* service view */
.svc-head{display:flex;gap:16px;align-items:flex-start;margin-top:6px}
.svc-head .ic{
  width:76px;height:76px;flex:none;
  background:#fff;border:3px solid var(--tier,#98a0a8);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 3px 10px rgba(23,33,43,.15);
}
.svc-head .ic img{width:56px;height:56px;object-fit:contain}
.svc-head .ic.mono{font-family:"IBM Plex Mono",monospace;font-size:32px;font-weight:700;color:#fff;background:var(--mono-bg,#8a8f98)}
.svc-meta{flex:1}
.svc-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.svc-link{font-family:"IBM Plex Mono",monospace;font-size:12px;color:#31517A;text-decoration:none;border-bottom:1px solid #31517A}
.svc-link:hover{color:#B4552D;border-color:#B4552D}
.svc-body{margin-top:18px;font-size:14.5px;line-height:1.9;max-width:820px}
.svc-cat-line{font-size:12px;color:var(--sub);margin-top:4px}
.svc-rels,.svc-sibs{margin-top:22px;border-top:1px dashed var(--line);padding-top:14px}
.sib-cloud{display:flex;flex-wrap:wrap}
.sib-cloud .tile{width:70px}
.sib-cloud .tile .ic{width:42px;height:42px}
.sib-cloud .tile .ic img{width:31px;height:31px}

@media(max-width:640px){
  .zone{gap:6px}
  .zone-rail{flex-basis:26px;font-size:13px;letter-spacing:.22em}
  .tile{width:64px}
  .tile .ic{width:42px;height:42px}
  .tile .ic img{width:31px;height:31px}
  #ovPanel{padding:16px 14px 22px}
  .ov-desc{grid-template-columns:1fr;gap:8px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:26px 14px}
}
@media print{body{background:none}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="h-left">
    <div class="eyebrow">CHAOS MAP — AI AGENT TOOLING / 2026.08</div>
    <h1>AIエージェント<span class="accent">周辺ツール</span>カオスマップ</h1>
  </div>
  <div class="h-right">
    <div class="tier-legend">
      <span class="tier-key"><span class="ring" style="border-color:var(--t-pioneer)"></span>先駆者</span>
      <span class="tier-key"><span class="ring" style="border-color:var(--t-main)"></span>主力</span>
      <span class="tier-key"><span class="ring" style="border-color:var(--t-rising)"></span>新進気鋭</span>
      <span class="tier-key"><span class="ring" style="border-color:var(--t-expert)"></span>玄人向け</span>
      <span class="tier-key"><span class="ring" style="border-color:var(--t-security)"></span>セキュリティ重視</span>
      <span class="tier-key"><span class="ring" style="border-color:#B9C0BB"></span>特記なし</span>
    </div>
    <div class="legend-note">クリックでズーム / Esc・背景クリックで戻る ※分類は特筆すべきツールのみ・複数あり(2026年8月時点の独自見解)</div>
  </div>
</header>

<div id="map"></div>

<footer>
  <p>収録基準:AIエージェントの開発・構築・実行・運用に使う周辺ツール139個。基盤モデル(GPT / Claude / Gemini 等)そのものは対象外。アイコンは各サービス公式サイトのfaviconを使用。</p>
</footer>

</div>

<div id="ov" aria-modal="true" role="dialog"><div id="ovPanel"></div></div>

<script>
const S="saas",O="oss",B="both";
/* tool: [name, type, shortDesc, tier, bigtech?] */
const zones=[
{
  name:"つくる",color:"#B4552D",
  cats:[
    {title:"自律型開発エージェント",hue:"#B4552D",desc:"チャットやIssueからタスクを委任すると、コードやPRが非同期で返ってくる「AIエンジニア」型のエージェント。2024年のDevin登場で市場が立ち上がり、2025年にモデル各社が参入して開発現場の主戦場となった。",trend:"口火を切ったDevinに対し、モデルを持つ強みを活かしたClaude CodeとOpenAI Codexが2025年に一気に主導権を握った。OSS側はDevinへの対抗で生まれたOpenHandsが老舗格、Claude Code代替を掲げるOpenCodeが急伸中。ミニマル思想のPi Agentは「ハーネスは薄くていい」という対抗軸を示し、OpenClawのエンジンに採用されるなど存在感が大きい。",
     tools:[
      ["Devin",S,"Cognition社の自律型AIエンジニア。Slack等からタスクを丸ごと委任",["pioneer"]],
      ["OpenHands",O,"旧OpenDevin。OSSの自律型開発エージェントプラットフォーム",null],
      ["Jules",S,"Googleの非同期コーディングエージェント。GitHub連携でバックグラウンド実行",null,1],
      ["OpenAI Codex",S,"OpenAIのコーディングエージェント。クラウドで並列タスク実行",["main"],1],
      ["Claude Code",S,"Anthropic製エージェント。CLI・Web・モバイルから開発を委任",["main"],1],
      ["Pi Agent",O,"4ツールのみの超ミニマルOSSエージェント。OpenClawの基盤エンジン",["expert"]],

     ]},
    {title:"アプリ生成 / プロトタイピング",hue:"#C97B3D",desc:"自然言語からUI・アプリを丸ごと生成する「vibe coding」の中心地。プロトタイプ用途から始まり、いまや本番アプリの初期構築まで守備範囲を広げている。",trend:"先行したv0(Vercel)とBolt.newの2強に、欧州発で急成長したLovableが割って入る構図。Replit Agentは構築からDB・デプロイまでの一気通貫で独自路線を走る。Base44のWix買収(2025年6月)が象徴する通り、大手による買収・取り込みが進むフェーズに入った。GoogleはAI StudioとOpalの二面展開で追う。",

      ["Google AI Studio",S,"Gemini公式の開発ハブ。Buildでプロンプトからアプリ生成・公開",null,1],
      ["Google Opal",S,"Google Labs製。ノーコードでAIミニアプリを構築・共有",["rising"],1],
      ["Create",S,"テキストからサイト・アプリ・ツールを生成",null]
     ]},
  ]
},
{
  name:"つなぐ",color:"#3D6B4F",
  cats:[
    {title:"エージェントフレームワーク / SDK",hue:"#3D6B4F",desc:"エージェントをコードで組み立てるための開発基盤。LLM呼び出し・ツール実行・制御フロー・マルチエージェント連携を抽象化する。「とりあえずLangChain」の時代から、用途特化・軽量化へと世代交代が進む。",trend:"老舗LangChainはエコシステムの厚みでなお最大勢力だが、重厚な抽象化への反動から、型安全のPydantic AI、TypeScript圏のMastra・Vercel AI SDKといった軽量世代が支持を拡大。制御を厳密にしたい本番用途はLangGraphが定番化した。Microsoft・OpenAI・Google(ADK)・AWS(Strands)と大手の公式SDK参入が相次ぎ、中立系OSSとの綱引きが続く。",

      ["LlamaIndex",B,"RAG・データ接続に強いフレームワーク。エージェント機能も充実",["pioneer"]],

      ["OpenAI Agents SDK",O,"OpenAI公式の軽量エージェントSDK。ハンドオフ機構が特徴",["main"],1],
      ["Google ADK",O,"GoogleのAgent Development Kit。A2Aプロトコルと連携",null,1],
      ["Mastra",B,"TypeScript向けエージェントフレームワーク。Gatsby開発陣が開発",["rising"]],
      ["Pydantic AI",O,"型安全なPythonエージェントFW。Pydanticチーム製",["rising"]],
      ["smolagents",O,"Hugging Face製の軽量エージェント。コード実行型が特徴",null],
      ["Vercel AI SDK",O,"TS/JSでAI機能を実装する事実上の標準SDK",["main"]],
      ["Haystack",B,"deepset製。検索・RAGパイプライン構築の老舗OSS",["pioneer"]],

  "自律型開発エージェント":"自律型開発エージェントは、自然言語で渡された課題を読み、リポジトリを調査し、実装、テスト、修正、プルリクエスト作成までを一続きの仕事として進めるツール群である。短いコードを補完する従来のAI支援とは異なり、人が常時横で指示しなくても数十分から数時間のタスクを非同期で処理できる点が核になる。主な利用者はソフトウェア開発者や開発組織で、定型的なバグ修正、依存関係更新、テスト追加、バックログ消化などに向く。一方、仕様が曖昧な新規事業や、設計判断に組織固有の背景が強く影響する仕事は、依然として人間のレビューと対話が欠かせない。一般の利用者が直接使う機会は少ないが、社内ツールやWebサービスを運営する企業にとっては開発速度を左右する重要な基盤になりつつある。選ぶ際は、対応する開発環境、権限の分離、変更内容の説明力、テスト成功率、並列実行、料金体系を確認したい。成果を人間が検証できる形で示し、既存のレビュー手順へ無理なく組み込めるかも重要である。",
  "アプリ生成 / プロトタイピング":"アプリ生成・プロトタイピングは、作りたい画面や機能を文章で伝えると、UI、コード、データベース、認証、公開環境までをまとめて用意するサービス群である。デザイン案を眺めるだけでなく、実際に触れるWebアプリを数分で作り、会話しながら修正できるため、企画担当者、デザイナー、個人開発者、起業家がアイデアを検証する場面で特に有効だ。社内の申請画面や小規模な業務ツールなら、非エンジニアでも実用段階まで持っていけることがある。ただし、生成直後のアプリがそのまま安全で保守可能とは限らない。決済、個人情報、複雑な権限、長期運用が絡む場合は、コードレビュー、テスト、監視、データ移行の設計が必要になる。一般の人に最も触れやすい開発カテゴリだが、簡単に作れることと安心して運営できることは別問題である。選定では、生成コードを所有・持ち出せるか、GitHub連携、利用できる技術構成、バックエンドの自由度、公開後の料金を比べるとよい。",
  "エージェントフレームワーク / SDK":"エージェントフレームワークとSDKは、LLMへの指示、ツール呼び出し、状態管理、分岐、再試行、複数エージェントの連携といった処理を、開発者がコードで組み立てるための部品である。チャットサービスそのものではなく、自社アプリや業務システムの中にエージェント機能を実装する際に使う。対象は主にソフトウェアエンジニアで、一般利用者が単独で導入するものではない。簡単な質問応答や一回限りの自動処理ならモデルAPIを直接呼ぶだけで足りることも多く、フレームワークを入れるほど依存関係やデバッグ箇所が増える点には注意が必要だ。長時間処理、人間による承認、途中再開、監査可能な実行履歴などが必要になった段階で価値が大きくなる。選定では、対応言語やモデル数だけでなく、制御フローの明示性、型安全性、テストのしやすさ、観測機能、ベンダーロックイン、将来の移行コストを見るべきである。ノーコード層より自由度は高いが、信頼性を自分たちで設計する責任も増えるカテゴリだ。",
  "ワークフロー自動化 / ノーコード":"ワークフロー自動化・ノーコードは、メール受信、フォーム送信、顧客情報の更新などをきっかけに、複数のSaaSやAI処理をつないで仕事を自動実行するカテゴリである。従来は決められた条件どおりにデータを転記するiPaaSが中心だったが、現在は文章の分類、要約、調査、判断を担うAIエージェントを途中に置けるようになった。営業、マーケティング、カスタマーサポート、バックオフィスなど、プログラミングを主業務にしない人でも効果を得やすく、一般企業にとって最も実用に近い領域の一つである。ただし、AIに任せる範囲を広げすぎると誤送信や誤更新が起きるため、承認ステップ、実行履歴、再試行、権限管理が重要になる。単純な一対一連携はZapierやYoom、複雑な分岐やセルフホストはMakeやn8n、AI中心の処理はGumloopやDifyのように得意分野が異なる。選ぶ前に利用中のSaaSへの対応、月間実行量、国内サービスとの相性、担当者が保守できる難易度を確認したい。",

  "MCP・ツール連携":"MCP・ツール連携は、AIエージェントがカレンダー、CRM、データベース、社内APIなどを読み書きするための接続層である。MCPは接続方法を共通化する規格で、対応するクライアントとサーバーを組み合わせれば、サービスごとに専用プラグインを作る負担を減らせる。主な利用者はエージェントを開発・運用する技術者だが、完成した連携は一般利用者にも、AIへ自然言語で依頼するだけで外部サービスを操作できる体験として現れる。単に会話や文章生成を使うだけなら意識する必要はない。一方で、エージェントに書き込み権限を渡すと、誤操作、過剰なデータ取得、認証情報の漏洩、悪意ある入力によるツール実行が問題になる。接続数の多さだけでなく、OAuthなどの認証、権限の細分化、承認画面、監査ログ、実行環境の隔離が選定の要点である。MCPサーバーの検索・配布、認証付き実行、独自サーバー開発では必要な製品が異なるため、自社が接続を使う側か提供する側かを先に整理したい。",
  "エージェント管理 / 実行基盤":"エージェント管理・実行基盤は、複数のエージェントに仕事を割り当て、進捗や失敗を追跡し、安全な環境でコードや長時間処理を動かすための運用層である。エージェントが単発のチャットを越え、数時間後に結果を返したり、複数案件を並行処理したりするようになると、キュー、再試行、タイムアウト、途中再開、成果物の保存が必要になる。主な対象はAI機能を本番提供する開発チームや、多数のコーディングエージェントを使う組織であり、一般利用者や小規模な自動化ではサービス側に内蔵された実行機能で十分なことが多い。このカテゴリには、耐久性のあるワークフロー、隔離されたコード実行環境、エージェントを人員のように管理する製品が同居しているため、目的を混同しないことが重要だ。選定では、障害時に二重実行を防げるか、実行環境の起動速度と隔離強度、ネットワーク権限、ログ、コスト上限、既存のCIやチケット管理との連携を確認したい。見えにくい裏方だが、デモを安定した業務へ変えるための土台である。",
  "クラウドAIエージェント基盤":"クラウドAIエージェント基盤は、モデル、データ接続、ツール、実行環境、評価、権限管理を一つのクラウド上でまとめて提供し、企業がエージェントを構築・配備するための総合サービスである。AWS、Microsoft、Googleなどの既存クラウドを利用する企業は、社内データやID管理を大きく組み替えずに導入でき、監査、リージョン、契約、サポートを一元化しやすい。主な利用者は情報システム部門、クラウド基盤チーム、大規模な業務システムを持つ開発組織で、個人や小規模チームには設定項目と費用が過剰になりやすい。単純な社内チャットや試作品ならDifyなどの完成品の方が速い場合もある。強みは統制と既存資産との統合だが、各社固有のAPIやデータ基盤へ深く依存すると乗り換えが難しくなる。比較時には、使えるモデルの範囲、データを学習へ利用しない保証、ネットワーク分離、アクセス制御、評価・監視、従量課金の予測可能性を確認したい。製品機能だけでなく、自社がすでに採用しているクラウドとの整合性が選択を大きく左右するカテゴリである。",

  "複数エージェント業務管理":"複数のAIエージェントへ並行して仕事を任せたい人向け。会社のチームだけでなく、一人で複数案件を回す個人にも合う。Issueやタスクで仕事を分け、担当、期限、成果を一覧で見たい場合に役立つ。現在の代表製品は開発業務から普及しているが、分類軸は業種や利用人数ではなく、仕事を管理する役割である。エージェントを別々の画面から動かすと、誰に何を頼んだか分からなくなる。途中経過や失敗、成果物も散らばり、同じ指示を重ねることがある。数が増えるほど、AIを監督する作業そのものが新しい負担になる。人だけのタスク管理では、エージェントの実行状況を十分に追えない場合もある。AIを担当者としてタスクへ割り当て、進捗、相談、成果を一つの場所で追える。複数の仕事を並行させても、どこで人の判断が必要か分かりやすい。個人は一人チームの司令塔として使える。組織では人とAIの責任分担を共有できる。人は優先順位、承認、レビューへ集中しやすくなる。これは仕事を整理して監督する製品であり、作業を行うエージェント本体とは限らない。常駐型AIエージェントと組み合わせる場合もある。曖昧な依頼を大量に渡せば、確認作業が増える。アクセス権、同時実行数、費用上限、失敗時の責任者を決め、小さな案件から運用を固めたい。",
  "常駐型AIエージェント":"会話を窓口に、継続して調査、通知、外部操作を任せたい人向け。個人秘書として使う個人にも、共通の窓口を置きたいチームにも合う。予定やメッセージを理解し、必要な時間に自ら動くAIを求める場合に役立つ。現在はセルフホストに慣れた先進ユーザーが中心だが、対象は個人に限らない。一般的なチャットAIは、会話が終わると仕事も止まりやすい。毎回同じ前提を説明し、メールや予定、ファイルを人が確認して渡す必要もある。定期的な見回りや通知、返答待ちをまたぐ仕事は、一回ごとのチャットでは続けにくい。チームで使う場合も、共通文脈を持つ実働役がいないと依頼が分散する。メッセンジャーから依頼すると、過去の文脈を引き継いで実際の作業を進められる。調査や整理を続け、決めた時刻に通知し、許可された外部ツールも操作できる。個人なら自分専用の相棒になる。チームなら共通の受付や実働担当として使える。複数エージェント業務管理の配下で動く実働役にもなれる。常駐する分、メール、ファイル、端末など広い権限を持ちやすい。悪意あるメッセージを命令として取り込む危険もある。最初は読み取りだけにし、送信、削除、購入には人の確認を残したい。保存先、記憶の削除、実行ログ、費用、障害対応を決め、権限を段階的に広げる必要がある。",
  "汎用AIエージェント / スーパーエージェント":"汎用AIエージェント、いわゆるスーパーエージェントは、一つの依頼から作業計画を立て、Web調査、資料収集、表計算、文章作成、スライド生成などを横断して最終成果物まで作るクラウドサービスである。専用のフローを事前に組まなくても、旅行計画、市場調査、営業リスト、比較レポートといった幅広い仕事を任せられるため、一般利用者や企画・営業職にも入口が分かりやすい。短時間でたたき台を得る用途には強いが、調査元の取り違え、計算ミス、途中での方針逸脱が起きることがあり、完成品を無条件に採用する使い方には向かない。機密資料をアップロードする場合はデータ保持方針にも注意が要る。また、ChatGPTやClaudeなど基盤サービス自身が同様の実行機能を備え始めており、独立製品を契約する必然性は成果物の質や固有連携に左右される。比較では、途中経過と出典を確認できるか、失敗時にやり直せるか、生成物を編集可能な形式で持ち出せるか、実行時間と追加料金、社内データへの接続範囲を見るとよい。",
  "ブラウザ / コンピュータ操作":"ブラウザ・コンピュータ操作は、AIエージェントが人間向けのWeb画面やデスクトップアプリを読み、クリック、入力、スクロール、ファイル操作を行うための開発ライブラリと実行基盤である。APIが用意されていない古い業務システムや、複数サイトを横断する手続きを自動化できるため、エージェントに現実の仕事を任せる最後の接点になる。主な利用者は開発者や自動化担当者で、一般の人が直接ライブラリを扱うものではない。完成した機能は予約、データ登録、テスト、調査などの形で利用者に届く。画面操作はAPI連携より壊れやすく、レイアウト変更、ポップアップ、二要素認証、通信遅延で失敗しやすい。さらに、閲覧中の文章に埋め込まれた命令をAIが誤って実行するプロンプトインジェクションや、誤クリックによる購入・削除も重大なリスクになる。選定では、DOMやアクセシビリティツリーを使うか画像認識を使うか、ブラウザの隔離、セッション管理、再現可能なログ、人間の承認、失敗時の復旧、並列実行の費用を確認したい。",
  "AIブラウザ":"AIブラウザは、Web閲覧の画面そのものにAIを組み込み、開いているページへの質問、要約、文章作成に加えて、複数サイトをまたぐ調査や入力作業まで代行させるエンドユーザー向け製品である。別タブのチャットへ文章を貼り付ける必要がなく、閲覧中の文脈をそのまま使えることが最大の利点で、学生、知識労働者、買い物や旅行を頻繁に行う一般利用者にも分かりやすい。開発者向けのブラウザ操作基盤とは異なり、利用者自身が毎日のブラウザとして使うことを前提にしている。ただし、閲覧履歴、ログイン状態、入力内容を広く見られるため、通常のAIサービス以上にプライバシーと権限管理が重要になる。エージェントによる予約や購入はまだ誤操作の可能性があり、最終確認を省くべきではない。既存のChromeやSafariにもAI機能が統合されつつあるため、専用ブラウザへ移る価値は、検索品質だけでなくタブ整理、メモリ、作業代行の完成度で判断したい。履歴の保存範囲、学習利用の有無、拡張機能との互換性、企業管理、対応OSも選定ポイントになる。",
  "LLMゲートウェイ":"LLMゲートウェイは、OpenAI、Anthropic、Google、各種OSSモデルなど異なる生成AIを、共通のAPIから呼び出せるようにする中継層である。アプリ側の実装を大きく変えずにモデルを切り替え、用途や価格、速度、障害状況に応じて自動ルーティングできる。利用量、コスト、遅延、エラーを一か所で記録し、部門別の上限や禁止モデルを設定する役割も持つため、複数モデルを使う開発組織や企業のAI基盤担当者に向く。一般利用者が直接触るものではなく、一つのモデルを少量使うだけの小規模アプリでは、ゲートウェイを挟む複雑さや追加障害点の方が大きい場合がある。また、各モデル固有の新機能を共通仕様へ丸めると、最新能力を十分に使えないこともある。選定では、対応モデル数よりも、ストリーミングやツール呼び出しへの追随速度、ログ内の機密情報を隠す仕組み、再試行とフォールバック、レート制御、課金の透明性、セルフホスト可否を見るべきだ。モデル競争が続く間、乗り換え余地を保つ保険として価値がある。",
  "ローカルLLM実行":"ローカルLLM実行は、生成AIモデルをクラウドAPIへ送らず、自分のPC、社内サーバー、オンプレミス環境で動かすためのツール群である。機密文書を外部へ出したくない企業、ネット接続のない現場、API従量課金を避けたい大量処理、モデルを細かく試したい開発者や研究者に向く。OllamaやLM Studioのような製品により個人でも始めやすくなったが、一般利用者が高性能なクラウドAIの完全な代替として期待すると、速度、品質、メモリ容量、初期設定で戸惑いやすい。小型モデルは文章整理や分類には十分でも、高度な推論や最新知識では大規模な商用モデルに及ばない場合がある。社内運用では、モデルを置くだけでなく、API化、同時接続、更新、監視、脆弱性対応を担う人員も必要だ。選定では、MacやWindowsでの手軽さを重視するのか、GPUサーバーでの処理量を重視するのかを分け、対応ハードウェア、量子化形式、モデル管理、コンテキスト長、商用利用ライセンス、電力と設備費まで含めて比較したい。",
  "クラウド推論基盤":"クラウド推論基盤は、LlamaやQwenなどの公開モデルや独自に調整したモデルを、GPUを自前で購入・管理せずにAPIとして高速実行するサービスである。アクセスの増減に合わせた自動拡張、複数モデルの選択、専用エンドポイント、バッチ処理などを提供し、OSSモデルを使った製品を本番運用する開発チームに適している。一般利用者が直接契約する場面は少なく、ChatGPTのような完成サービスとは異なる。単に最高性能のモデルを数回使うだけなら、モデル企業の公式APIの方が簡単なことも多い。この層の価値は、速度、単価、モデルの自由度、データ管理を自社要件に合わせられる点にあるが、安価に見える単価でも待機GPUやデータ転送、ピーク時の追加容量で費用が変わる。選定では、最初のトークンが返るまでの時間と生成速度、対応リージョン、可用性保証、スケール時の上限、モデル更新の速さ、微調整モデルの持ち込み、ログの保持方針を比較したい。クラウドごとのGPU供給力と最適化技術が体験を大きく左右する。",
  "音声 / 対話エージェント":"音声・対話エージェントは、人の発話を認識し、内容を理解して処理を行い、自然な音声で即座に返答する電話・音声UIのためのカテゴリである。音声認識、LLM、音声合成、通話回線、割り込み処理を組み合わせ、予約受付、問い合わせ対応、督促、営業電話、音声アシスタントなどを自動化する。導入主体はコールセンター、店舗、医療機関、営業組織とそれらを支援する開発者で、一般利用者は電話の相手として触れることが多い。文字チャットより操作が自然な一方、数秒の遅延、聞き間違い、不自然な間、相手の割り込みに弱いだけで体験が崩れる。本人確認、録音への同意、緊急時の人間への転送、発信規制も欠かせない。音声の自然さだけで製品を選ばず、往復遅延、雑音下の認識率、電話番号やSIPとの連携、同時通話数、会話の評価、通話単価、対応言語、障害時のフォールバックを比較すべきである。高リスクな相談や複雑な苦情を完全自動化せず、適切な地点で人へ引き継ぐ設計が現実的だ。",
});
Object.assign(CATEGORY_DESCRIPTIONS,{
  "AI検索 / リサーチ":"AI検索・リサーチは、Webや指定した資料を検索し、複数の情報を読み比べて、出典付きの回答や調査レポートを作るサービス群である。検索結果のリンクを一件ずつ開く代わりに、質問の分解、追加検索、要約、論点整理までを連続して行う。一般利用者、学生、企画、営業、研究職まで幅広く使いやすく、最新動向の把握、比較検討、会議前の下調べに向く。通常のチャットAIとの違いは、モデルが覚えている知識だけで答えず、検索時点の外部情報や手元の資料を根拠にすることだ。ただし、出典が付いていても、そのページ自体が誤っていたり、引用と結論がずれていたりするため、重要な判断では原文確認が必要になる。有料記事、社内情報、検索されにくい専門資料は拾えない場合もある。選定では、検索範囲、引用位置の正確さ、深掘りの回数、最新情報への追随、ファイル対応、共有・書き出し、検索内容の保存方針を見るとよい。単純な事実確認は通常検索で十分だが、問いが広く情報源が多いほど価値が高まる。",
  "エンタープライズナレッジ":"エンタープライズナレッジは、社内の文書、チャット、メール、チケット、CRMなどに散らばる情報を横断検索し、社員やAIエージェントへ業務上の文脈を届ける企業向けの層である。就業規則を探す、過去案件の経緯を追う、顧客対応前に関連情報を集めるといった作業を、自然言語の質問から行える。導入主体は情報システム部門、ナレッジ管理担当、大規模な営業・サポート組織で、個人や小規模チームにはNotionや共有ドライブの標準検索で十分なことが多い。単に全データを一か所へコピーするのではなく、元システムのアクセス権を検索結果にも反映し、更新に追随することが重要である。権限処理を誤ると、本来見えない人事情報や顧客情報をAIが回答してしまう。導入前には、対象データの整理、重複や古い文書の扱い、責任ある情報所有者も決めたい。比較では、コネクタの深さ、アクセス制御、更新頻度、回答の根拠表示、社内用語への適応、監査、既存ポータルやエージェントへの組み込みやすさを見るべきだ。",
  "Web検索 / データ取得API":"Web検索・データ取得APIは、AIエージェントやアプリがプログラムからWebを検索し、ページ本文や構造化データを受け取るための開発者向けサービスである。人が検索画面を使うAI検索とは異なり、検索語、件数、対象ドメイン、期間などを指定し、その結果を別のワークフローやRAGへ組み込む。競合調査、ニュース監視、企業情報収集、サイト更新検知、URL群の一括解析など、繰り返し大量に情報を集める処理に向く。一般利用者が直接APIを契約する必要はほぼなく、完成した調査機能の裏側で利用される。検索だけを提供する製品、ページのクロールと本文抽出まで担う製品、意味の近さで情報を探す製品では役割が異なる。robots.txt、利用規約、著作権、個人情報、アクセス頻度への配慮も必要だ。選定では、対象範囲と鮮度、JavaScriptサイトへの対応、抽出形式、重複除去、引用可能なメタデータ、速度、レート上限、失敗率、1回または1ページ当たりの料金を比較したい。入力データの信頼性が、その後のエージェント回答の品質を決める。",
  "ベクトルDB / RAGストア":"ベクトルDB・RAGストアは、文章や画像を意味を表す数値列であるエンベディングに変換して保存し、質問と意味の近い情報を高速に探すためのデータ層である。社内文書を根拠に答えるチャット、商品検索、類似事例の提示などで、LLMへ渡す資料を選ぶ役割を担う。主な利用者はAIアプリ開発者やデータ基盤担当者で、一般利用者が直接操作するものではない。RAGを作るからといって必ず専用DBが必要なわけではなく、データ量が小さい段階ではPostgreSQLのpgvectorや既存検索基盤で十分なことも多い。専用製品は、大規模データ、低遅延、メタデータ絞り込み、ハイブリッド検索、複数テナント運用で価値を発揮する。検索精度はDBだけで決まらず、文書の分割方法、エンベディングモデル、再ランキング、評価データにも左右される。選定では、規模と更新頻度、バックアップ、アクセス制御、検索方式、運用負荷、クラウド間の持ち出しやすさ、総費用を確認し、流行より現在の要件に合う最小構成を選びたい。",
  "ドキュメント解析 / 前処理":"ドキュメント解析・前処理は、PDF、画像、帳票、表、スライドなどの非構造化ファイルから、文章、見出し、表のセル、座標、メタデータを取り出し、LLMや検索が扱える形へ整えるカテゴリである。RAGでは回答モデルより前段の読み取り品質が結果を左右するため、目立ちにくいが重要な工程になる。主な利用者はAI開発者、データ担当者、契約・経理・医療など大量文書を扱う業務部門で、一般利用者は完成した文書検索や入力自動化を通して恩恵を受ける。文字だけの単純なPDFなら標準ライブラリで足りるが、スキャン画像、複雑な表、二段組み、手書き、図表を含む資料では専用製品の差が出る。抽出結果がもっともらしく誤ると後工程で発見しにくいため、元ページとの対応表示、信頼度、サンプル検証が欠かせない。選定では、対応形式と言語、OCR精度、表とレイアウトの保持、バッチ処理、ページ単価、処理時間、データ保存地域、独自ルールによる補正、人間確認の組み込みやすさを比べたい。",
  "データパイプライン / セマンティックレイヤー":"データパイプライン・セマンティックレイヤーは、業務システムからデータを集め、整形・更新し、売上や顧客数といった指標の意味を共通定義して、AIが正しい数字を扱えるようにする基盤である。Airbyteのような連携、dbtのような変換、Cubeのような指標定義はAI以前から存在するが、エージェントが自然言語で分析する時代になり再び重要性が増した。対象はデータエンジニア、分析チーム、経営指標を扱う企業で、一般利用者やデータ量の少ない小組織が直接導入するものではない。LLMにデータベースをそのまま読ませると、同じ売上でも税込・税抜や受注・入金の定義を取り違え、もっともらしい誤答を返す。整備されたパイプラインと意味層は、その曖昧さを減らす。選定ではコネクタ数だけでなく、差分更新、障害からの復旧、データ品質テスト、変更履歴、権限、指標の再利用、AIから安全に問い合わせる方法を見るべきだ。派手なエージェント機能より先にデータの定義を整える方が、企業では効果が大きいことも多い。",
  "評価 / オブザーバビリティ":"評価・オブザーバビリティは、エージェントがどの指示とデータを使い、どのモデルやツールを何回呼び、なぜその結果になったかを記録し、品質、速度、コスト、失敗を測る運用カテゴリである。通常のソフトウェアは同じ入力に同じ結果を期待できるが、LLMは出力が揺らぐため、正解例を使った継続評価や実利用ログの分析が必要になる。主な利用者はAIアプリ開発者、ML担当、運用チームで、一般利用者が直接触れることは少ない。小さな試作ではログを目視すれば足りるが、顧客向けに公開し、モデルやプロンプトを更新し、複数エージェントが動く段階では不可欠になる。すべての会話を保存すると個人情報や機密情報が監視基盤へ集まるため、マスキング、保持期間、アクセス権も設計しなければならない。選定では、トレースの見やすさ、ツール実行の再現、評価データセット管理、人による採点、オンライン監視、モデル比較、費用集計、既存監視との統合、OSSとSaaSの運用負担を比べたい。測れないエージェントは改善も説明もできない。",
  "セキュリティ / ガードレール":"セキュリティ・ガードレールは、AIへの入力と出力、参照データ、ツール実行、モデルやファイルの供給経路を監視し、情報漏洩や不正な行動を防ぐための防御層である。代表的な脅威には、文書やWebページ内の命令でエージェントを操るプロンプトインジェクション、個人情報や秘密鍵の出力、有害回答、過剰な権限による削除・送信がある。主な利用者はAIサービスを開発するチーム、セキュリティ部門、規制産業で、一般利用者は製品に組み込まれた保護を通じて恩恵を受ける。単なる文章生成より、メール送信、購入、社内システム更新などを行うエージェントほど重要度が高い。一つの検知モデルですべてを防ぐことはできず、最小権限、入力検査、出力検査、隔離実行、人間承認、監査を重ねる必要がある。選定では、守る対象が社員のAI利用か自社アプリかモデル資産かを明確にし、検知精度、誤検知、遅延、対応言語、データの送信先、ポリシーの説明可能性、既存SIEMやID基盤との連携を確認したい。",
  "エージェント決済 / アイデンティティ":"エージェント決済・アイデンティティは、AIエージェントが利用者や企業の代理として商品やAPIを購入するときに、誰の権限で動き、何にいくらまで支払えるかを証明・制御する新しい信頼層である。従来のカード番号やAPIキーをそのまま渡すのではなく、用途、金額、期限、加盟店を限定した資格情報やウォレットを発行し、実行者であるエージェント自体も識別する。現在の主な利用者は決済事業者、EC、フィンテック、エージェント開発者で、一般の人が設定画面を直接使う機会はまだ少ない。ただし将来、旅行予約、仕入れ、従量課金APIの利用をAIへ任せる際には日常的な基盤になり得る。誤購入、不正な誘導、乗っ取り、返金、責任主体、マネーロンダリング対策など、技術以外の課題も大きい。選定や標準化では、カードとステーブルコインのどちらを使うかだけでなく、利用者の明示同意、支出上限、即時停止、監査証跡、加盟店側の受け入れ、紛争処理、地域ごとの規制対応を確認する必要がある。まだ実験段階の要素が多く、用途を限定した導入が妥当である。",
});
zones.forEach(z=>z.cats.forEach(c=>{c.desc=CATEGORY_DESCRIPTIONS[c.title]||c.desc;}));
